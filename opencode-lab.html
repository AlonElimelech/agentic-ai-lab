{
  id: 6,
  title: 'Planning Before Coding',
  short: 'Planning First',
  icon: '6',
  difficulty: 'Intermediate',
  minutes: 30,
  track: 'Building',
  why: 'The cheapest place to reject work is before it exists. A wrong plan costs you thirty seconds of reading; the same wrong idea expressed as eleven changed files costs you an afternoon of review and the risk that you miss something. Agents are fast enough that skipping the plan feels efficient — which is exactly why teams end up reviewing code they would never have asked for.',
  objectives: [
    'Explain why a plan is cheaper to reject than a diff',
    'Ask for a plan in a form that is actually reviewable',
    'Review a plan against five specific questions',
    'Break work into milestones and identify risk before writing code'
  ],
  concept: [
    { h: 'Why plans beat diffs',
      body: [
        {table:{head:['','Plan','Diff'],rows:[
          ['Time to read','30 seconds','10–40 minutes'],
          ['Cost to reject','Nothing','The work, plus the review that found it'],
          ['What it reveals','Intent and assumptions','Consequences'],
          ['Wrong assumption shows up as','One sentence you disagree with','Eleven files built on it']
        ]}},
        {p:'The asymmetry is the entire argument. Reviewing a plan is the highest-leverage minute in the workflow, and it is the step people skip because the agent seems ready to start.'},
        {note:{kind:'best',title:'The threshold',body:'Ask for a plan whenever the change touches more than one file, changes a public contract, or you cannot picture the diff in your head. Below that, plan-first is ceremony — just do it.'}}
      ]},
    { h: 'Asking for a reviewable plan',
      body: [
        {p:'"Give me a plan" produces a numbered restatement of your request. A reviewable plan has to be asked for specifically — you want the assumptions and the risks, because those are what you are actually checking.'},
        {code:{name:'planning prompt that works',body:'Read @app/main.py, @app/db.py, @docs/known-issues.md.\n\nGoal: add a GET /health endpoint and a first pytest suite\ncovering create_order.\n\nBefore writing any code, give me:\n  1. the files you will create or change, and why each is needed\n  2. the assumptions you are making about this codebase\n  3. what could break, and what you would check to be sure\n  4. anything you think is out of scope for this task\n\nNo code yet. If something is ambiguous, ask instead of guessing.'}},
        {p:'The last line matters more than it looks. Without it, ambiguity gets resolved silently in the agent\'s favour and you never learn which decision was made for you.'}
      ]},
    { h: 'Reviewing the plan — five questions',
      body: [
        {list:[
          '**Is the scope right?** Look hardest for extra work you did not ask for. "While I am here I will also refactor..." is the most common form of scope creep, and it arrives disguised as helpfulness',
          '**Are the assumptions true?** This is where the real defects live. An assumption you can falsify in ten seconds would have cost you an hour as code',
          '**Is anything missing?** Tests, error handling, and documentation are the usual omissions',
          '**Does it fit the architecture?** Cross-check against `architecture.md` and the layout section of `AGENTS.md`',
          '**Is it small enough to review?** If the resulting diff would take you 40 minutes to read, split it before it exists'
        ]},
        {note:{kind:'warn',title:'The assumption you did not notice',body:'"I will add the health check to `main.py`" is fine. "I will add a `config.py` for the port" is a new module you never approved. Plans are where new structure appears quietly — read for nouns you did not introduce.'}}
      ]},
    { h: 'Milestones',
      body: [
        {p:'A milestone is a slice that is independently reviewable, independently testable, and independently committable. If any of those three is false, it is not a milestone — it is a piece of one.'},
        {table:{head:['Bad slicing','Good slicing'],rows:[
          ['"Do the backend", "do the tests"','"Fix the SQL injection + its test", "add /health + its test"'],
          ['One 500-line change','Four changes of ~100 lines, each committable'],
          ['Split by file type','Split by behaviour that can be verified'],
          ['"Refactor everything, then add the feature"','"Add the feature", then "refactor, no behaviour change"']
        ]}},
        {p:'Keep refactoring in its own milestone with its own commit. A diff that changes behaviour *and* moves code is the hardest kind to review — you cannot tell which change caused which effect.'}
      ]},
    { h: 'Risk before code',
      body: [
        {p:'Ask the agent to name the risks, then decide which ones you care about. It is genuinely good at enumeration and has no standing to judge severity — that judgement is yours.'},
        {code:{name:'risk prompt',body:'For the plan above, list what could go wrong, ordered by how bad\nit would be. For each: how would we detect it, and what is the\ncheapest way to reduce it?'}},
        {table:{head:['Risk class','In this service','Cheap mitigation'],rows:[
          ['Data loss','Schema change with no backup of `orders.db`','Copy the file before running'],
          ['Contract break','Changing a route path consumers depend on','Freeze paths; add new routes instead'],
          ['Silent wrong behaviour','Float rounding in totals','A test asserting an exact expected total'],
          ['Security regression','Copying the `API_TOKEN` pattern','`security.md` in `instructions`, plus review']
        ]}},
        {p:'Any risk without a detection method is not managed — it is just written down. "How would we notice?" is the question that turns a risk list into a test list.'}
      ]},
    { h: 'When not to plan',
      body: [
        {p:'Plan-first is a tool, not a ritual. Skip it for a one-line fix, a rename, a typo, or anything where you can already picture the exact diff. The cost of ceremony is real: teams that plan everything stop reading plans.'}
      ]}
  ],
  enterprise: [
    {p:'Plan review is the natural place to put a human gate, because it is the last moment where changing direction is free. It is also the artefact that makes AI-assisted work explainable after the fact.'},
    {list:[
      '**Paste the approved plan into the PR description.** Reviewers then see intent alongside the diff, and the "why is this file here" question answers itself.',
      '**One milestone, one commit, one reviewable unit.** This is what keeps AI-assisted changes reviewable at all as volume rises.',
      '**Treat rejected plans as cheap wins, not waste.** A plan you rejected is the system working. Teams that never reject plans are not reading them.',

{
  id: 8,
  title: 'Reviewing AI Work',
  short: 'Reviewing AI Work',
  icon: '8',
  difficulty: 'Advanced',
  minutes: 35,
  track: 'Quality',
  why: 'Review is the load-bearing wall of this entire course. Everything before it — context, plans, milestones — exists to make review possible; everything after it depends on review having actually happened. And it is the step under the most pressure, because the code arrives fast, looks professional, and carries no visible signal of where it is wrong. Confident, well-formatted, subtly incorrect code is the hardest thing a reviewer ever has to catch.',
  objectives: [
    'Review a diff rather than a summary, using a repeatable scan',
    'Detect omissions — the failure mode a diff does not show you',
    'Use the agent against its own work without treating it as proof',
    'Reject and correct a change specifically enough to be actionable'
  ],
  concept: [
    { h: 'The summary is a claim; the diff is evidence',
      body: [
        {p:'When an agent says "I parameterised the query and added a test," that is a description of intent, generated from the same process that produced the code. If it misunderstood the task, the summary will confidently describe the misunderstanding.'},
        {code:{name:'the only review surface that counts',body:'git diff                    # unstaged changes\ngit diff --staged           # what you are about to commit\ngit diff HEAD~1             # what the last commit did\ngit diff --stat             # how big is this really'}},
        {note:{kind:'danger',title:'The single most common failure in AI-assisted teams',body:'Reading the summary instead of the diff. It takes 5 seconds, feels like review, and catches nothing — because a summary generated from a wrong understanding describes that wrong understanding accurately.'}}
      ]},
    { h: 'A repeatable six-point scan',
      body: [
        {p:'Review in a fixed order. Ad-hoc reading finds what is interesting; a fixed scan finds what is wrong.'},
        {table:{head:['#','Check','The question'],rows:[
          ['1','**Scope**','Did anything change outside the files this task named?'],
          ['2','**Intent**','Does every changed line serve the stated goal?'],
          ['3','**Correctness**','Trace one real input through the new code by hand'],
          ['4','**Omissions**','What is missing — tests, error paths, validation, docs?'],
          ['5','**Conventions**','Does it match `AGENTS.md` and `coding-style.md`?'],
          ['6','**Blast radius**','Who else calls this? What else reads this data?']
        ]}},
        {p:'Point 1 catches the most problems for the least effort. `git diff --stat` first: if a file you did not expect appears, stop and find out why before reading a single line of logic.'},
        {p:'Point 3 is the one that cannot be delegated. Pick a concrete input — `qty=0`, an id of `1 OR 1=1`, an empty customer name — and follow it through the new code yourself. Reading for plausibility is not reading for correctness.'}
      ]},
    { h: 'Reviewing what is not there',
      body: [
        {p:'A diff shows additions and deletions. It cannot show you the validation that was never written, the error branch that was never handled, or the test for the case nobody considered. Omissions are invisible by construction, and they are where the real defects live.'},
        {table:{head:['Commonly missing','How to catch it'],rows:[
          ['The failing-first test','Did you watch it fail? If not, it may assert the bug'],
          ['Input validation','Trace the worst input you can think of'],
          ['The error path','What happens when the row does not exist?'],
          ['Doc updates','Is `api.md` still true after this change?'],
          ['The sibling caller','Grep for other callers of the changed function']
        ]}},
        {code:{name:'the omission prompt',body:'Here is the diff you just produced.\n\nList everything the task required that is NOT in this diff.\nInclude tests, validation, error handling and documentation.\nBe specific. Do not fix anything — just list the gaps.'}}
      ]},
    { h: 'Using the agent against its own work',
      body: [
        {p:'Two prompts are genuinely useful here, and both have a limit you must respect.'},
        {code:{name:'explain — checks your understanding',body:'Explain what this change does, line by line, and why each\nline is necessary. If any line is not necessary, say so.'}},
        {code:{name:'risks — best in a FRESH session',body:'Review this diff as a hostile security reviewer who did not\nwrite it. List every way it could fail or be abused, worst\nfirst. Do not defend the code.'}},
        {note:{kind:'warn',title:'Self-review is a hint generator, not evidence',body:'An agent reviewing its own work in the same session is defending a position it already took. Run adversarial review in a **new** session, and treat everything it finds as a lead to check yourself — never as a clean bill of health.'}},
        {p:'The "explain" prompt has a second use that is easy to miss: if the explanation does not match what you read in the diff, one of you has misunderstood the code — and it is worth finding out which.'}
      ]},
    { h: 'Rejecting well',
      body: [
        {p:'A vague rejection produces a vague retry. Name the line, the problem, and the constraint that was violated.'},
        {table:{head:['Weak rejection','Actionable rejection'],rows:[
          ['"This is wrong"','"`find_order` still concatenates on line 14 — bind it like `delete_order`"'],
          ['"Add error handling"','"When the id does not exist this returns `None` and FastAPI serialises `null` with a 200. Raise a 404"'],
          ['"Too complicated"','"This adds a `config.py` the plan did not include. Put the constant in `main.py` for now"'],
          ['"Try again"','"Keep `db.py`. The test only asserts no exception — assert the other row still exists"']
        ]}},
        {note:{kind:'best',title:'When to stop correcting and start over',body:'Three corrections on the same change is the signal. At that point the task was underspecified, not the output. `git checkout .`, add the missing constraint, and re-issue it once.'}}
      ]}
  ],
  enterprise: [
    {p:'Review is where accountability for AI-assisted code actually lives. Every organisational control around it exists to keep that accountability real as volume rises.'},
    {list:[
      '**If you cannot explain it, it does not ship.** The simplest, strongest rule available. It makes reviewability a merge requirement rather than an aspiration.',
      '**Reviewer fatigue is the real risk at scale.** An agent can produce more code per day than a team can review properly. The bottleneck is human attention — which is precisely why milestones and commit size are governance controls, not style preferences.',
      '**Do not label AI-authored PRs as lower-risk.** They are frequently reviewed *less* carefully because they look polished. Same bar, same scan, same reviewer.',
      '**Put the approved plan in the PR body.** A reviewer who can compare intent against diff catches scope creep in seconds instead of guessing.'
    ]},
    {note:{kind:'info',title:'Diff-driven review as an audit trail',body:'A commit history of small, single-purpose, individually reviewed changes is legible six months later. One 900-line "add feature" commit is not — regardless of who or what wrote it.'}}
  ],
  exercise: {
    intro: 'You will commission a change that is easy to get subtly wrong — input validation on `create_order` — then review it properly and reject what fails.',
    steps: [
      { t:'Commission the change', body:[
        {p:'Fresh session, deliberately without over-specifying, so there is something real to find:'},
        {code:{name:'opencode prompt',body:'Read @app/main.py, @app/db.py and @AGENTS.md.\n\nAdd validation to POST /orders: qty must be a positive integer\nand price must not be negative. Reject invalid input properly.\nAdd tests.'}}
      ]},
      { t:'Scope first — before reading any logic', body:[
        {code:{name:'terminal',body:'git diff --stat'}},
        {p:'Which files changed? Was `db.py` touched when only `main.py` and `tests/` should have been? Did a `config.py` or a new module appear? Anything unexpected here is investigated before you read a line of the change.'}
      ]},
      { t:'Run the six-point scan', body:[
        {code:{name:'terminal',body:'git diff'}},
        {list:[
          '**Scope** — only the files the task implies?',
          '**Intent** — does every line serve validation?',
          '**Correctness** — trace `qty=0`, `qty=-1`, `price=-5` and `qty="3"` by hand',
          '**Omissions** — is there a test per rule, or one test for both?',
          '**Conventions** — does it raise `HTTPException` with a 4xx, or return `{"error": ...}` with a 200 as `AGENTS.md` forbids?',
          '**Blast radius** — does anything else call `create_order`?'
        ]},
        {note:{kind:'tip',title:'The likely finding',body:'Pydantic will often be used for the constraint, which is correct and idiomatic — but check the failure response is a 422/400 and that a test actually asserts the status code, not merely that a request was refused.'}}
      ]},
      { t:'Ask for the omissions', body:[
        {code:{name:'opencode prompt',body:'List everything my task required that is NOT in this diff.\nInclude tests, error handling and documentation.\nBe specific. Do not fix anything yet.'}},
        {p:'Compare its list against your own from the scan. Anything you missed is worth noting; anything it missed tells you how far to trust the technique.'}
      ]},
      { t:'Adversarial review in a fresh session', body:[
        {p:'Start a **new** session so it is not defending its own work:'},
        {code:{name:'opencode prompt',body:'Read @app/main.py and @tests/.\n\nReview the validation on POST /orders as a hostile reviewer\nwho did not write it. List every way it could fail or be\nbypassed, worst first. Do not defend the code.'}},
        {p:'Check each claim against the source yourself. Some will be real, some will be theatre — telling them apart is the skill.'}
      ]},
      { t:'Reject specifically', body:[
        {p:'Write one actionable rejection for the most serious thing you found. Name the line, the problem, and the rule it breaks. For example:'},
        {code:{name:'opencode prompt',body:'Two problems:\n\n1. tests/test_main.py asserts only that the request was rejected.\n   Assert the exact status code as well.\n2. AGENTS.md says errors must raise HTTPException with a 4xx.\n   Line 31 returns a dict with a 200. Fix that.\n\nChange only those two things.'}}
      ]},
      { t:'Re-review and commit', body:[
        {p:'Run the six-point scan again on the corrected diff — a fix is a change, and changes get reviewed. Then update `api.md` and commit.'},
        {code:{name:'terminal',body:'pytest -q\ngit diff\ngit add -A\ngit commit -m "Validate qty and price on POST /orders"'}}
      ]}
    ]
  },
  expected: 'A reviewed and corrected validation change, a written list of what the first attempt got wrong, and a commit you could defend line by line in a code review.',
  validation: [
    { l:'You ran `git diff --stat` before reading any logic', d:'Scope problems are the cheapest to catch and the most expensive to miss.' },
    { l:'You traced at least three concrete inputs by hand', d:'`qty=0`, `qty=-1`, `price=-5`. Reading for plausibility is not reviewing for correctness.' },
    { l:'You found at least one real defect or omission', d:'A weak test assertion, a wrong status code, or a missing doc update.' },
    { l:'The adversarial review ran in a fresh session', d:'Same-session self-review defends the position it already took.' },
    { l:'Your rejection named a line and a rule', d:'Vague rejections produce vague retries.' },
    { l:'You re-reviewed after the correction', d:'A fix is a change. Changes get reviewed.' },
    { l:'You can explain every line in the final commit', d:'If you cannot, it does not ship.' }
  ],
  bestPractices: [
    'Read `git diff`, never the summary. The summary describes intent, including mistaken intent.',
    'Run the same six-point scan every time: scope, intent, correctness, omissions, conventions, blast radius.',
    '`git diff --stat` first. An unexpected file is a stop sign.',
    'Trace real inputs by hand — the worst ones you can think of.',
    'Run adversarial review in a fresh session, and verify what it claims.',
    'Reject with a line number, a problem, and the rule that was broken.',
    'Three corrections means the task was underspecified. Reset and re-issue once.'
  ],
  mistakes: [
    { bad:'Approving because the tests pass.', good:'Tests written alongside the code test what the code does. Check that they assert the right thing.' },
    { bad:'Reading the change for plausibility.', good:'Trace a concrete bad input through the code by hand. Plausible and correct are different properties.' },
    { bad:'Asking the same session "is this correct?"', good:'It will say yes. Adversarial review needs a fresh session, and its findings still need checking.' },
    { bad:'Reviewing AI-authored code more leniently because it looks polished.', good:'Polish is not correctness. Same bar as any colleague\'s PR.' },
    { bad:'Only reviewing what changed.', good:'Omissions never appear in a diff. Ask explicitly what is missing.' }
  ],
  summary: [
    'The summary is a claim generated by the same process that wrote the code; the diff is the evidence.',
    'Use a fixed six-point scan: scope, intent, correctness, omissions, conventions, blast radius.',
    'Omissions are invisible in a diff — ask directly what the task required and is missing.',
    'Agent self-review is a hint generator; run it fresh and verify every claim yourself.',
    'Reject with specifics. After three corrections, the task was underspecified — reset.'
  ],
  checkpoint: [
    { q:'Why is the agent\'s summary of its change not sufficient for review?',
      options:['It is too short','It describes intent — including a misunderstanding, described accurately','It omits line numbers','It is written after the fact'],
      answer:1,
      explain:'The summary is generated by the same process that produced the code. If the task was misunderstood, the summary confidently describes that misunderstanding, so it can never reveal the error.' },
    { q:'Which review step catches the most problems for the least effort?',
      options:['Reading every line of logic','Checking scope with `git diff --stat` first','Running the tests','Asking the agent to explain'],
      answer:1,
      explain:'An unexpected file in the diff is a fast, unambiguous signal that something went beyond the task. Catching it takes seconds and saves reading logic that should not exist at all.' },
    { q:'Omissions — a missing test or unhandled error path — are hard to catch because:',
      options:['They are usually intentional','A diff can only show what changed, never what is absent','Tests hide them','They are rare'],
      answer:1,
      explain:'A diff is a record of additions and deletions, so anything never written leaves no trace in it. That is why asking explicitly what the task required and is missing is a separate review step.' },
    { q:'You have corrected the same change three times. The right move is:',
      options:['Correct it a fourth time','Reset, add the missing constraint, and re-issue the task once','Accept it and fix the rest by hand','Switch models'],
      answer:1,
      explain:'Repeated correction on one change means the task itself was underspecified rather than the output being unlucky. Adding the missing constraint and starting clean is faster than steering an attempt built on a wrong premise.' }
  ]

{
  id: 9,
  title: 'Validation: Proving It Works',
  short: 'Validation',
  icon: '9',
  difficulty: 'Advanced',
  minutes: 35,
  track: 'Quality',
  why: '"The tests pass" is the most over-trusted sentence in software, and agents make it more dangerous — because the same process that wrote the code frequently wrote the tests. Validation is the separate, deliberate act of proving a change is correct, safe, and did not break something else. Review asks *is this code right?*; validation asks *can I demonstrate it?*',
  objectives: [
    'Work through the validation ladder rather than stopping at green tests',
    'Generate the edge cases agents systematically forget',
    'Run targeted security and performance passes',
    'Think in regressions: what else touches this code or this data?'
  ],
  concept: [
    { h: 'The validation ladder',
      body: [
        {p:'Six rungs, in order. Each is cheap relative to the one below it, and stopping early is the normal failure — almost everyone stops at rung two.'},
        {table:{head:['#','Rung','Question'],rows:[
          ['1','**It runs**','Does the service still start at all?'],
          ['2','**Tests pass**','Does `pytest -q` go green?'],
          ['3','**Edge cases**','What about zero, negative, empty, huge, missing, malformed?'],
          ['4','**Style and lint**','Does it match the conventions, mechanically checked?'],
          ['5','**Security**','Can this input, path or permission be abused?'],
          ['6','**Regression**','What else calls this, reads this, or depends on this?']
        ]}},
        {note:{kind:'warn',title:'The trap in rung two',body:'If the agent wrote both the code and its tests in one pass, green means "consistent with itself". A test that never failed before the fix is not evidence — it is a matching pair of assumptions.'}}
      ]},
    { h: 'Edge cases agents systematically miss',
      body: [
        {p:'Generated tests cluster around the happy path and one obvious failure. The gaps are predictable enough to be a checklist.'},
        {table:{head:['Class','For orders-api','Why it matters here'],rows:[
          ['**Zero / empty**','`qty=0`, `customer=""`','Zero passes a naive `if qty:` check'],
          ['**Negative**','`price=-5`, `qty=-1`','A negative total is a refund nobody authorised'],
          ['**Wrong type**','`qty="3"`, `order_id="abc"`','`find_order("abc")` was the original 500'],
          ['**Missing**','No `customer` field at all','Different path from an empty string'],
          ['**Huge**','`qty=10**9`, a 10MB customer name','Float precision and memory'],
          ['**Malicious**','`order_id = "1 OR 1=1"`','The exact defect from Chapter 7'],
          ['**Not found**','`GET /orders/99999`','Returns `null` with a 200 instead of a 404'],
          ['**Unicode**','An emoji or RTL text in `customer`','Encoding round-trips through SQLite']
        ]}},
        {code:{name:'edge case prompt',body:'For POST /orders, list every input that could break it:\nzero, negative, wrong type, missing, oversized, malicious,\nand unicode. For each, say what SHOULD happen.\n\nThen write a pytest test for each case you listed.\nDo not change app/ — tests only.'}},
        {p:'"Do not change `app/`" matters. Otherwise the agent will helpfully adjust the implementation until its new tests pass, which defeats the exercise entirely.'}
      ]},
    { h: 'Cheap mechanical gates',
      body: [
        {p:'Formatting and linting are the only rungs a machine can settle without judgement. Run them before human review, not after — a reviewer\'s attention is far too expensive to spend on spacing.'},
        {code:{name:'mechanical checks',body:'ruff check .          # lint\nruff format --check .  # formatting\npytest -q              # tests'}},
        {p:'OpenCode can be configured with a `formatter` in `opencode.json` so generated code arrives already conforming. A convention that is mechanically enforced stops being a review topic.'}
      ]},
    { h: 'The security pass',
      body: [
        {p:'A general "is this secure?" produces a generic checklist. Ask about *this* code, *these* inputs, *this* trust boundary.'},
        {code:{name:'targeted security prompt',body:'Read @app/main.py, @app/db.py and @docs/security.md.\n\nFor every endpoint, answer specifically:\n  - what user input reaches a SQL statement, and is it bound?\n  - what happens with no auth at all?\n  - what does an error response leak to the caller?\n  - which endpoint would you attack first, and how?\n\nCite file and line. Do not fix anything.'}},
        {table:{head:['Ask about','In this service'],rows:[
          ['Injection','Every parameter reaching `db.py`'],
          ['AuthN / AuthZ','`DELETE` uses a hardcoded token; nothing else is protected'],
          ['Information leakage','Does a stack trace reach the client?'],
          ['Secrets','`API_TOKEN` in source — the known defect'],
          ['Input validation','Trust boundary is the HTTP layer']
        ]}},
        {note:{kind:'best',title:'Never simplify away a trust boundary',body:'Input validation at the edge, error handling that prevents data loss, and authentication are the three things that never get cut for brevity — not by you, and not by an agent optimising for a smaller diff.'}}
      ]},
    { h: 'Performance: measure, do not speculate',
      body: [
        {p:'Agents give confident performance advice with no access to your data volumes, hardware, or traffic. Treat every such claim as a hypothesis requiring a measurement.'},
        {list:[
          'Ask *what would be slow and why*, not *make it faster*',
          'For this service the honest answer is that at 10k orders almost nothing matters — and `docs/decisions.md` already says so',
          'Reject optimisation that adds complexity without a measurement behind it',
          'The one real performance question here: `SELECT *` with no index on a growing table'
        ]},
        {note:{kind:'info',title:'Where the decision record earns its keep',body:'"Add Redis caching" is a reasonable-sounding suggestion that `decisions.md` already answers: single-node, under 10k orders, revisit above that. Written intent is what makes it easy to decline confidently.'}}
      ]},
    { h: 'Regression thinking',
      body: [
        {p:'The change is correct in isolation. The question validation actually asks is whether it is correct in context.'},
        {code:{name:'find the blast radius yourself',body:'grep -rn "find_order" app/ tests/\ngrep -rn "orders" docs/'}},
        {list:[
          '**Callers** — who else calls the function you changed?',
          '**Data** — did the shape of anything stored or returned change?',
          '**Contract** — did a status code, field name, or route change for a consumer?',
          '**Docs** — is `api.md` still true?',
          '**Tests** — did an existing test start passing for a new reason?'
        ]},
        {p:'That last one is subtle and worth the habit. A test that passes for a different reason than it used to is no longer testing what its name claims.'}
      ]}
  ],
  enterprise: [
    {p:'Validation is where "Definition of Done" stops being a slogan and becomes a gate. The value of writing it down is that it is checkable by someone who did not do the work.'},
    {list:[
      '**Publish the ladder as the standard.** A shared definition of done makes review consistent across people and across teams, and removes the negotiation from every PR.',
      '**Automate rungs 1, 2 and 4.** Run, test, lint belong in CI. Human attention should be spent on rungs 3, 5 and 6, which need judgement.',
      '**Security review is not optional for input-handling code.** Any change touching a trust boundary gets the security pass, regardless of size.',
      '**Regression thinking scales worst.** As volume rises, "what else touches this?" is the check most often skipped and most expensive to skip.'
    ]},
    {code:{name:'docs/definition-of-done.md',body:'A change is done when:\n  [ ] the service still starts\n  [ ] pytest -q passes\n  [ ] a test exists that failed before this change\n  [ ] edge cases are tested: zero, negative, wrong type,\n      missing, not-found\n  [ ] ruff check and ruff format --check pass\n  [ ] no user input reaches SQL unbound\n  [ ] no secret is added to source\n  [ ] every caller of every changed function was checked\n  [ ] api.md / known-issues.md updated in this commit\n  [ ] I can explain every line'}}
  ],
  exercise: {
    intro: 'Validate the change you reviewed in Chapter 8, properly — all six rungs, ending with a written Definition of Done in the repository.',
    steps: [
      { t:'Rungs 1 and 2', body:[
        {code:{name:'terminal',body:'uvicorn app.main:app --reload   # does it still start?\npytest -q                       # green?'}},
        {p:'Then ask the harder question: did any of these tests ever fail? If they were written alongside the code, run one against the previous commit to find out.'},
        {code:{name:'terminal',body:'git stash && pytest -q ; git stash pop'}}
      ]},
      { t:'Rung 3 — edge cases, tests only', body:[
        {code:{name:'opencode prompt',body:'For POST /orders and GET /orders/{order_id}, list every input\nthat could break them: zero, negative, wrong type, missing,\noversized, malicious, unicode, not-found. For each say what\nSHOULD happen.\n\nThen write a pytest test for each. Do NOT change anything in\napp/ — tests only. Some of these tests are expected to fail.'}},
        {code:{name:'terminal',body:'pytest -q'}},
        {note:{kind:'tip',title:'Failing tests here are the point',body:'A red test on `GET /orders/99999` returning 200 with `null` is a real defect you just discovered. Record it in `known-issues.md` or fix it as its own milestone — do not delete the test.'}}
      ]},
      { t:'Rung 4 — mechanical gates', body:[
        {code:{name:'terminal',body:'pip install ruff\nruff check .\nruff format --check .'}},
        {p:'Fix what it reports as its own commit. Formatting noise mixed into a logic change is the fastest way to make a diff unreviewable.'}
      ]},
      { t:'Rung 5 — targeted security pass', body:[
        {p:'Fresh session:'},
        {code:{name:'opencode prompt',body:'Read @app/main.py, @app/db.py and @docs/security.md.\n\nFor every endpoint, answer with file and line:\n  - what user input reaches SQL, and is it bound?\n  - what happens with no authentication?\n  - what does an error response leak?\n  - which endpoint would you attack first, and how?\n\nDo not fix anything.'}},
        {p:'Verify every claim yourself. Add anything real and unfixed to `docs/known-issues.md` with its impact.'}
      ]},
      { t:'Rung 6 — regression check', body:[
        {code:{name:'terminal',body:'grep -rn "create_order" app/ tests/ docs/\ngrep -rn "find_order" app/ tests/ docs/'}},
        {list:[
          'Every caller still correct?',
          'Did any response shape or status code change?',
          'Is `docs/api.md` still true?',
          'Did an existing test start passing for a new reason?'
        ]}
      ]},
      { t:'Write the Definition of Done into the repo', body:[
        {p:'Create `docs/definition-of-done.md` from the enterprise section above, and reference it from `AGENTS.md`:'},
        {code:{name:'AGENTS.md (edit the definition of done section)',body:'## Definition of done\nSee docs/definition-of-done.md. Summary: code, plus a test that\nfailed before the change, plus edge cases, plus docs — all in\nthe same commit. pytest -q and ruff check must pass.'}},
        {code:{name:'terminal',body:'git add -A\ngit commit -m "Add edge case tests and definition of done"'}}
      ]}
    ]
  },
  expected: 'Edge case tests covering all eight classes — including some that legitimately fail and are recorded as known issues — a clean `ruff` run, a security pass whose findings you verified, and a committed `docs/definition-of-done.md` referenced from `AGENTS.md`.',
  validation: [
    { l:'You confirmed the tests would have failed before the change', d:'Green from a self-consistent pair of assumptions is not evidence.' },
    { l:'Edge case tests exist for zero, negative, wrong type, missing and not-found', d:'The classes agents reliably skip.' },
    { l:'Any genuinely failing edge case was recorded or fixed, not deleted', d:'A red test you discovered is a real defect, not an inconvenience.' },
    { l:'`ruff check` and `ruff format --check` pass, in their own commit', d:'Mechanical gates settled before human attention is spent.' },
    { l:'You verified the security findings against the source', d:'Some findings are real, some are theatre. Telling them apart is the skill.' },
    { l:'You grepped for callers of every changed function', d:'Regression thinking is the check most often skipped.' },
    { l:'`docs/definition-of-done.md` is committed and referenced from `AGENTS.md`', d:'A gate that is written down can be checked by someone else.' }
  ],
  bestPractices: [
    'Climb all six rungs. Almost everyone stops at "tests pass".',
    'Verify the test would have failed before the change — otherwise it proves nothing.',
    'Say "tests only, do not change `app/`" when generating edge cases.',
    'Automate run, test and lint; spend human attention on edge cases, security and regressions.',
    'Ask security questions about specific inputs and endpoints, and demand file and line.',
    'Treat performance advice as a hypothesis needing a measurement.',
    'Grep for callers of every function you changed.'
  ],
  mistakes: [
    { bad:'Stopping at green tests.', good:'Green means consistent with itself when the same pass wrote both. Climb the remaining four rungs.' },
    { bad:'Letting the agent change `app/` while writing edge case tests.', good:'It will adjust the implementation until its tests pass, which is the opposite of validation.' },
    { bad:'Deleting a failing edge case test.', good:'You just found a real defect. Record it in `known-issues.md` or fix it as its own milestone.' },
    { bad:'Accepting a security review without checking it.', good:'Verify each claim against the source. Some are real, some are generic filler.' },
    { bad:'Optimising because the agent suggested it.', good:'Require a measurement. `decisions.md` already answers most speculative performance work here.' },
    { bad:'Validating the change in isolation.', good:'Grep the callers. Correct alone and correct in context are different claims.' }
  ],
  summary: [
    'Validation is a separate act from review: review asks if the code is right, validation demonstrates it.',
    'Six rungs — runs, tests, edge cases, lint, security, regression — and stopping at rung two is the norm.',
    'Agent-written tests alongside agent-written code prove self-consistency, not correctness.',
    'Edge case classes are predictable: zero, negative, wrong type, missing, huge, malicious, not-found, unicode.',
    'Regression thinking — who else calls this? — is the most-skipped and most expensive check.'
  ],
  checkpoint: [
    { q:'The agent wrote the code and its tests in one pass, and they are green. What has that proven?',
      options:['The code is correct','That the code is consistent with its own assumptions','That edge cases are handled','Nothing at all'],
      answer:1,
      explain:'Both artefacts came from the same understanding, so green shows internal consistency. If the understanding was wrong, the tests encode the same error — which is why a test that failed before the change is the evidence that matters.' },
    { q:'When asking for edge case tests, why say "do not change anything in app/"?',
      options:['To save tokens','Otherwise it may adjust the implementation until its new tests pass','Tests run faster that way','It is required by pytest'],
      answer:1,
      explain:'Left unconstrained, an agent treats a failing test as a problem to eliminate and will edit the implementation to suit. That converts a validation exercise into a rubber stamp.' },
    { q:'An edge case test you generated fails. The correct response is:',
      options:['Delete the test','Record it as a known issue or fix it as its own milestone','Adjust the assertion until it passes','Ignore it if the feature works'],
      answer:1,
      explain:'A failing edge case is a defect you just discovered — exactly what the exercise was for. Deleting or weakening it discards the finding and leaves the defect in place, unrecorded.' },
    { q:'Which validation rung is most often skipped as work volume rises?',
      options:['Does it run','Tests pass','Regression — what else touches this','Formatting'],
      answer:2,
      explain:'It is the only rung with no obvious trigger and no automation: nothing turns red to remind you. Grepping for callers of every changed function is the habit that keeps it from being dropped.' }
  ]
},

{
  id: 10,
  title: 'Git Workflow',
  short: 'Git Workflow',
  icon: '10',
  difficulty: 'Intermediate',
  minutes: 30,
  track: 'Workflow',
  why: 'Git is what makes agentic development reversible, and reversibility is what lets you work fast without being reckless. An agent that can rewrite eleven files in twenty seconds is a manageable tool on a clean branch with frequent commits, and a genuine hazard in a dirty working tree you last committed on Tuesday. Every review technique in this course reads a diff — and the quality of your diffs is entirely a function of your git habits.',
  objectives: [
    'Keep a working tree clean enough that every diff is honest',
    'Branch per task and commit per milestone',
    'Stage selectively to accept part of a change',
    'Write commit messages that explain why, and review before pushing'
  ],
  concept: [
    { h: 'Status and diff are your review surface',
      body: [
        {p:'These two commands are the ones you run most, and the discipline is running them *before* you need them rather than after something has gone wrong.'},
        {code:{name:'the loop, in git terms',body:'git status              # what is dirty, before you start\ngit diff                # what the agent changed\ngit diff --stat         # how big is it really\ngit add -p              # accept selectively\ngit diff --staged       # exactly what will be committed\ngit commit\ngit log --oneline -5    # what has happened lately'}},
        {note:{kind:'best',title:'Start every task from a clean tree',body:'`git status` before you give the agent a task. If it is dirty, commit or stash first. Otherwise the diff you review afterwards contains your changes and its changes mixed together — and you will attribute them wrongly.'}}
      ]},
    { h: 'A branch per task',
      body: [
        {p:'A branch turns "undo everything" from an archaeology exercise into one command. It costs nothing, and it is what makes it psychologically easy to throw away a bad attempt instead of trying to rescue it.'},
        {code:{name:'branch per task',body:'git checkout -b fix/order-validation\n\n# ... milestones, each its own commit ...\n\ngit checkout main            # abandon it entirely if it went wrong\ngit branch -D fix/order-validation'}},
        {table:{head:['Situation','Command'],rows:[
          ['Throw away uncommitted agent work','`git checkout .`'],
          ['Throw away one file','`git checkout -- app/db.py`'],
          ['Undo the last commit, keep the changes','`git reset --soft HEAD~1`'],
          ['Undo a pushed commit safely','`git revert <sha>`'],
          ['Park work to look at something else','`git stash` / `git stash pop`']
        ]}},
        {note:{kind:'warn',title:'Know which of these are destructive',body:'`git checkout .` and `git reset --hard` discard work permanently with no recovery. Before running either, be certain the changes are ones you want gone. `git stash` gives you the same clean tree and keeps a way back.'}}
      ]},
    { h: 'Selective staging: accepting part of a change',
      body: [
        {p:'Agents often produce a change that is 80% right — and the useful move is frequently to keep that 80% and discard the rest, rather than correcting or regenerating.'},
        {code:{name:'accept hunk by hunk',body:'git add -p app/db.py\n\n# y  stage this hunk\n# n  skip it\n# s  split it into smaller hunks\n# q  stop\n\ngit diff            # what remains unstaged = what you rejected\ngit checkout .      # discard the rejected part'}},
        {p:'This is also the most thorough review technique available, because `-p` forces you to make a decision on every hunk. You cannot skim a change you are staging interactively.'}
      ]},
    { h: 'Commit messages that survive six months',
      body: [
        {p:'The diff already shows *what* changed. A commit message earns its place by recording *why* — the part that is nowhere in the code.'},
        {code:{name:'a message worth writing',body:'Fix SQL injection in delete_order\n\ndelete_order built its DELETE statement with % formatting, so a\ncrafted order_id could delete arbitrary rows. Both delete_order\nand find_order now use bound parameters.\n\nAdds tests/test_db.py, which fails against the previous\nimplementation.\n\nPlan: docs/plan-milestone-1.md'}},
        {table:{head:['Weak','Strong'],rows:[
          ['"fix bug"','"Fix SQL injection in delete_order"'],
          ['"update db.py"','Names the defect and the mechanism'],
          ['"AI changes"','Never — authorship is yours regardless of tooling'],
          ['"wip"','Squash it before pushing, or say what is in progress']
        ]}},
        {p:'One more rule: never write "generated by AI" as the explanation for a change. You reviewed it and you are merging it, which makes it yours. The message explains the engineering, not the tooling.'}
      ]},
    { h: 'Review before push',
      body: [
        {p:'The last gate before your work becomes everyone else\'s problem. Two commands, thirty seconds.'},
        {code:{name:'pre-push review',body:'git log origin/HEAD..HEAD --oneline     # what am I about to push?\ngit diff origin/HEAD..HEAD              # the complete change\ngit diff origin/HEAD..HEAD --stat       # scope check first'}},
        {list:[
          'Is every commit one you meant to make?',
          'Any secret, token, `.env` or database file included?',
          'Any debug print, commented-out block, or stray `TODO`?',
          'Do the docs in this range match the code in this range?',
          'Would a colleague understand each commit from its message alone?'
        ]},
        {note:{kind:'danger',title:'The one that actually happens',body:'`orders.db` and `.env` are exactly the files that get committed accidentally in a lab like this one. Add a `.gitignore` before your first push, not after.'}}
      ]},
    { h: 'OpenCode and git together',
      body: [
        {p:'The TUI has `/undo` and `/redo`, which step file changes backward and forward within your session. They are convenient but they are **not** version control — they do not survive the session and they do not give you a history.'},
        {table:{head:['Use','For'],rows:[
          ['`/undo` in the TUI','Immediately reverting a change you just watched happen'],
          ['`git checkout .`','Discarding everything since the last commit'],
          ['`git revert`','Undoing something already pushed'],
          ['Commits','Everything you might want back later']
        ]}},
        {p:'The rule: `/undo` is a convenience within a session. Git is the record.'}
      ]}
  ],
  enterprise: [
    {p:'Git history is the primary evidence of how AI-assisted software was built. Its legibility is a compliance property, not a matter of taste.'},
    {list:[
      '**Small, single-purpose commits.** One milestone, one commit. This is what keeps a history reviewable at volume and what makes a targeted revert possible.',
      '**Author is the human who merged.** Do not attribute commits to a tool. Accountability follows the person who reviewed and approved.',
      '**Never bypass hooks.** `--no-verify` skips exactly the checks that catch secrets and failing tests. If a hook fails, the hook is usually right.',
      '**Secret scanning matters more, not less.** Agents generate plausible-looking config with placeholder credentials that occasionally are not placeholders.',
      '**Reference the plan in the message.** `Plan: docs/plan-milestone-1.md` connects intent to change permanently.'
    ]},
    {code:{name:'.gitignore — before the first push',body:'__pycache__/\n*.pyc\n.venv/\nvenv/\n\n# never commit these\n*.db\n.env\n.env.*\n*.sqlite3'}}

  exercise: {
    intro: 'Run one complete milestone through a proper git workflow — branch, selective staging, a real commit message, and a pre-push review that catches something.',
    steps: [
      { t:'Protect yourself first', body:[
        {p:'You have been running a service that writes `orders.db` next to your code. Create `.gitignore` now, from the enterprise section above, and check nothing sensitive is already tracked:'},
        {code:{name:'terminal',body:'git status\ngit ls-files | grep -E "\\.db$|\\.env"    # should print nothing'}},
        {p:'If `orders.db` is already tracked, remove it from the index while keeping the file: `git rm --cached orders.db`.'}
      ]},
      { t:'Clean tree, then branch', body:[
        {code:{name:'terminal',body:'git status                              # must be clean\ngit checkout -b feat/order-not-found'}}
      ]},
      { t:'Give the agent a task that overreaches', body:[
        {p:'This is deliberate — you want something to reject in staging:'},
        {code:{name:'opencode prompt',body:'GET /orders/{order_id} returns null with a 200 when the order\ndoes not exist. It should return a 404.\n\nFix it, add a test, and tidy up anything else in app/main.py\nthat looks inconsistent while you are in there.'}},
        {note:{kind:'tip',title:'Why ask for the tidy-up',body:'That clause invites scope creep on purpose. You are about to practise accepting the fix and rejecting the drive-by changes — which is exactly what `git add -p` is for.'}}
      ]},
      { t:'Stage selectively', body:[
        {code:{name:'terminal',body:'git diff --stat\ngit add -p'}},
        {p:'Accept the 404 fix and its test. Reject anything unrelated. Then confirm exactly what you kept and discard the rest:'},
        {code:{name:'terminal',body:'git diff --staged      # what you accepted\ngit diff               # what you rejected\ngit checkout .         # discard the rejected part'}}
      ]},
      { t:'Write a real commit message', body:[
        {code:{name:'terminal',body:'git commit -m "Return 404 for unknown order id\n\nGET /orders/{order_id} returned null with a 200 when the row did\nnot exist, so clients could not distinguish an empty order from\na missing one. Now raises HTTPException(404).\n\nAdds a test that fails against the previous behaviour.\nUnrelated formatting changes from the same session were not\nstaged."'}}
      ]},
      { t:'Update docs, commit separately', body:[
        {p:'`api.md` now describes the wrong status code, and `known-issues.md` has an entry you just fixed.'},
        {code:{name:'terminal',body:'# edit docs/api.md and docs/known-issues.md\ngit add docs/\ngit commit -m "Document 404 behaviour for unknown order id"'}}
      ]},
      { t:'Pre-push review', body:[
        {code:{name:'terminal',body:'git log origin/HEAD..HEAD --oneline\ngit diff origin/HEAD..HEAD --stat\ngit diff origin/HEAD..HEAD'}},
        {p:'Walk the checklist: secrets, debug output, stray TODOs, docs matching code, messages that stand alone. Only then would you push.'},
        {note:{kind:'warn',title:'Push is a human decision',body:'Never let an agent push on your behalf, and never push because a task "finished". Push when you have reviewed the range and decided it is ready.'}}
      ]}
    ]
  },
  expected: 'A feature branch with two clean commits — the fix and its documentation — a `.gitignore` protecting the database and env files, and a rejected set of drive-by changes that never entered history.',
  validation: [
    { l:'`git ls-files` shows no `.db` or `.env` file', d:'The accident this lab is most likely to produce.' },
    { l:'You started from a clean tree on a new branch', d:'Otherwise the diff mixes your work with the agent\'s.' },
    { l:'You used `git add -p` and rejected at least one hunk', d:'Partial acceptance is often better than correcting or regenerating.' },
    { l:'The commit message explains **why**, not just what', d:'The diff already shows what. The reason is nowhere in the code.' },
    { l:'The fix and the doc update are separate commits', d:'Single-purpose commits stay reviewable and revertible.' },
    { l:'No commit message mentions AI as the explanation', d:'You reviewed it and you are merging it. It is yours.' },
    { l:'You ran `git diff origin/HEAD..HEAD` before considering a push', d:'The last gate before it becomes everyone\'s problem.' }
  ],
  bestPractices: [
    '`git status` before every task. A dirty tree makes every later diff dishonest.',
    'A branch per task, a commit per milestone.',
    '`git add -p` to accept the good part of an imperfect change — and as the most thorough review technique available.',
    'Commit messages explain why; the diff already shows what.',
    'Reference the approved plan in the message.',
    '`git log origin/HEAD..HEAD` and the matching diff before every push.',
    '`.gitignore` before the first push, not after the accident.'
  ],
  mistakes: [
    { bad:'Letting the agent work in a dirty tree.', good:'Commit or stash first. Otherwise you cannot tell your changes from its changes.' },
    { bad:'One commit for a whole feature.', good:'One commit per milestone. Mixed commits cannot be reviewed or reverted cleanly.' },
    { bad:'"fix stuff" as a commit message.', good:'Name the defect and the reason. Six months later that message is all that remains.' },
    { bad:'Attributing a commit to AI.', good:'You reviewed and merged it. Authorship and accountability are yours.' },
    { bad:'Pushing straight after a task finishes.', good:'Review the full range first. Push is a human decision, never an agent\'s.' },
    { bad:'Using `--no-verify` when a hook complains.', good:'The hook is usually right — it is what catches secrets and failing tests.' }
  ],
  summary: [
    'Git is what makes agentic work reversible; clean trees are what make diffs honest.',
    'Branch per task, commit per milestone, and abandoning a bad attempt should cost one command.',
    '`git add -p` lets you accept the good part of an imperfect change and is a strong review technique in itself.',
    'Commit messages record why; reference the approved plan.',
    'Review `origin/HEAD..HEAD` before pushing — and push only as a deliberate human decision.'

  checkpoint: [
    { q:'Why start every agent task from a clean working tree?',
      options:['Git requires it','So the resulting diff contains only the agent\'s changes','It makes commits faster','To avoid merge conflicts'],
      answer:1,
      explain:'Every review technique in this course reads a diff. Pre-existing uncommitted edits mix into that diff, so you end up attributing your own changes to the agent or overlooking its changes among yours.' },
    { q:'The agent produced a good fix bundled with unrelated tidy-up. The best tool is:',
      options:['Ask it to try again','`git add -p` to stage only the hunks you want','Accept everything and revert later','Edit the file by hand'],
      answer:1,
      explain:'Selective staging keeps the part that was right and discards the rest without another generation round. It also forces a decision on every hunk, which makes it one of the most thorough review techniques available.' },
    { q:'What belongs in a commit message that is not already in the diff?',
      options:['Which files changed','Why the change was necessary','How many lines changed','Which model wrote it'],
      answer:1,
      explain:'The diff shows what changed in full detail. The reasoning — what was broken, why this approach — exists nowhere in the code, and it is the only thing a reader six months later cannot reconstruct.' },
    { q:'`/undo` in the OpenCode TUI is:',
      options:['Equivalent to `git revert`','A within-session convenience, not version control','A way to undo pushed commits','A replacement for branching'],
      answer:1,

{
  id: 11,
  title: 'Skills: Reusable Expertise',
  short: 'Skills',
  icon: '11',
  difficulty: 'Advanced',
  minutes: 40,
  track: 'Workflow',
  why: 'By now you have a procedure for adding an endpoint, a procedure for reviewing a diff, and a procedure for validating a change — and all of them live in your head or in this course. Skills are how a procedure becomes part of the project: written once, discovered automatically, loaded only when relevant. They are the third context tier from Chapter 5, and the mechanism that turns one developer\'s hard-won process into something the whole team inherits.',
  objectives: [
    'Explain what a Skill is and how progressive disclosure keeps it cheap',
    'Structure a skill bundle: `SKILL.md`, `scripts/`, `references/`, `assets/`',
    'Write and verify several reusable project Skills for orders-api',
    'Create a personal Skill that follows you across every project'
  ],
  concept: [
    { h: 'What a Skill is',
      body: [
        {p:'A Skill is a reusable chunk of instructions the agent loads **only when it decides the task calls for it**. Unlike `AGENTS.md`, which is always in context, a Skill sits idle until the agent invokes the native `skill` tool — so you can keep a dozen without bloating a single session.'},
        {p:'Each skill is a **directory** containing a `SKILL.md`. The directory name must match the `name` in the frontmatter.'},
        {table:{head:['Scope','Path'],rows:[
          ['**Project**','`.opencode/skills/<name>/SKILL.md`'],
          ['**Global**','`~/.config/opencode/skills/<name>/SKILL.md`'],
          ['Project (agent-compat)','`.agents/skills/<name>/SKILL.md`'],
          ['Global (agent-compat)','`~/.agents/skills/<name>/SKILL.md`']
        ]}},
        {note:{kind:'warn',title:'The filename is ALL CAPS',body:'`SKILL.md`, exactly. A file named `skill.md` is not discovered, and — as with the `AGENT.md` mistake — nothing warns you. It simply never loads.'}},
        {p:'For project paths, OpenCode walks **up** from your working directory to the git worktree root, loading every matching `skills/*/SKILL.md` it finds on the way.'}
      ]},
    { h: 'Progressive disclosure — why skills are nearly free',
      body: [
        {p:'A skill loads in three stages, and this is what makes keeping many of them affordable.'},
        {table:{head:['Stage','What is loaded','Cost'],rows:[
          ['**1. Discovery**','Only `name` + `description`','~one line, every session'],
          ['**2. Activation**','The full `SKILL.md`','Paid only when the task matches'],
          ['**3. Execution**','Referenced files, as needed','Paid per file actually opened']
        ]}},
        {note:{kind:'best',title:'Where your effort goes',body:'The `description` is the only thing the agent sees before deciding whether to load a skill. It is the highest-leverage line in the whole bundle: say *what it does* and *when to use it*. A vague description means a skill that never activates.'}},
        {p:'The practical consequence: keep `SKILL.md` lean — about a page — and push the bulk into `references/`. A dozen well-described skills cost almost nothing until the day one of them is exactly what you need.'}
      ]},
    { h: 'Frontmatter and naming rules',
      body: [
        {table:{head:['Field','Required','What'],rows:[
          ['`name`','Yes','Must match the directory name'],
          ['`description`','Yes','1–1024 chars — what it does **and** when to use it'],
          ['`license`','No','e.g. `MIT`'],
          ['`compatibility`','No','e.g. `opencode`'],
          ['`metadata`','No','Free-form string map']
        ]}},
        {p:'Name rules: 1–64 characters, lowercase alphanumeric with single hyphens, no leading, trailing, or consecutive hyphens — `^[a-z0-9]+(-[a-z0-9]+)*$`.'},
        {code:{name:'.opencode/skills/add-endpoint/SKILL.md',body:'---\nname: add-endpoint\ndescription: Add a new HTTP endpoint to orders-api following the\n  project layout, with a test and an api.md update. Use whenever\n  a task asks for a new route or changes an existing one.\ncompatibility: opencode\n---\n\n## What I do\nAdd an endpoint to orders-api the way this project does it.\n\n## Steps\n1. Route in app/main.py. No SQL here.\n2. Persistence in app/db.py, parameterised query only.\n3. Test in tests/, asserting the status code, not just success.\n4. Update docs/api.md in the same change.\n5. Run: pytest -q && ruff check .\n\n## Rules\n- Errors raise HTTPException with a 4xx status.\n- Never return {"error": ...} with a 200.\n- No new dependencies.\n\n## When to use me\nAny task that adds or modifies an HTTP route in this service.'}}
      ]},
    { h: 'A skill is a bundle, not a file',
      body: [
        {code:{name:'the full shape',body:'.opencode/skills/release-notes/\n├── SKILL.md              <- REQUIRED, the entrypoint\n├── scripts/              <- executable code\n│   └── collect_commits.sh\n├── references/           <- documentation, opened as needed\n│   └── message-format.md\n└── assets/               <- templates used in the output\n    └── notes-template.md'}},
        {table:{head:['Folder','Purpose','Enters context?'],rows:[
          ['`SKILL.md`','**Required.** Instructions + frontmatter','Always, on activation'],
          ['`scripts/`','Deterministic work the agent should not improvise','Executed, never read'],
          ['`references/`','Material too long for the body','Only the file it opens'],
          ['`assets/`','Files used in the output, not read as instructions','Copied or filled']
        ]}},
        {note:{kind:'danger',title:'Nothing auto-loads',body:'The folders are a convention, not a feature. `SKILL.md` must point at them explicitly — the agent reaches them with ordinary file and bash tools. A `references/` file nobody links to is a file nobody reads.'}},
        {code:{name:'pointing at them explicitly',body:'## Steps\n1. Read the request and pick a layout.\n   Field list: references/message-format.md\n2. Copy assets/notes-template.md and fill {{version}} and {{changes}}.\n3. Run scripts/collect_commits.sh <since-tag> for the raw list.'}},
        {p:'Prefer `scripts/` for anything deterministic. Code is cheaper and more reliable **run** than described in prose — and it cannot drift from what it claims to do.'}
      ]},
    { h: 'Lifecycle and organisation',
      body: [
        {list:[
          '**1. Notice the repetition.** You have explained the same procedure three times. That is the trigger — not "this might be useful someday"',
          '**2. Write it thin.** One job per skill. `SKILL.md` about a page, bulk in `references/`',
          '**3. Restart OpenCode** so it re-scans for skills',
          '**4. Verify it loads** — ask for a task it should cover, or call it directly',
          '**5. Refine the description** if it did not activate. That line, not the body, is almost always the problem',
          '**6. Promote or demote.** Used everywhere, always? It may belong in `AGENTS.md`. Used once in six months? Delete it'
        ]},
        {code:{name:'verify it loads',body:'skill({ name: "add-endpoint" })'}},
        {table:{head:['Belongs in a Skill','Belongs in AGENTS.md'],rows:[
          ['A multi-step procedure used occasionally','A rule true on every task'],
          ['"How we cut a release"','"Parameterised queries only"'],
          ['"How we review a security change"','"Persistence lives in db.py"'],
          ['Something with scripts or templates','A one-line constraint']
        ]}}
      ]},
    { h: 'Permissions',
      body: [
        {p:'Which skills an agent may use is controlled from `opencode.json`.'},
        {code:{name:'opencode.json',body:'{\n  "permission": {\n    "skill": {\n      "*": "allow",\n      "internal-*": "deny",\n      "experimental-*": "ask"\n    }\n  }\n}'}},
        {p:'`allow` uses it silently, `deny` hides it from the agent entirely, `ask` requires your approval. Setting `skill: false` on an agent cuts it off from skills completely.'}
      ]},
    { h: 'When a skill does not show up',
      body: [
        {list:[
          'Is the file named `SKILL.md` — **all caps**?',
          'Does the frontmatter have both `name` and `description`?',
          'Does `name` exactly match the directory name?',
          'Is the name unique across all skill locations?',
          'Is it blocked by a `deny` permission rule?',
          'Did you restart OpenCode after creating it?'
        ]},
        {p:'If all six pass and it still does not activate, the description is too vague. Rewrite it to name the trigger explicitly: "Use whenever a task asks for X."'}
      ]}
  ],
  enterprise: [
    {p:'Skills are how process knowledge stops being tribal. A senior developer\'s review procedure, written once as a skill, is applied identically by every developer on the team — including the one who joined yesterday.'},
    {list:[
      '**Ship organisational skills with the repo template.** Security review, release, incident write-up. New services inherit the process instead of reinventing it.',
      '**One job per skill, clearly described.** Overlapping skills with vague descriptions activate unpredictably, and an agent choosing the wrong procedure is worse than it choosing none.',
      '**Use `deny` for skills that touch production.** Permission patterns are the enforcement layer; a skill that deploys should not be silently invokable.',
      '**Review skills like code.** A skill changes how work is done across every session that activates it — that is a bigger blast radius than most pull requests.',
      '**Prefer scripts over prose for anything deterministic.** A script that validates a release is verifiable; a paragraph describing the validation is a suggestion.'
    ]}
  ],
  exercise: {
    intro: 'You will build three project skills from procedures this course has already taught you, verify they load and activate, then create one personal skill that follows you into every project.',
    steps: [
      { t:'Create the skills directory', body:[
        {code:{name:'terminal',body:'mkdir -p .opencode/skills/add-endpoint\nmkdir -p .opencode/skills/review-diff\nmkdir -p .opencode/skills/validate-change'}}
      ]},
      { t:'Skill 1 — add-endpoint', body:[
        {p:'Create `.opencode/skills/add-endpoint/SKILL.md` exactly as shown in the concept section above. It encodes the Chapter 7 implementation loop for this specific service.'},
        {note:{kind:'tip',title:'Note the description',body:'"Use whenever a task asks for a new route or changes an existing one" names the trigger explicitly. That phrasing is why it will actually activate.'}}
      ]},
      { t:'Skill 2 — review-diff', body:[
        {code:{name:'.opencode/skills/review-diff/SKILL.md',body:'---\nname: review-diff\ndescription: Review a code change against this project\'s six-point\n  scan — scope, intent, correctness, omissions, conventions, blast\n  radius. Use when asked to review a diff, a change, or a commit.\ncompatibility: opencode\n---\n\n## What I do\nReview a change the way this project requires.\n\n## Steps\n1. Run git diff --stat first. Report any file outside the\n   task scope before reading logic.\n2. For each changed file, check every line serves the stated goal.\n3. Trace these inputs by hand and report the result:\n   qty=0, qty=-1, price=-5, order_id="1 OR 1=1", a missing id.\n4. List what is MISSING: tests, error paths, validation, docs.\n5. Check against AGENTS.md and docs/coding-style.md.\n6. grep for other callers of every changed function.\n\n## Output\nA numbered list of findings, worst first. For each: file, line,\nwhat is wrong, and which rule it breaks. Do not fix anything\nunless asked.\n\n## When to use me\nAny request to review, check, or sanity-check a change.'}}
      ]},
      { t:'Skill 3 — validate-change, with a script', body:[
        {p:'This one gets a `scripts/` folder, because the mechanical rungs of the validation ladder should be run, not described.'},
        {code:{name:'terminal',body:'mkdir -p .opencode/skills/validate-change/scripts'}},
        {code:{name:'.opencode/skills/validate-change/scripts/gates.sh',body:'#!/bin/sh\n# Mechanical rungs of the validation ladder.\nset -e\necho "--- tests ---"\npytest -q\necho "--- lint ---"\nruff check .\necho "--- format ---"\nruff format --check .\necho "ALL MECHANICAL GATES PASSED"'}},
        {code:{name:'.opencode/skills/validate-change/SKILL.md',body:'---\nname: validate-change\ndescription: Validate a change against the six-rung ladder — runs,\n  tests, edge cases, lint, security, regression. Use before any\n  commit or when asked to validate, verify, or check a change is\n  safe.\ncompatibility: opencode\n---\n\n## What I do\nProve a change is correct, not just plausible.\n\n## Steps\n1. Run scripts/gates.sh for the mechanical rungs.\n2. Edge cases — confirm a test exists for each: zero, negative,\n   wrong type, missing field, not found, unicode, oversized.\n3. Security: report every user input reaching SQL and whether it\n   is bound. Cite file and line.\n4. Regression: grep for callers of every changed function.\n5. Confirm docs/api.md and docs/known-issues.md are still true.\n\n## Rules\n- Do not modify anything under app/ while validating.\n- A failing edge case is a finding to report, never a test to\n  delete or weaken.\n\n## Full checklist\nSee docs/definition-of-done.md.\n\n## When to use me\nBefore a commit, or on any request to validate or verify a change.'}},
        {p:'Note that `SKILL.md` points at both `scripts/gates.sh` and `docs/definition-of-done.md` explicitly. Nothing auto-loads.'}
      ]},
      { t:'Restart and verify', body:[
        {p:'Skills are scanned at startup, so restart OpenCode, then confirm each one loads:'},
        {code:{name:'opencode TUI',body:'skill({ name: "add-endpoint" })'}},
        {p:'If it is not found, walk the six troubleshooting checks: ALL CAPS filename, both required frontmatter fields, name matching the directory, uniqueness, permissions, restart.'}
      ]},
      { t:'Prove one activates on its own', body:[
        {p:'New session. Give a task the skill should cover — without naming the skill:'},
        {code:{name:'opencode prompt',body:'Add a GET /orders/count endpoint that returns the total number\nof orders.'}},
        {p:'Did it put the route in `main.py` and the query in `db.py`, add a test asserting the status code, and update `api.md` — all without being told? That is `add-endpoint` activating. If it did not, sharpen the description; the body is rarely the problem.'}
      ]},
      { t:'Create a personal skill', body:[
        {p:'This one lives outside the repo and follows you into every project you ever open.'},
        {code:{name:'terminal',body:'mkdir -p ~/.config/opencode/skills/explain-this'}},
        {code:{name:'~/.config/opencode/skills/explain-this/SKILL.md',body:'---\nname: explain-this\ndescription: Explain unfamiliar code the way I want it — what it\n  does, why it exists, what would break if it were removed, and\n  what is suspicious about it. Use whenever I ask what some code\n  does or to explain a file, function, or module.\n---\n\n## What I do\nExplain code for someone who has to maintain it.\n\n## Output, in this order\n1. One sentence: what this does.\n2. The flow, as numbered steps, using real names from the code.\n3. Why it exists — the problem it solves. Say INFERRED if you\n   are guessing.\n4. What breaks if it is deleted.\n5. Anything suspicious: unhandled errors, silent failures,\n   assumptions that are not checked.\n\n## Rules\n- No summary of syntax. I can read the language.\n- Quote real identifiers, never paraphrase them.\n- If something is unclear from the code alone, say so instead\n  of inventing a reason.\n\n## When to use me\nAny request to explain, describe, or walk through code.'}},
        {note:{kind:'best',title:'Why this one is personal, not project',body:'It encodes how *you* like to receive explanations. That is a preference, not a project rule — so it belongs in `~/.config/opencode/`, never committed to a shared repo.'}}
      ]},
      { t:'Commit the project skills', body:[
        {code:{name:'terminal',body:'chmod +x .opencode/skills/validate-change/scripts/gates.sh\ngit add .opencode/\ngit commit -m "Add project skills: add-endpoint, review-diff, validate-change"'}},
        {p:'Your personal skill stays uncommitted — it is yours, not the project\'s.'}
      ]}
    ]
  },
  expected: 'Three committed project skills — one of them with a working script — a personal skill in `~/.config/opencode/skills/`, and evidence that at least one skill activated without being named.',
  validation: [
    { l:'Every file is named `SKILL.md` in ALL CAPS', d:'Lowercase is never discovered and nothing warns you.' },
    { l:'Each `name` exactly matches its directory name', d:'A mismatch means the skill is silently ignored.' },
    { l:'Every description says what it does **and** when to use it', d:'The description is all the agent sees at discovery.' },
    { l:'`skill({ name: "add-endpoint" })` resolves after a restart', d:'Skills are scanned at startup.' },
    { l:'A skill activated without you naming it', d:'The real test. If not, the description is too vague.' },
    { l:'`validate-change` points at `scripts/gates.sh` explicitly', d:'Nothing auto-loads — the body must link its own folders.' },
    { l:'The personal skill is in `~/.config/opencode/skills/`, uncommitted', d:'Preferences are yours; project rules are the team\'s.' }
  ],
  bestPractices: [
    'Write a skill when you have explained the same procedure three times — not before.',
    'Spend your effort on the `description`. It is the only thing read at discovery.',
    'One job per skill. Overlapping skills activate unpredictably.',
    'Keep `SKILL.md` to about a page; push depth into `references/`.',

        {code:{name:'the debugging loop',body:'1. REPRODUCE   a failing command or test, exactly\n2. OBSERVE     the real error text, not a paraphrase\n3. LOCALISE    narrow to a function before proposing a cause\n4. HYPOTHESISE ask for causes ranked by likelihood\n5. TEST        one hypothesis at a time\n6. FIX + TEST  a test that fails without the fix'}},

  short: 'Best Practices',

  why: 'Every technique in this course reduces to nine habits. Individually they look like common sense; collectively they are the difference between a team that ships faster with AI and a team that ships an unreviewable backlog faster. This chapter is the synthesis — and the honest discussion of where each habit breaks down under pressure.',
  objectives: [

    'Recognise what each looks like when it quietly stops happening',
    'Identify which controls are cultural and which can be enforced',
    'Assess your own team against a maturity model'

  concept: [
    { h: 'The nine practices',
      body: [
        {table:{head:['Practice','Prevents','Fails quietly as'],rows:[
          ['**1. Small iterations**','Unreviewable diffs','"It is all one feature, really"'],
          ['**2. Always review**','Unowned code in production','Reading the summary instead of the diff'],
          ['**3. Never trust blindly**','Confident wrong changes','"The tests pass"'],
          ['**4. Keep docs updated**','Context that teaches fiction','"Docs PR to follow"'],
          ['**5. Keep `AGENTS.md` updated**','Repeating yourself forever','Correcting in chat instead of in the file'],
          ['**6. Reuse Skills**','Everyone reinventing a procedure','Skills written once and never refined'],

        {p:'Under deadline pressure these fail in a predictable order, and it is worth knowing which ones you can afford to bend.'},

        {table:{head:['Level','Looks like'],rows:[

        {p:'Most teams adopting these tools sit at level 1 and believe they are at level 3. The honest test is a single question: **if your best developer left tomorrow, would their working practices remain in the repository?** At level 1 they leave with the person. At level 4 they are files.'}

  enterprise: [
    {p:'Two failure modes dominate at organisational scale, and they pull in opposite directions.'},
    {list:[
