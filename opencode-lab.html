  { topic:'OpenCode', q:'What does `opencode run "..."` do?', options:['Runs your test suite','Answers a single prompt non-interactively and exits','Starts a background daemon','Executes a shell command'], answer:1, explain:'It is the scriptable one-shot form — useful in CI or pipelines where you want an answer without opening the full TUI.' },
  { topic:'OpenCode', q:'Which slash command condenses a long session while keeping the thread?', options:['`/new`','`/compact`','`/export`','`/undo`'], answer:1, explain:'`/compact` (alias `/summarize`) summarises the session to free context while preserving continuity. `/new` discards the thread entirely.' },
  { topic:'OpenCode', q:'Which command opens the command palette in the TUI?', options:['`ctrl+p`','`ctrl+k`','`ctrl+space`','`alt+enter`'], answer:0, explain:'`ctrl+p` fuzzy-searches every available command and action — the fastest way to reach anything without memorising keybinds.' },
  { topic:'Context', q:'What is the main risk of pasting an entire repository into context?', options:['It costs money','Irrelevant tokens crowd out the relevant ones','The agent will refuse','It is slower to type'],  answer:1, explain:'The context window is a budget. Every irrelevant token competes with a relevant one, so over-supplying context reliably degrades answer quality — cost is only the secondary problem.' },
  { topic:'Context', q:'Standing rules that apply to every task belong in:', options:['Each prompt','`AGENTS.md`','A Skill','The README'], answer:1, explain:'`AGENTS.md` is loaded every session, so it is the right home for always-true rules. Skills are for occasional procedures; the README is written for humans.' },
  { topic:'Context', q:'Which is the strongest signal of context pollution?', options:['The agent asks a clarifying question','The agent re-suggests an approach you already rejected','The response is long','The agent reads a file'], answer:1, explain:'Rejected approaches still sitting in the window read as relevant to the agent. Re-suggestion is the classic symptom, and `/compact` or `/new` is the cure.' },
  { topic:'Context', q:'The most commonly omitted and most valuable context is:', options:['The programming language','Constraints — what must not change','The file size','The model name'], answer:1, explain:'Developers describe the goal and leave constraints unstated, so the agent invents its own — typically by adding a dependency or restructuring a module to make its job easier.' },
  { topic:'Prompting', q:'Which best distinguishes a task from a prompt?', options:['Length','It has a goal, constraints, context, and a way to check it','It is written in the imperative','It mentions a file'], answer:1, explain:'Prompts produce demos; tasks produce software. Those four elements are what make the result reviewable rather than merely plausible.' },
  { topic:'Prompting', q:'You want analysis only, with no file changes. You should:', options:['Trust that analysis is the default','State explicitly "do not change any files"','Make the files read-only','Use a smaller model'], answer:1, explain:'Agents default toward action. Without an explicit constraint, "look at this service" is easily interpreted as "improve this service".' },
  { topic:'Best Practices', q:'Why commit a clean baseline before an agent starts work?', options:['It speeds up the model','So every later `git diff` shows only the agent\'s changes','OpenCode requires it','It reduces token usage'], answer:1, explain:'Diff-driven review depends on an honest diff. Pre-existing uncommitted edits contaminate every diff that follows, hiding what the agent actually did.' },
  { topic:'Best Practices', q:'Generated code should be treated as:', options:['A finished commit','A proposal from a new contractor, pending review','Documentation','A test fixture'], answer:1, explain:'Ownership does not transfer to the tool. The developer who merges is the author, which means the change goes through the same review any colleague\'s PR would.' },
  { topic:'Review', q:'The safest first task in an unfamiliar repository is:', options:['A small feature','A read-only explanation of what the code does','A refactor','Adding tests'], answer:1, explain:'You cannot review a change to a system you do not understand. Understanding is cheap; an unreviewable edit to unfamiliar code is not.' },
  { topic:'Enterprise workflow', q:'Knowledge that exists only in a developer\'s chat history is:', options:['Fine, it is searchable','Effectively lost — durable knowledge must live in the repository','Backed up automatically','Shared with the team'], answer:1, explain:'Sessions do not persist across developers or across days. Context written into the repository benefits everyone and every future session; context in a chat log helps one person, once.' },

  /* ---- OpenCode ---- */
  { topic:'OpenCode', q:'Which slash command generates a first draft of `AGENTS.md` for your repo?', options:['`/agents`','`/init`','`/new`','`/setup`'], answer:1, explain:'`/init` inspects the repository and produces a tailored draft. Like any generated artefact it is a starting point — cut it down and correct it before committing.' },
  { topic:'OpenCode', q:'Where do personal rules that apply across all your projects belong?', options:['The project `AGENTS.md`','`~/.config/opencode/AGENTS.md`','`opencode.json`','A skill'], answer:1, explain:'Global scope keeps your own preferences out of shared repositories. Pushing personal habits into a project `AGENTS.md` makes them everyone else\'s policy.' },
  { topic:'OpenCode', q:'What does `opencode stats` show?', options:['Test coverage','Token usage and cost across sessions','Repository statistics','Model benchmarks'], answer:1, explain:'It turns assumed consumption into measured consumption, which is what makes session hygiene a defensible cost argument rather than a preference.' },
  { topic:'OpenCode', q:'If no `AGENTS.md` exists, OpenCode falls back to:', options:['No rules at all','`~/.claude/CLAUDE.md`','`README.md`','`opencode.json`'], answer:1, explain:'That compatibility fallback means an existing `CLAUDE.md` keeps working, but relying on it hides where your rules actually live — prefer an explicit `AGENTS.md`.' },
  { topic:'OpenCode', q:'Which key pulls a project file into your prompt by fuzzy search?', options:['`#`','`@`','`/`','`!`'], answer:1, explain:'Pressing `@` fuzzy-searches files so you can reference exact paths without typing them, which is how you supply precisely scoped context instead of describing it.' },
  { topic:'OpenCode', q:'`/share` does what?', options:['Shares your screen','Creates a public link to the session','Commits and pushes','Exports to PDF'], answer:1, explain:'It generates a public share link. Because that publishes conversation content externally, the behaviour is controllable globally via the `share` setting in `opencode.json`.' },
  { topic:'OpenCode', q:'Custom slash commands are created by:', options:['Editing `opencode.json`','Adding a markdown file under `.opencode/commands/`','Running `opencode command add`','They cannot be created'], answer:1, explain:'Any markdown file there becomes `/<name>`, with support for argument substitution, shell output injection and file references. A custom command can even override a built-in of the same name.' },
  { topic:'OpenCode', q:'Which is NOT a real OpenCode CLI subcommand?', options:['`opencode serve`','`opencode mcp add`','`opencode review`','`opencode upgrade`'], answer:2, explain:'There is no `opencode review`. Review is something you perform against a diff, not a subcommand — `serve`, `mcp add` and `upgrade` are all real.' },

  /* ---- Context ---- */
  { topic:'Context', q:'Which cure fits a session that has become noisy but is still on the same task?', options:['`/new`','`/compact`','`/export`','Restart OpenCode'], answer:1, explain:'`/compact` condenses the session while preserving the thread, which is what you want mid-task. `/new` discards continuity and is right only when the task itself has changed.' },
  { topic:'Context', q:'Which context source has the shortest lifetime?', options:['`AGENTS.md`','A file referenced in one task','A Skill','`opencode.json` instructions'], answer:1, explain:'A referenced file applies to that message only. `AGENTS.md` and `instructions` load every session, and a Skill persists as an available capability until removed.' },
  { topic:'Context', q:'A clear directory structure matters to an agent because:', options:['It loads faster','It is free context that costs nothing to transmit','It reduces file size','Agents index directories'], answer:1, explain:'The layout itself is a claim about how the system is organised. When `db.py` holds only persistence, "fix the SQL injection" needs no further orientation.' },
  { topic:'Context', q:'What happens when the context window fills?', options:['The agent stops','Content must be dropped or summarised','It grows automatically','An error is raised'], answer:1, explain:'It is a fixed budget, so something has to give. That is precisely why irrelevant tokens are costly — they displace the ones that would have mattered.' },
  { topic:'Context', q:'Why is one session per task recommended?', options:['It is faster','It prevents accumulated debris from earlier, unrelated work','It costs less','Sessions expire'], answer:1, explain:'Old approaches, stale file reads and resolved errors all stay in the window and read as relevant. Scoping a session to one task is the cheapest prevention available.' },

  /* ---- Prompting ---- */
  { topic:'Prompting', q:'Which element is most often missing from a task?', options:['The goal','The constraints','The language','The file names'], answer:1, explain:'Developers describe what they want built and leave out what must not change, so the agent invents its own constraints — usually by adding a dependency or restructuring a module.' },
  { topic:'Prompting', q:'What does adding "if something is ambiguous, ask instead of guessing" achieve?', options:['Shorter answers','Ambiguity surfaces instead of being resolved silently in the agent\'s favour','Faster responses','Lower cost'], answer:1, explain:'Without it, every ambiguous point is decided for you invisibly, and you never learn which assumption was made or that a decision happened at all.' },
  { topic:'Prompting', q:'Asking an agent to write "UNKNOWN — needs confirmation" rather than guess:', options:['Is ignored','Produces honest gaps you can then fill','Makes output shorter','Only works for documentation'], answer:1, explain:'Agents comply with this readily, and an explicit unknown is far more useful than a confident invention — it marks exactly where human knowledge is required.' },
  { topic:'Prompting', q:'The strongest way to specify an output you want is:', options:['Adjectives describing quality','A concrete example of the desired output','A longer description','Naming a style guide'], answer:1, explain:'One worked example removes almost all interpretation. Descriptions of quality are subjective; a sample output is checkable.' },

  /* ---- Planning ---- */
  { topic:'Planning', q:'Which signal means a task should be spiked rather than planned?', options:['It touches two files','You cannot judge whether a plan is right','It needs tests','It is urgent'], answer:1, explain:'Being unable to evaluate a plan is an information problem, and more planning detail will not fix it. A time-boxed spike buys the missing knowledge and ends in a document.' },
  { topic:'Planning', q:'A spike should end in:', options:['A working feature','A document','A pull request','A refactor'], answer:1, explain:'Its deliverable is an answer, not a change. Code produced by a spike is unreviewed implementation wearing a research label.' },
  { topic:'Planning', q:'When reviewing a plan, "nouns you did not introduce" refers to:', options:['Poor grammar','New modules, dependencies or config appearing quietly','Variable naming','Technical jargon'], answer:1, explain:'New structure tends to appear in plans without announcement — a `config.py` here, a library there. Scanning for unfamiliar nouns catches scope creep in seconds.' },
  { topic:'Planning', q:'Roughly what diff size makes review quality collapse?', options:['Over 50 lines','Over 400 lines','Over 2000 lines','Size does not matter'], answer:1, explain:'Beyond a few hundred lines reviewers skim regardless of who wrote the code, which is why commit size functions as a governance control rather than a style preference.' },
  { topic:'Planning', q:'When is skipping the planning step correct?', options:['Never','When you can already picture the exact diff','When you are in a hurry','On Fridays'], answer:1, explain:'Plan-first is a tool, not a ritual. Requiring a plan for a rename is ceremony, and teams that plan everything stop genuinely reading plans.' },

  /* ---- AGENTS.md ---- */
  { topic:'AGENTS.md', q:'Roughly how long should `AGENTS.md` be for a small service?', options:['5–10 lines','40–80 lines','200–300 lines','As long as needed'], answer:1, explain:'It loads on every task, so length is a recurring cost. Past a couple of hundred lines it has become documentation and the bulk belongs in `docs/`.' },
  { topic:'AGENTS.md', q:'Which section of `AGENTS.md` prevents specific expensive mistakes?', options:['What this is','Layout','Hard constraints','Commands'], answer:2, explain:'Constraints are prohibitions written after seeing a mistake once — "never build SQL with string concatenation" stops a class of defect the other sections only shape.' },
  { topic:'AGENTS.md', q:'Writing "we maintain 90% coverage" when you have no tests is harmful because:', options:['It is embarrassing','Fiction in context produces fiction in code','It slows the agent','Coverage is unmeasurable'], answer:1, explain:'The agent treats standing orders as ground truth and will reason from a codebase that does not exist. State what is true, or state the gap explicitly.' },
  { topic:'AGENTS.md', q:'Which pairing gives both guidance and enforcement?', options:['`AGENTS.md` plus a README','`AGENTS.md` plus `opencode.json` permissions','Two `AGENTS.md` files','Skills plus documentation'], answer:1, explain:'`AGENTS.md` states intent, which an agent can misread or overlook; permission settings enforce boundaries it cannot talk its way past. Enterprise setups need both.' },

  /* ---- Knowledge files ---- */
  { topic:'Knowledge files', q:'Which two knowledge files can an agent fundamentally not generate?', options:['`api.md` and `testing.md`','`decisions.md` and `known-issues.md`','`architecture.md` and `deployment.md`','`security.md` and `coding-style.md`'], answer:1, explain:'Both record human judgement — why a choice was made, and which defects have been consciously accepted. Neither appears anywhere in the code for an agent to read.' },
  { topic:'Knowledge files', q:'Recording a known defect prevents:', options:['Audit findings','An agent treating it as intended behaviour and copying the pattern','Merge conflicts','Test failures'], answer:1, explain:'An undocumented defect looks deliberate to the next reader, human or agent. Recording it with its impact stops it propagating and stops someone "fixing" an accepted trade-off blindly.' },
  { topic:'Knowledge files', q:'How many knowledge files should a team start with?', options:['All nine immediately','Three accurate ones — architecture, decisions, known issues','One combined file','None until the code is stable'], answer:1, explain:'Three accurate files beat nine stale ones. Add the rest when their absence actually costs you something, because a stale document misleads with total confidence.' },
  { topic:'Knowledge files', q:'Why date entries in `decisions.md`?', options:['For audit compliance only','So an old decision reads as historical rather than current policy','To sort them','It is required'], answer:1, explain:'An undated decision from three years ago is indistinguishable from current policy. Dating lets entries age honestly and be superseded rather than silently trusted.' },
  { topic:'Knowledge files', q:'What belongs in `troubleshooting.md`?', options:['Every possible error','Symptoms, causes and fixes you have actually reproduced','Links to Stack Overflow','The test suite output'], answer:1, explain:'Documentation written from imagination does not match real symptoms. Recording an error you actually triggered — with its real text — is what makes it findable at 3am.' },

  /* ---- Git ---- */
  { topic:'Git', q:'Which command shows exactly what you are about to commit?', options:['`git diff`','`git diff --staged`','`git status`','`git log`'], answer:1, explain:'`git diff` shows unstaged work. Once you have staged selectively with `git add -p`, only `--staged` reflects the actual content of the coming commit.' },
  { topic:'Git', q:'Which is a destructive command with no recovery?', options:['`git stash`','`git checkout .`','`git revert`','`git branch`'], answer:1, explain:'It discards uncommitted changes permanently. `git stash` produces the same clean tree while keeping a way back, which makes it the safer default.' },
  { topic:'Git', q:'How do you safely undo a commit that is already pushed?', options:['`git reset --hard`','`git revert <sha>`','Delete the branch','`git checkout .`'], answer:1, explain:'`revert` creates a new commit undoing the change, preserving history that others may already have pulled. Resetting rewrites shared history and breaks their clones.' },
  { topic:'Git', q:'What should you run immediately before a push?', options:['`git status`','`git log origin/HEAD..HEAD` and the matching diff','`git fetch`','`git gc`'], answer:1, explain:'That range is exactly what you are about to publish. Reviewing it catches stray secrets, debug output and commits you did not intend to include.' },
  { topic:'Git', q:'Using `--no-verify` to get past a failing hook is:', options:['Standard practice','Skipping the checks that catch secrets and failing tests','Required in CI','Faster and equivalent'], answer:1, explain:'Hooks are usually right, and they are the automated layer catching precisely the mistakes humans miss. If one fails, investigate the cause rather than bypassing it.' },
  { topic:'Git', q:'`/undo` in the OpenCode TUI differs from git because:', options:['It is faster','It works within the session and leaves no history','It only undoes tests','It requires a commit first'], answer:1, explain:'It is a convenience for reverting a change you just watched happen. Anything you might want back later needs a commit — git is the record.' },

  /* ---- Review ---- */
  { topic:'Review', q:'Why is AI-generated code harder to review than human code?', options:['It is longer','It carries no signal of uncertainty — it looks equally confident when wrong','It uses unusual syntax','It has no comments'], answer:1, explain:'A human writes awkward code where they were unsure, giving reviewers a hint. An agent produces the same polished output whether or not it understood the task.' },
  { topic:'Review', q:'What is the first step of the six-point scan?', options:['Read every line','Check scope with `git diff --stat`','Run the tests','Check conventions'], answer:1, explain:'An unexpected file is a fast, unambiguous stop sign. Catching it takes seconds and spares you reading logic that should not exist at all.' },
  { topic:'Review', q:'"Trace a concrete input by hand" means:', options:['Run the debugger','Follow a specific bad value through the new code yourself','Add logging','Write a test'], answer:1, explain:'Reading for plausibility and reading for correctness are different activities. Picking `qty=0` or an id of `1 OR 1=1` and following it manually is what catches real defects.' },
  { topic:'Review', q:'Adversarial review should be run:', options:['In the same session','In a fresh session','By the same agent twice','Only by humans'], answer:1, explain:'An agent in the session that produced the code is defending a position it already took. A fresh session has no such stake — though its findings still need verifying.' },
  { topic:'Review', q:'A rejection that produces a good retry contains:', options:['Firm language','The line, the problem, and the rule it breaks','A new example','A different model'], answer:1, explain:'Vague rejections produce vague retries. Naming the location, the defect and the violated constraint gives the agent something actionable rather than a mood to interpret.' },

  /* ---- Diff ---- */
  { topic:'Diff', q:'What can a diff never show you?', options:['Deleted lines','Something that was never written','Renamed files','Whitespace changes'], answer:1, explain:'A diff records additions and deletions, so a missing test or unhandled error path leaves no trace. Omissions require a separate, explicit review step.' },
  { topic:'Diff', q:'`git add -p` is valuable because:', options:['It is faster','It forces a decision on every hunk, so you cannot skim','It compresses the diff','It stages automatically'], answer:1, explain:'Beyond enabling partial acceptance, interactive staging is one of the most thorough review techniques available — every hunk demands an explicit yes or no.' },
  { topic:'Diff', q:'After correcting a change you rejected, you should:', options:['Commit immediately','Re-review the corrected diff','Trust the fix','Run only the tests'], answer:1, explain:'A fix is itself a change, and changes get reviewed. Corrections frequently introduce their own scope creep or miss part of what you asked for.' },

  /* ---- Validation ---- */
  { topic:'Validation', q:'Which edge case class most often slips past generated tests?', options:['The happy path','Zero and negative values','String inputs','Long strings'], answer:1, explain:'Generated tests cluster around the happy path and one obvious failure. Zero is especially dangerous because it passes a naive truthiness check while being invalid.' },
  { topic:'Validation', q:'`ruff check` and formatting gates should run:', options:['After human review','Before human review','Only in CI','Once per release'], answer:1, explain:'Mechanical checks need no judgement, so settling them first means reviewer attention is spent on correctness rather than spacing.' },
  { topic:'Validation', q:'A good security prompt asks about:', options:['General best practices','Specific inputs and endpoints, citing file and line','The framework version','Industry standards'], answer:1, explain:'"Is this secure?" returns a generic checklist that fits any codebase. Naming the endpoints and demanding file and line produces findings you can actually verify.' },
  { topic:'Validation', q:'An agent suggests adding a cache for performance. Before accepting you should:', options:['Accept it — caching is standard','Require a measurement, and check `decisions.md`','Ask for a bigger cache','Add it behind a flag'], answer:1, explain:'Performance advice arrives with no knowledge of your data volumes or traffic, making it a hypothesis. Recorded decisions frequently already answer the question.' },
  { topic:'Validation', q:'"Did an existing test start passing for a new reason?" matters because:', options:['It indicates flakiness','That test no longer tests what its name claims','Tests should never change','It slows the suite'], answer:1, explain:'A test passing for a different reason has quietly stopped covering its original case, so the regression it guarded against can now recur unnoticed.' },

  /* ---- Skills ---- */
  { topic:'Skills', q:'What is the name rule for a skill?', options:['Any string','Lowercase alphanumeric with single hyphens, matching the directory','PascalCase','Must start with `skill-`'], answer:1, explain:'The pattern is `^[a-z0-9]+(-[a-z0-9]+)*$` with no leading, trailing or consecutive hyphens, and the frontmatter `name` must equal the directory name exactly.' },
  { topic:'Skills', q:'Content in a skill\'s `scripts/` folder is:', options:['Always loaded into context','Executed, never read into context','Ignored','Loaded on activation'], answer:1, explain:'Scripts are run rather than described, which is both cheaper and more reliable — a script cannot drift from what it claims to do the way prose can.' },
  { topic:'Skills', q:'Your skill exists but never activates. The most likely cause is:', options:['The model is too small','The description is too vague','The file is too long','Too many skills exist'], answer:1, explain:'Discovery shows only name and description, so that line is the entire basis for activation. Naming the trigger explicitly — "use whenever a task asks for X" — usually fixes it.' },
  { topic:'Skills', q:'When should you write a skill?', options:['At project start','After explaining the same procedure about three times','For every procedure','When onboarding'], answer:1, explain:'Repetition you have actually experienced is the signal. Speculative skills written for hypothetical needs go stale and clutter discovery with poor descriptions.' },
  { topic:'Skills', q:'`"internal-*": "deny"` in the skill permission block means:', options:['Those skills require approval','Those skills are hidden from the agent entirely','Those skills run silently','Those skills are deprecated'], answer:1, explain:'`deny` removes them from the agent\'s view completely. `ask` is the setting that requires your approval, and `allow` lets them be used silently.' },

  /* ---- Best Practices ---- */
  { topic:'Best Practices', q:'Under deadline pressure, which practice is dropped first in most teams?', options:['Review','Documentation updates','Testing','Commits'], answer:1, explain:'Docs have no immediate consequence, so they go first and the cost compounds invisibly for months. Review is the one that must never go, whatever the deadline.' },
  { topic:'Best Practices', q:'Which is a structural control rather than a cultural one?', options:['Diff-driven review','Secret scanning in CI','Never trusting blindly','Planning before coding'], answer:1, explain:'Machinery enforces it and it cannot be quietly skipped. The others depend on people performing them, which is why making them visible matters so much.' },
  { topic:'Best Practices', q:'The honest test of AI adoption maturity is:', options:['Volume of generated code','Whether your practices would remain in the repo if your best developer left','Number of skills','Spend per developer'], answer:1, explain:'Practices embodied in `AGENTS.md`, knowledge files and skills survive personnel changes. Practices living in one person\'s habits leave when they do.' },
  { topic:'Best Practices', q:'What does a repeated correction to the agent indicate?', options:['A model limitation','A missing or vague line in `AGENTS.md`','A context window problem','Normal operation'], answer:1, explain:'Repetition is a defect in your standing orders. Fixing the chat fixes one task; fixing the file fixes every future task for every developer on the repo.' },

  /* ---- Enterprise workflow ---- */
  { topic:'Enterprise workflow', q:'What is the real bottleneck when AI increases code output?', options:['Model cost','Human review capacity','CI runtime','Repository size'], answer:1, explain:'Generation scales and attention does not. Producing three times the code with the same reviewers accumulates unreviewed risk three times faster, not productivity.' },
  { topic:'Enterprise workflow', q:'A team that has rejected no plans and no diffs this month most likely has:', options:['An excellent process','Gates that have become decorative','Simple tasks','A better model'], answer:1, explain:'A gate that never stops anything is not a gate. A non-zero rejection rate is the cheapest available evidence that review is being performed rather than ticked.' },
  { topic:'Enterprise workflow', q:'Who is accountable for AI-generated code that causes an incident?', options:['The vendor','The developer who reviewed and merged it','The model provider','Nobody specifically'], answer:1, explain:'Ownership does not transfer to a tool. "The AI wrote it" is not an answer an incident review accepts, which is why explicability is a merge requirement.' },
  { topic:'Enterprise workflow', q:'When should you NOT use AI assistance?', options:['On large codebases','When you cannot review the output','On legacy code','When under deadline'], answer:1, explain:'Unfamiliar language, unfamiliar domain, no tests — in those situations you would be merging something you cannot evaluate, so the review burden exceeds the generation benefit.' },
  { topic:'Enterprise workflow', q:'Why put the approved plan in the pull request description?', options:['It is required','A reviewer comparing intent against diff spots scope creep immediately','It makes PRs longer','For metrics'], answer:1, explain:'Without stated intent, a reviewer cannot tell a necessary file from an unnecessary one. With it, "why is this file here" answers itself in seconds.' },
  { topic:'Enterprise workflow', q:'Before running a data migration you should:', options:['Run the tests','Back up the data and verify the migration on the copy','Update the docs','Notify the team'], answer:1, explain:'Code deploys roll back; wrongly converted rows do not. Comparing row counts and totals against a copy is the only way to know it works before touching real data.' }
];

  { file:'architecture.md', group:'Documentation', desc:'Structure an agent can describe; intent only you can write.',
    body:'# Architecture\n\n## Modules\n\n| Module | Responsibility | Must not |\n|--------|----------------|----------|\n| ...    | ...            | ...      |\n\n## Request flow: <primary operation>\n1. <entry point>\n2. <validation>\n3. <persistence>\n4. <response>\n\n## Data model\n<tables or structures as they actually exist>\n\n## Deliberate decisions\n<!-- Written by a human. An agent cannot know intent. -->\n- <choice> — <why>. Revisit when <condition>.\n- <choice> — <why>. Revisit when <condition>.\n\n## Known structural weaknesses\n- <what is wrong structurally, and whether it is accepted>\n\n## Inferred\n<Anything below was inferred rather than confirmed:>\n- ...\n' },

  { file:'coding-style.md', group:'Documentation', desc:'Conventions the repo actually follows — including where it does not.',

  // otherwise "Enterprise Ready" could unlock while "First Prompt" stayed locked.

  { id:'knowledge-arch', icon:'&#9634;', name:'Knowledge Architect', desc:'Finish the Knowledge Files chapter',      test:s => !!s.done[5] },
  { id:'planner',        icon:'&#9781;', name:'Planner',             desc:'Finish the Planning chapter',            test:s => !!s.done[6] },

  { id:'first-skill',    icon:'&#9670;', name:'First Skill',         desc:'Finish the Skills chapter',              test:s => !!s.done[11] },
  { id:'enterprise',     icon:'&#9819;', name:'Enterprise Ready',    desc:'All chapters done and 80%+ on the final', test:s => CHAPTERS.every(c => s.done[c.id]) && s.quiz.best >= 80 }
];

const POINTS = { step: 5, chapter: 25, checkpoint: 10, finalPerCorrect: 5 };

const LEVELS = [
  { name:'Beginner',       min:0 },
  { name:'Practitioner',   min:25 },
  { name:'Advanced',       min:55 },
  { name:'Enterprise Ready', min:85 }
];

/* ============================================================
   2. STORE — one localStorage key, one state object
   ============================================================ */
const Store = {
  KEY: 'opencode-lab-v1',
  subs: [],
  state: null,

  blank() {
    return {
      v: 1,
      name: '',
      theme: null,          // null = follow system
      done: {},             // chapterId -> true
      checks: {},           // "chId:stepIdx" -> true
      bookmarks: [],        // chapterIds
      checkpoints: {},      // chapterId -> {correct, total}
      quiz: { best: 0, taken: 0, last: null },
      collapsed: {},        // nav group -> true
      certDate: null        // stamped when the certificate is first printed
    };
  },

  load() {
    try {
      const raw = localStorage.getItem(this.KEY);
      this.state = raw ? Object.assign(this.blank(), JSON.parse(raw)) : this.blank();
    } catch (e) {
      this.state = this.blank();
    }
    return this.state;
  },

  save() {
    try { localStorage.setItem(this.KEY, JSON.stringify(this.state)); } catch (e) { /* private mode */ }
    this.subs.forEach(fn => fn(this.state));
  },

  subscribe(fn) { this.subs.push(fn); },

  update(fn) { fn(this.state); this.save(); },

  reset() { this.state = this.blank(); this.save(); }
};

/* ============================================================
   3. SCORER — all derived numbers, pure over state
   ============================================================ */
const Scorer = {
  totalSteps() { return CHAPTERS.reduce((n, c) => n + (c.exercise ? c.exercise.steps.length : 0), 0); },
  totalCheckpoints() { return CHAPTERS.reduce((n, c) => n + (c.checkpoint ? c.checkpoint.length : 0), 0); },

  maxScore() {
    return this.totalSteps() * POINTS.step
         + CHAPTERS.length * POINTS.chapter
         + this.totalCheckpoints() * POINTS.checkpoint
         + 20 * POINTS.finalPerCorrect;
  },

  score(s) {
    let n = Object.keys(s.checks).length * POINTS.step;
    n += Object.keys(s.done).length * POINTS.chapter;
    Object.keys(s.checkpoints).forEach(k => { n += s.checkpoints[k].correct * POINTS.checkpoint; });
    n += Math.round(s.quiz.best / 100 * 20) * POINTS.finalPerCorrect;
    return n;
  },

  chaptersDone(s) { return CHAPTERS.filter(c => s.done[c.id]).length; },

  percent(s) { return CHAPTERS.length ? Math.round(this.chaptersDone(s) / CHAPTERS.length * 100) : 0; },

  minutesLeft(s) { return CHAPTERS.filter(c => !s.done[c.id]).reduce((n, c) => n + c.minutes, 0); },

  stepsDone(s) { return Object.keys(s.checks).length; },

  level(s) {
    const pct = this.maxScore() ? this.score(s) / this.maxScore() * 100 : 0;
    let out = LEVELS[0];
    LEVELS.forEach(l => { if (pct >= l.min) out = l; });
    return out.name;
  },

  achievements(s) { return ACHIEVEMENTS.filter(a => a.test(s)); },

  tracks(s) {
    const map = {};
    CHAPTERS.forEach(c => {
      const t = c.track || 'General';
      if (!map[t]) map[t] = { total: 0, done: 0 };
      map[t].total++;
      if (s.done[c.id]) map[t].done++;
    });
    return map;
  },

  currentChapter(s) {
    const next = CHAPTERS.find(c => !s.done[c.id]);
    return next || CHAPTERS[CHAPTERS.length - 1];
  }
};

/* ============================================================
   4. RENDER — escaping, inline markup, block renderer, views
   ============================================================ */
const esc = t => String(t)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;');

// Inline markup: `code` and **bold**. Escaped first, so content is plain text.
const md = t => esc(t)
  .replace(/`([^`]+)`/g, '<code>$1</code>')
  .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

let codeSeq = 0;
const codeStore = {};

function codeBlock(name, body) {
  const id = 'c' + (++codeSeq);
  codeStore[id] = body;
  return '<div class="code">'
    + '<div class="code-head"><span class="code-name">' + esc(name) + '</span>'
    + '<button class="copy" data-action="copy" data-code="' + id + '">Copy</button></div>'
    + '<pre><code>' + esc(body) + '</code></pre></div>';
}

function blocks(list) {
  if (!list) return '';
  return list.map(b => {
    if (b.p) return '<p>' + md(b.p) + '</p>';
    if (b.list) return '<ul class="bullets">' + b.list.map(i => '<li>' + md(i) + '</li>').join('') + '</ul>';
    if (b.code) return codeBlock(b.code.name, b.code.body);
    if (b.table) return '<div class="table-wrap"><table><thead><tr>'
      + b.table.head.map(h => '<th>' + md(h) + '</th>').join('')
      + '</tr></thead><tbody>'
      + b.table.rows.map(r => '<tr>' + r.map(c => '<td>' + md(c) + '</td>').join('') + '</tr>').join('')
      + '</tbody></table></div>';
    if (b.note) return '<div class="callout ' + b.note.kind + '"><div class="ct">' + esc(b.note.title) + '</div><p>' + md(b.note.body) + '</p></div>';
    return '';
  }).join('');
}

/* ============================================================
   5. QUIZ — one engine, two consumers (checkpoint + final)
   ============================================================ */
const Quiz = {
  cp: {},      // chapterId -> {answered:{i:choice}}
  final: null, // {qs, i, answers[], done}

  /* ----- checkpoint: stays open until answered correctly -----
     A wrong answer is flagged and the question remains live. Points
     are only earned for a first-attempt hit, so retrying costs score
     but never blocks learning. ----- */
  cpState(chId) {
    return this.cp[chId] || (this.cp[chId] = { wrong: {}, solved: {}, firstTry: {} });
  },

  cpOpen(ch) {
    const st = this.cpState(ch.id);
    return ch.checkpoint.filter((q, i) => !st.solved[i]).length;
  },

  renderCheckpoint(ch, s) {
    const st = this.cpState(ch.id);
    const saved = s.checkpoints[ch.id];
    const open = this.cpOpen(ch);
    const total = ch.checkpoint.length;

    let h = '<p>Every question must be answered correctly before this checkpoint is cleared. A wrong answer is flagged and stays open &mdash; only a <strong>first-attempt</strong> hit is worth ' + POINTS.checkpoint + ' points.</p>';

    h += '<div class="callout ' + (open ? 'warn' : 'tip') + '" style="margin-bottom:20px"><div class="ct">'
       + (open ? '&#9873; ' + open + ' of ' + total + ' still to fix' : '&#10003; All ' + total + ' resolved')
       + '</div><p>' + (open ? 'Keep going until every question is green.' : 'Checkpoint cleared.') + '</p></div>';

    ch.checkpoint.forEach((q, qi) => {
      const wrong = st.wrong[qi] || [];
      const solved = !!st.solved[qi];

      h += '<div style="margin-bottom:26px">';
      h += '<div class="quiz-q">' + (qi + 1) + '. ' + md(q.q)
         + (solved ? ' <span class="pill beginner">&#10003; solved</span>'
                   : (wrong.length ? ' <span class="pill advanced">&#9873; retry</span>' : ''))
         + '</div>';

      q.options.forEach((o, oi) => {
        const isWrong = wrong.indexOf(oi) > -1;
        let cls = 'opt';
        if (solved && oi === q.answer) cls += ' right';
        else if (isWrong) cls += ' wrong';
        h += '<button class="' + cls + '" data-action="cp-answer" data-ch="' + ch.id + '" data-q="' + qi + '" data-o="' + oi + '"'
           + (solved || isWrong ? ' disabled' : '') + '>'
           + '<span class="k">' + 'ABCD'[oi] + '</span><span>' + md(o) + '</span></button>';
      });

      if (solved) {
        h += '<div class="callout tip explain"><div class="ct">&#10003; Correct'
           + (st.firstTry[qi] ? ' &mdash; first attempt, +' + POINTS.checkpoint + ' points' : ' &mdash; no points, you had ' + wrong.length + ' miss(es)')
           + '</div><p>' + md(q.explain) + '</p></div>';
      } else if (wrong.length) {
        h += '<div class="callout danger explain"><div class="ct">&#9873; Not correct &mdash; try again</div>'
           + '<p>That option is now ruled out. Re-read the question and pick another &mdash; the explanation appears once you get it right.</p></div>';
      }
      h += '</div>';
    });

    if (saved) {
      h += '<div class="callout best"><div class="ct">Checkpoint recorded</div><p>'
         + saved.correct + ' of ' + saved.total + ' correct on the first attempt &mdash; '
         + (saved.correct * POINTS.checkpoint) + ' points banked.</p></div>';
    }
    return h;
  },

  answerCheckpoint(chId, qi, oi) {
    const ch = CHAPTERS.find(c => c.id === chId);
    const st = this.cpState(chId);
    if (st.solved[qi] || (st.wrong[qi] || []).indexOf(oi) > -1) return;

    if (oi === ch.checkpoint[qi].answer) {
      st.solved[qi] = true;
      st.firstTry[qi] = !(st.wrong[qi] || []).length;
    } else {
      (st.wrong[qi] = st.wrong[qi] || []).push(oi);
    }

    // Bank the score once every question has been solved.
    if (this.cpOpen(ch) === 0 && !Store.state.checkpoints[chId]) {
      const correct = ch.checkpoint.filter((q, i) => st.firstTry[i]).length;
      Store.update(s => { s.checkpoints[chId] = { correct: correct, total: ch.checkpoint.length }; });
    } else {
      Store.save();
    }
  },

  /* ----- final: one question at a time, random draw ----- */
  draw(n) {
    const pool = QUIZ_BANK.slice();
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = pool[i]; pool[i] = pool[j]; pool[j] = t;
    }
    return pool.slice(0, Math.min(n, pool.length));
  },

  start() { this.final = { qs: this.draw(20), i: 0, answers: [], chosen: undefined }; },

  renderFinal(s) {
    const f = this.final;

    if (!f) {
      return '<h2>Before you begin</h2>'
        + '<p>Twenty questions drawn at random from the bank, one at a time, with an explanation after each answer. You can retake it as often as you like &mdash; your best score is kept and counts toward your final score and certificate.</p>'
        + (s.quiz.taken ? '<div class="callout info"><div class="ct">Previous attempts</div><p>Taken ' + s.quiz.taken + ' time(s). Best score ' + s.quiz.best + '%.</p></div>' : '')
        + '<div class="btn-row"><button class="btn" data-action="quiz-start">Start assessment</button></div>';
    }

    if (f.done) {
      const correct = f.answers.filter(a => a).length;
      const pct = Math.round(correct / f.qs.length * 100);
      const pass = pct >= 80;
      return '<h2>' + (pass ? 'Passed' : 'Not passed yet') + '</h2>'
        + '<div class="stats" style="margin:18px 0">'
        +   Render.stat(pct + '%', 'Score', correct + ' of ' + f.qs.length + ' correct')
        +   Render.stat(s.quiz.best + '%', 'Best', 'across ' + s.quiz.taken + ' attempt(s)')
        + '</div>'
        + '<div class="callout ' + (pass ? 'tip' : 'warn') + '"><div class="ct">' + (pass ? 'Enterprise standard met' : 'Pass mark is 80%') + '</div>'
        + '<p>' + (pass ? 'You answered enough to demonstrate a working command of the material. Your certificate is available once every chapter is complete.' : 'Review the chapters covering the questions you missed, then retake &mdash; a different set is drawn each time.') + '</p></div>'
        + '<div class="btn-row"><button class="btn" data-action="quiz-start">Retake</button>'
        + '<button class="btn ghost" data-action="go" data-route="dashboard">Dashboard</button></div>';
    }

    const q = f.qs[f.i];
    const chosen = f.chosen;
    let h = '<div class="quiz-bar"><span class="bar"><i style="width:' + (f.i / f.qs.length * 100) + '%"></i></span>'
          + '<span class="quiz-count">' + (f.i + 1) + ' / ' + f.qs.length + '</span></div>'
          + '<div class="crumb">' + esc(q.topic) + '</div>'
          + '<div class="quiz-q">' + md(q.q) + '</div>';

    q.options.forEach((o, oi) => {
      let cls = 'opt';
      if (chosen !== undefined) {
        if (oi === q.answer) cls += ' right';
        else if (oi === chosen) cls += ' wrong';
      }
      h += '<button class="' + cls + '" data-action="q-answer" data-o="' + oi + '"'
         + (chosen !== undefined ? ' disabled' : '') + '>'
         + '<span class="k">' + 'ABCD'[oi] + '</span><span>' + md(o) + '</span></button>';
    });

    if (chosen !== undefined) {
      h += '<div class="callout ' + (chosen === q.answer ? 'tip' : 'warn') + ' explain">'
         + '<div class="ct">' + (chosen === q.answer ? '&#10003; Correct' : '&#10007; Incorrect') + '</div>'
         + '<p>' + md(q.explain) + '</p></div>'
         + '<div class="btn-row"><button class="btn" data-action="q-next">'
         + (f.i === f.qs.length - 1 ? 'See results' : 'Next question') + '</button></div>';
    }
    return h;
  },

  answerFinal(oi) {
    const f = this.final;
    if (!f || f.chosen !== undefined) return;
    f.chosen = oi;
    f.answers.push(oi === f.qs[f.i].answer);
  },

  nextFinal() {
    const f = this.final;
    if (f.i === f.qs.length - 1) {
      f.done = true;
      const pct = Math.round(f.answers.filter(a => a).length / f.qs.length * 100);
      Store.update(s => {
        s.quiz.taken++;
        s.quiz.last = pct;
        if (pct > s.quiz.best) s.quiz.best = pct;
      });
    } else {
      f.i++;
      f.chosen = undefined;
    }
  }
};

/* ============================================================
   6. SEARCH
   ============================================================ */
const Search = {
  index: null,

  build() {
    this.index = CHAPTERS.map(c => {
      const parts = [c.title, c.why, c.objectives.join(' '), c.summary.join(' ')];
      c.concept.forEach(k => {
        parts.push(k.h);
        (k.body || []).forEach(b => {
          if (b.p) parts.push(b.p);
          if (b.list) parts.push(b.list.join(' '));
          if (b.code) parts.push(b.code.name + ' ' + b.code.body);
          if (b.note) parts.push(b.note.title + ' ' + b.note.body);
          if (b.table) parts.push(b.table.head.join(' ') + ' ' + b.table.rows.map(r => r.join(' ')).join(' '));
        });
      });
      (c.exercise ? c.exercise.steps : []).forEach(st => {
        parts.push(st.t);
        (st.body || []).forEach(b => {
          if (b.p) parts.push(b.p);
          if (b.code) parts.push(b.code.body);
        });
      });
      return { route: 'chapter/' + c.id, title: 'Chapter ' + c.id + ' — ' + c.title, text: parts.join(' ').replace(/\s+/g, ' ') };
    });

    TOPICS.forEach(t => {
      const parts = [t.title, t.tag];
      t.body.forEach(b => {
        if (b.p) parts.push(b.p);
        if (b.list) parts.push(b.list.join(' '));
        if (b.code) parts.push(b.code.body);
        if (b.note) parts.push(b.note.title + ' ' + b.note.body);
        if (b.table) parts.push(b.table.head.join(' ') + ' ' + b.table.rows.map(r => r.join(' ')).join(' '));
      });
      this.index.push({ route: 'topics', title: 'Topic — ' + t.title, text: parts.join(' ').replace(/\s+/g, ' ') });
    });
  },

  run(q) {
    if (!this.index) this.build();
    const needle = q.trim().toLowerCase();
    if (needle.length < 2) return [];
    return this.index.filter(e => e.text.toLowerCase().indexOf(needle) > -1).map(e => {
      const at = e.text.toLowerCase().indexOf(needle);
      const from = Math.max(0, at - 45);
      const raw = (from > 0 ? '...' : '') + e.text.slice(from, at + needle.length + 70);
      return { route: e.route, title: e.title, snippet: raw, needle: needle };
    }).slice(0, 8);
  }
};

/* ============================================================
   7. ROUTER + BOOT
   ============================================================ */
const App = {
  route() { return (location.hash || '#/dashboard').replace(/^#\/?/, '') || 'dashboard'; },

  go(r) { location.hash = '#/' + r; },

  lastRoute: null,

  render() {
    const s = Store.state;
    const r = this.route();
    const view = document.getElementById('view');
    // Ticking a box re-renders in place — only a real navigation scrolls to top.
    const moved = r !== this.lastRoute;
    const y = window.scrollY || 0;
    codeSeq = 0;

    let html;
    if (r === 'dashboard') html = Render.dashboard(s);
    else if (r === 'topics') html = Render.topics();
    else if (r === 'templates') html = Render.templates();
    else if (r === 'cheatsheets') html = Render.cheatsheets();
    else if (r === 'certificate') html = Render.certificate(s);
    else if (r === 'quiz') html = Render.quiz(s);
    else if (r.indexOf('chapter/') === 0) {
      const ch = CHAPTERS.find(c => c.id === parseInt(r.split('/')[1], 10));
      html = ch ? Render.chapter(ch, s) : Render.notFound();
    } else html = Render.notFound();

    view.innerHTML = html;
    this.lastRoute = r;
    window.scrollTo(0, moved ? 0 : y);
    this.renderNav();
    this.renderStats();
    if (moved) document.body.classList.remove('nav-open');
  },

  renderNav() {
    const s = Store.state, r = this.route();
    const groups = {};
    CHAPTERS.forEach(c => { (groups[c.track] = groups[c.track] || []).push(c); });

    let h = '<div class="nav-group"><div class="nav-items">'
      + '<button class="nav-item' + (r === 'dashboard' ? ' active' : '') + '" data-action="go" data-route="dashboard">'
      + '<span class="n">&#9638;</span><span class="t">Dashboard</span></button>'
      + '</div></div>';

    Object.keys(groups).forEach(g => {
      const collapsed = !!s.collapsed[g];
      h += '<div class="nav-group' + (collapsed ? ' collapsed' : '') + '">'
        + '<button class="nav-head" data-action="collapse" data-group="' + esc(g) + '">'
        + '<span class="caret">&#9660;</span><span>' + esc(g) + '</span></button>'
        + '<div class="nav-items">'
        + groups[g].map(c => {
            const active = r === 'chapter/' + c.id;
            const done = !!s.done[c.id];
            return '<button class="nav-item' + (active ? ' active' : '') + (done ? ' done' : '') + '" data-action="go" data-route="chapter/' + c.id + '">'
              + '<span class="n">' + (done ? '&#10003;' : c.id) + '</span>'
              + '<span class="t">' + esc(c.short) + '</span>'
              + (s.bookmarks.indexOf(c.id) > -1 ? '<span class="bm">&#9733;</span>' : '')
              + '</button>';
          }).join('')
        + '</div></div>';
    });

    const extras = [
      ['topics', '&#9776;', 'Enterprise Topics'],
      ['cheatsheets', '&#9783;', 'Cheat Sheets'],
      ['templates', '&#9635;', 'Templates'],
      ['quiz', '&#9634;', 'Final Assessment'],
      ['certificate', '&#9819;', 'Certificate']
    ];
    h += '<div class="nav-group"><div class="nav-head" style="cursor:default"><span>Reference</span></div><div class="nav-items">'
      + extras.map(x =>
          '<button class="nav-item' + (r === x[0] ? ' active' : '') + '" data-action="go" data-route="' + x[0] + '">'
          + '<span class="n">' + x[1] + '</span><span class="t">' + x[2] + '</span></button>').join('')
      + '</div></div>';

    document.getElementById('nav').innerHTML = h;
  },

  renderStats() {
    const s = Store.state;
    document.getElementById('sidePct').textContent = Scorer.percent(s) + '%';
    document.getElementById('sideBar').style.width = Scorer.percent(s) + '%';
    document.getElementById('sideDone').textContent = Scorer.chaptersDone(s);
    document.getElementById('sideTotal').textContent = CHAPTERS.length;
    document.getElementById('sideLeft').textContent = Scorer.minutesLeft(s);
    document.getElementById('topScore').textContent = Scorer.score(s);
    document.getElementById('topLevel').textContent = Scorer.level(s);
  },

  /* ---------- theme ---------- */
  applyTheme() {
    const t = Store.state.theme
      || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', t);
    document.getElementById('themeBtn').innerHTML = t === 'dark' ? '&#9728;' : '&#9681;';
  },

  toggleTheme() {
    const cur = document.documentElement.getAttribute('data-theme');
    Store.update(s => { s.theme = cur === 'dark' ? 'light' : 'dark'; });
    this.applyTheme();
  },

  /* ---------- copy (file:// safe) ---------- */
  copy(btn) {
    const text = codeStore[btn.dataset.code] || '';
    const ok = () => {
      btn.textContent = 'Copied';
      btn.classList.add('ok');
      setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('ok'); }, 1400);
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(ok, () => this.copyFallback(text, ok));
    } else {
      this.copyFallback(text, ok);
    }
  },

  copyFallback(text, ok) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); ok(); } catch (e) { /* clipboard unavailable */ }
    document.body.removeChild(ta);
  },

  /* ---------- downloads (Blob, no library) ---------- */
  download(name, text) {
    const url = URL.createObjectURL(new Blob([text], { type: 'text/markdown;charset=utf-8' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  },

  /* ---------- search ---------- */
  search(q) {
    const box = document.getElementById('results');
    const hits = Search.run(q);
    if (!q.trim()) { box.hidden = true; return; }
    box.hidden = false;
    if (!hits.length) { box.innerHTML = '<div class="res-empty">No matches for &ldquo;' + esc(q) + '&rdquo;</div>'; return; }
    box.innerHTML = hits.map(hit => {
      const snip = esc(hit.snippet).replace(new RegExp('(' + hit.needle.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>');
      return '<button class="res" data-action="go" data-route="' + hit.route + '">'
        + '<b>' + esc(hit.title) + '</b><span>' + snip + '</span></button>';
    }).join('');
  },

  /* ---------- delegated events ---------- */
  bind() {
    document.addEventListener('click', e => {
      const el = e.target.closest('[data-action]');
      if (!el) {
        document.getElementById('results').hidden = true;
        return;
      }
      const a = el.dataset.action;

      if (a === 'go') { this.go(el.dataset.route); document.getElementById('results').hidden = true; document.getElementById('search').value = ''; }
      else if (a === 'jump') {
        const t = document.getElementById(el.dataset.target);
        if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
      else if (a === 'theme') this.toggleTheme();
      else if (a === 'copy') this.copy(el);
      else if (a === 'toggle-nav') document.body.classList.toggle('nav-open');
      else if (a === 'close-nav') document.body.classList.remove('nav-open');
      else if (a === 'check') {
        const k = el.dataset.key;
        Store.update(s => { if (s.checks[k]) delete s.checks[k]; else s.checks[k] = true; });
        this.render();
      }
      else if (a === 'done') {
        const id = parseInt(el.dataset.id, 10);
        Store.update(s => { if (s.done[id]) delete s.done[id]; else s.done[id] = true; });
        this.render();
      }
      else if (a === 'bookmark') {
        const id = parseInt(el.dataset.id, 10);
        Store.update(s => {
          const i = s.bookmarks.indexOf(id);
          if (i > -1) s.bookmarks.splice(i, 1); else s.bookmarks.push(id);
        });
        this.render();
      }
      else if (a === 'collapse') {
        const g = el.dataset.group;
        Store.update(s => { if (s.collapsed[g]) delete s.collapsed[g]; else s.collapsed[g] = true; });
        this.renderNav();
      }
      else if (a === 'cp-answer') {
        Quiz.answerCheckpoint(parseInt(el.dataset.ch, 10), parseInt(el.dataset.q, 10), parseInt(el.dataset.o, 10));
        this.render();
      }
      else if (a === 'preview') {
        const box = document.getElementById('tpl-' + el.dataset.tpl);
        box.hidden = !box.hidden;
        el.textContent = box.hidden ? 'Preview' : 'Hide';
      }
      else if (a === 'download') {
        const t = TEMPLATES[parseInt(el.dataset.tpl, 10)];
        this.download(t.file, t.body);
      }
      else if (a === 'download-all') {
        TEMPLATES.forEach((t, i) => setTimeout(() => this.download(t.file, t.body), i * 220));
      }
      else if (a === 'print') {
        Store.update(s => { if (!s.certDate) s.certDate = new Date().toISOString().slice(0, 10); });
        window.print();
      }
      else if (a === 'quiz-start') { Quiz.start(); this.render(); }
      else if (a === 'q-answer') { Quiz.answerFinal(parseInt(el.dataset.o, 10)); this.render(); }
      else if (a === 'q-next') { Quiz.nextFinal(); this.render(); }
      else if (a === 'reset') {
        if (confirm('Reset all progress, scores, bookmarks and achievements? This cannot be undone.')) {
          Store.reset(); Quiz.cp = {}; Quiz.final = null; this.applyTheme(); this.render();
        }
      }
    });

    document.getElementById('search').addEventListener('input', e => this.search(e.target.value));

    // Certificate name: persist as typed, without re-rendering the field under the cursor.
    document.addEventListener('input', e => {
      if (e.target.id !== 'certName') return;
      Store.update(s => { s.name = e.target.value.trim(); });
      const nameEl = document.querySelector('.cert-name');
      if (nameEl) nameEl.textContent = Store.state.name || '—';
      const printBtn = document.querySelector('[data-action="print"]');
      if (printBtn) printBtn.disabled = !Store.state.name;
    });

    window.addEventListener('hashchange', () => this.render());
  },

  boot() {
    Store.load();
    this.applyTheme();
    this.bind();
    this.render();
  }
};

App.boot();
</script>
