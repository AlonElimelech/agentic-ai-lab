<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OpenCode Enterprise Lab — AI-Assisted Development Workflow</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%234f46e5'/><path d='M17 21l11 11-11 11' fill='none' stroke='%23fff' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/><path d='M34 43h14' stroke='%23fff' stroke-width='7' stroke-linecap='round'/></svg>" />
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f4f5f9;
  --surface: #ffffff;
  --surface-2: #fafbfd;
  --sidebar: #ffffff;
  --brand: #4f46e5;
  --brand-soft: #ede9fe;
  --brand-text: #4338ca;
  --text: #1a1a2e;
  --text-2: #4b5563;
  --muted: #6b7280;
  --border: #e4e6ee;
  --border-2: #eef0f6;
  --code-bg: #1e1e2e;
  --code-text: #e6e6f0;
  --ok: #059669;
  --ok-soft: #ecfdf5;
  --warn: #b45309;
  --warn-soft: #fffbeb;
  --danger: #dc2626;
  --danger-soft: #fef2f2;
  --info: #0369a1;
  --info-soft: #f0f9ff;
  --radius: 14px;
  --radius-sm: 9px;
  --shadow: 0 1px 2px rgba(16,24,40,.04), 0 4px 20px rgba(16,24,40,.06);
  --shadow-lg: 0 12px 40px rgba(16,24,40,.13);
  --sans: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
  --mono: 'Cascadia Mono', 'JetBrains Mono', Consolas, 'SF Mono', Menlo, monospace;
}

html[data-theme="dark"] {
  --bg: #0b0b12;
  --surface: #14141d;
  --surface-2: #191924;
  --sidebar: #101018;
  --brand: #818cf8;
  --brand-soft: rgba(129,140,248,.14);
  --brand-text: #a5b4fc;
  --text: #e8eaf2;
  --text-2: #b8bdcc;
  --muted: #8b91a3;
  --border: #262636;
  --border-2: #1e1e2b;
  --code-bg: #0a0a10;
  --code-text: #d7dced;
  --ok: #34d399;
  --ok-soft: rgba(52,211,153,.10);
  --warn: #fbbf24;
  --warn-soft: rgba(251,191,36,.10);
  --danger: #f87171;
  --danger-soft: rgba(248,113,113,.10);
  --info: #38bdf8;
  --info-soft: rgba(56,189,248,.10);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 20px rgba(0,0,0,.35);
  --shadow-lg: 0 12px 40px rgba(0,0,0,.5);
}

html { scroll-behavior: smooth; }

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  line-height: 1.62;
  -webkit-font-smoothing: antialiased;
  font-size: 15.5px;
}

/* ============================================================
   LAYOUT SHELL
   ============================================================ */
.shell { display: flex; min-height: 100vh; }

.sidebar {
  width: 296px;
  flex: 0 0 296px;
  background: var(--sidebar);
  border-right: 1px solid var(--border);
  height: 100vh;
  position: sticky;
  top: 0;
  display: flex;
  flex-direction: column;
  z-index: 40;
}

.brand-row {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 20px 20px 16px;
  border-bottom: 1px solid var(--border-2);
}
.logo {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--brand);
  display: grid; place-items: center;
  color: #fff; font-weight: 800; font-size: 1rem;
  flex: 0 0 36px;
}
.brand-name { font-weight: 750; letter-spacing: -.35px; font-size: .97rem; line-height: 1.25; }
.brand-sub { font-size: .715rem; color: var(--muted); letter-spacing: .3px; text-transform: uppercase; font-weight: 650; }

.side-progress { padding: 15px 20px; border-bottom: 1px solid var(--border-2); }
.sp-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.sp-label { font-size: .74rem; text-transform: uppercase; letter-spacing: .55px; color: var(--muted); font-weight: 700; }
.sp-pct { font-size: .88rem; font-weight: 750; color: var(--brand-text); }
.bar { height: 7px; background: var(--border); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--brand); border-radius: 99px; transition: width .3s ease; }
.sp-meta { display: flex; justify-content: space-between; margin-top: 9px; font-size: .755rem; color: var(--muted); }
.sp-meta b { color: var(--text-2); font-weight: 700; }

.nav { flex: 1; overflow-y: auto; padding: 12px 12px 28px; }
.nav-group { margin-bottom: 6px; }
.nav-head {
  width: 100%;
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px;
  font: inherit; color: var(--muted);
  font-size: .715rem; font-weight: 750; letter-spacing: .6px; text-transform: uppercase;
  background: none; border: 0; cursor: pointer; text-align: left;
}
.nav-head .caret { transition: transform .18s; font-size: .6rem; }
.nav-group.collapsed .caret { transform: rotate(-90deg); }
.nav-group.collapsed .nav-items { display: none; }

.nav-item {
  width: 100%;
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  font: inherit; font-size: .875rem;
  color: var(--text-2);
  background: none; border: 0; cursor: pointer; text-align: left;
  line-height: 1.35;
  transition: background .13s, color .13s;
}
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item.active { background: var(--brand-soft); color: var(--brand-text); font-weight: 650; }
.nav-item .n {
  flex: 0 0 22px; height: 22px;
  display: grid; place-items: center;
  border-radius: 6px;
  background: var(--border-2);
  font-size: .7rem; font-weight: 750; color: var(--muted);
}
.nav-item.active .n { background: var(--brand); color: #fff; }
.nav-item.done .n { background: var(--ok); color: #fff; }
.nav-item .t { flex: 1; min-width: 0; }
.nav-item .bm { font-size: .72rem; color: var(--brand); }

/* ---- main ---- */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 12px;
  padding: 11px 26px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.menu-btn { display: none; }

.search-wrap { position: relative; flex: 1; max-width: 460px; }
.search-wrap .ic { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: .9rem; pointer-events: none; }
#search {
  width: 100%;
  padding: 8.5px 12px 8.5px 34px;
  border: 1px solid var(--border);
  border-radius: 99px;
  background: var(--surface);
  color: var(--text);
  font: inherit; font-size: .875rem;
}
#search:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.results {
  position: absolute; top: calc(100% + 8px); left: 0; right: 0;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow-lg);
  max-height: 60vh; overflow-y: auto; padding: 6px; z-index: 50;
}
.results[hidden] { display: none; }
.res {
  display: block; width: 100%; text-align: left;
  padding: 9px 11px; border: 0; background: none; font: inherit;
  border-radius: var(--radius-sm); cursor: pointer; color: var(--text);
}
.res:hover { background: var(--surface-2); }
.res b { display: block; font-size: .875rem; font-weight: 700; }
.res span { font-size: .78rem; color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res mark { background: var(--brand-soft); color: var(--brand-text); padding: 0 2px; border-radius: 3px; }
.res-empty { padding: 14px; text-align: center; color: var(--muted); font-size: .85rem; }

.spacer { flex: 1; }

.chip {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 13px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 99px; font-size: .8rem; font-weight: 650; white-space: nowrap;
}
.chip .v { color: var(--brand-text); font-weight: 800; }
.chip.level { background: var(--brand-soft); border-color: transparent; color: var(--brand-text); }

.icon-btn {
  width: 36px; height: 36px; flex: 0 0 36px;
  display: grid; place-items: center;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; cursor: pointer; font-size: 1rem;
  color: var(--text-2);
  transition: background .13s, color .13s, border-color .13s;
}
.icon-btn:hover { background: var(--brand-soft); color: var(--brand-text); border-color: var(--brand); }

.view { padding: 34px 26px 90px; max-width: 940px; width: 100%; margin: 0 auto; }

/* ============================================================
   TYPOGRAPHY & PRIMITIVES
   ============================================================ */
h1 { font-size: 2.05rem; font-weight: 800; letter-spacing: -.9px; line-height: 1.18; }
h2 { font-size: 1.32rem; font-weight: 750; letter-spacing: -.45px; margin-bottom: 12px; }
h3 { font-size: 1.03rem; font-weight: 700; letter-spacing: -.2px; margin-bottom: 8px; }
p { color: var(--text-2); }
p + p { margin-top: 11px; }
a { color: var(--brand-text); }

code:not(pre code) {
  font-family: var(--mono);
  font-size: .855em;
  background: var(--brand-soft);
  color: var(--brand-text);
  padding: 1.5px 6px;
  border-radius: 5px;
  word-break: break-word;
}
strong { color: var(--text); font-weight: 700; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 22px 24px;
  margin-bottom: 18px;
}
.card > h2:first-child, .card > h3:first-child { margin-top: 0; }

.sec-label {
  display: flex; align-items: center; gap: 9px;
  font-size: .72rem; font-weight: 800; letter-spacing: .8px; text-transform: uppercase;
  color: var(--muted); margin-bottom: 12px;
}
.sec-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

ul.bullets, ol.steps { padding-left: 0; list-style: none; }
ul.bullets li {
  position: relative; padding-left: 22px; color: var(--text-2); margin-bottom: 7px;
}
ul.bullets li::before {
  content: ''; position: absolute; left: 6px; top: .66em;
  width: 5px; height: 5px; border-radius: 50%; background: var(--brand);
}

.chapter-head { margin-bottom: 26px; }
.crumb { font-size: .78rem; color: var(--muted); font-weight: 650; letter-spacing: .3px; text-transform: uppercase; margin-bottom: 9px; }
.chapter-head h1 { margin-bottom: 12px; }
.meta-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 11px; border-radius: 99px;
  font-size: .755rem; font-weight: 700;
  background: var(--surface); border: 1px solid var(--border); color: var(--text-2);
}
.pill.beginner { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.pill.intermediate { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.advanced { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
.pill.pts { background: var(--brand-soft); color: var(--brand-text); border-color: transparent; }

/* ---- callouts ---- */
.callout {
  border: 1px solid var(--border);
  border-left: 3px solid var(--muted);
  border-radius: var(--radius-sm);
  padding: 14px 17px;
  margin: 15px 0;
  background: var(--surface-2);
}
.callout .ct { font-weight: 750; font-size: .875rem; margin-bottom: 4px; display: flex; gap: 8px; align-items: center; }
.callout p { font-size: .91rem; }
.callout.tip { border-left-color: var(--ok); background: var(--ok-soft); }
.callout.tip .ct { color: var(--ok); }
.callout.warn { border-left-color: var(--warn); background: var(--warn-soft); }
.callout.warn .ct { color: var(--warn); }
.callout.danger { border-left-color: var(--danger); background: var(--danger-soft); }
.callout.danger .ct { color: var(--danger); }
.callout.info { border-left-color: var(--info); background: var(--info-soft); }
.callout.info .ct { color: var(--info); }
.callout.best { border-left-color: var(--brand); background: var(--brand-soft); }
.callout.best .ct { color: var(--brand-text); }

/* ---- code ---- */
.code {
  background: var(--code-bg);
  border-radius: var(--radius-sm);
  margin: 14px 0;
  overflow: hidden;
  border: 1px solid var(--border);
}
.code-head {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 10px 7px 14px;
  background: rgba(255,255,255,.05);
  border-bottom: 1px solid rgba(255,255,255,.07);
}
.code-name { font-family: var(--mono); font-size: .755rem; color: #9aa2c0; flex: 1; letter-spacing: .2px; }
.copy {
  border: 1px solid rgba(255,255,255,.16);
  background: rgba(255,255,255,.06);
  color: #cbd2e8;
  border-radius: 7px; padding: 3px 10px;
  font: inherit; font-size: .735rem; font-weight: 650; cursor: pointer;
  transition: background .13s, color .13s;
}
.copy:hover { background: var(--brand); color: #fff; border-color: transparent; }
.copy.ok { background: var(--ok); color: #fff; border-color: transparent; }
.code pre { margin: 0; padding: 14px 16px; overflow-x: auto; }
.code code {
  font-family: var(--mono); font-size: .82rem; line-height: 1.62;
  color: var(--code-text); white-space: pre;
}
.code .cm { color: #7e88a8; font-style: italic; }
.code .kw { color: #c39bf5; }
.code .st { color: #9ae6b4; }
.code .fn { color: #8ab4f8; }

/* ---- tables ---- */
.table-wrap { overflow-x: auto; margin: 14px 0; border: 1px solid var(--border); border-radius: var(--radius-sm); }
table { border-collapse: collapse; width: 100%; font-size: .885rem; }
th, td { padding: 9.5px 14px; text-align: left; border-bottom: 1px solid var(--border-2); vertical-align: top; }
th { background: var(--surface-2); font-weight: 750; font-size: .77rem; text-transform: uppercase; letter-spacing: .45px; color: var(--muted); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td { color: var(--text-2); }

/* ---- checkable list ---- */
.check {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 11px 13px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  margin-bottom: 8px;
  cursor: pointer;
  transition: border-color .13s, background .13s;
  text-align: left; width: 100%; font: inherit; color: inherit;
}
.check:hover { border-color: var(--brand); }
.check .box {
  flex: 0 0 20px; height: 20px; margin-top: 1px;
  border: 2px solid var(--border); border-radius: 6px;
  display: grid; place-items: center;
  font-size: .72rem; color: transparent;
  transition: background .13s, border-color .13s, color .13s;
}
.check.on { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
.check.on .box { background: var(--ok); border-color: var(--ok); color: #fff; }
.check.on .lbl { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
.check .lbl { flex: 1; font-size: .91rem; color: var(--text-2); }
.check .lbl em { display: block; font-style: normal; font-size: .81rem; color: var(--muted); margin-top: 3px; }

/* ---- exercise / step ---- */
.step { display: flex; gap: 14px; margin-bottom: 20px; }
.step-n {
  flex: 0 0 27px; height: 27px; border-radius: 50%;
  background: var(--brand); color: #fff;
  display: grid; place-items: center;
  font-size: .79rem; font-weight: 750;
}
.step-body { flex: 1; min-width: 0; }
.step-body > .t { font-weight: 700; margin-bottom: 3px; }

/* ---- mistakes ---- */
.mistake { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 13px 15px; margin-bottom: 10px; background: var(--surface); }
.mistake .bad, .mistake .good { display: flex; gap: 9px; font-size: .9rem; }
.mistake .bad { color: var(--text-2); }
.mistake .good { margin-top: 7px; padding-top: 7px; border-top: 1px dashed var(--border); color: var(--text-2); }
.mistake .mk { flex: 0 0 auto; font-weight: 800; }
.mistake .bad .mk { color: var(--danger); }
.mistake .good .mk { color: var(--ok); }

/* ---- quiz ---- */
.quiz-q { font-size: 1.06rem; font-weight: 700; margin-bottom: 15px; line-height: 1.45; }
.opt {
  display: flex; gap: 11px; align-items: flex-start;
  width: 100%; text-align: left; font: inherit;
  padding: 12px 15px; margin-bottom: 9px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--text-2); cursor: pointer;
  transition: border-color .13s, background .13s;
}
.opt:hover:not(:disabled) { border-color: var(--brand); background: var(--brand-soft); }
.opt:disabled { cursor: default; }
.opt .k {
  flex: 0 0 23px; height: 23px; border-radius: 6px;
  background: var(--surface-2); border: 1px solid var(--border);
  display: grid; place-items: center; font-size: .76rem; font-weight: 750; color: var(--muted);
}
.opt.right { border-color: var(--ok); background: var(--ok-soft); color: var(--text); }
.opt.right .k { background: var(--ok); border-color: var(--ok); color: #fff; }
.opt.wrong { border-color: var(--danger); background: var(--danger-soft); color: var(--text); }
.opt.wrong .k { background: var(--danger); border-color: var(--danger); color: #fff; }
.explain { margin-top: 12px; }
.quiz-bar { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.quiz-bar .bar { flex: 1; }
.quiz-count { font-size: .8rem; color: var(--muted); font-weight: 700; white-space: nowrap; }

/* ---- buttons ---- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 20px; border-radius: 10px;
  font: inherit; font-size: .89rem; font-weight: 700;
  border: 1px solid transparent; cursor: pointer;
  background: var(--brand); color: #fff;
  transition: filter .13s, background .13s;
}
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: var(--surface); color: var(--text-2); border-color: var(--border); }
.btn.ghost:hover { border-color: var(--brand); color: var(--brand-text); background: var(--brand-soft); }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }

/* ---- completion ---- */
.complete-card {
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); padding: 20px 22px; margin-top: 22px;
  display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
}
.complete-card.on { border-color: var(--ok); background: var(--ok-soft); }
.complete-card .cc-txt { flex: 1; min-width: 200px; }
.complete-card .cc-txt b { display: block; font-size: 1rem; }
.complete-card .cc-txt span { font-size: .85rem; color: var(--muted); }

.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 30px; }

/* ============================================================
   DASHBOARD
   ============================================================ */
.hero {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 30px 32px; margin-bottom: 20px;
}
.hero h1 { margin-bottom: 10px; }
.hero .lead { font-size: 1.03rem; max-width: 640px; }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
.stat {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 17px 19px; box-shadow: var(--shadow);
}
.stat .sv { font-size: 1.72rem; font-weight: 800; letter-spacing: -1px; line-height: 1.15; }
.stat .sl { font-size: .755rem; text-transform: uppercase; letter-spacing: .55px; color: var(--muted); font-weight: 700; margin-top: 3px; }
.stat .sh { font-size: .78rem; color: var(--muted); margin-top: 6px; }

.ach-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.ach {
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 15px 14px; text-align: center; background: var(--surface-2);
  opacity: .55; transition: opacity .2s, border-color .2s, background .2s;
}
.ach.on { opacity: 1; border-color: var(--brand); background: var(--brand-soft); }
.ach .ai { font-size: 1.5rem; line-height: 1; }
.ach .an { font-size: .81rem; font-weight: 750; margin-top: 7px; }
.ach .ad { font-size: .715rem; color: var(--muted); margin-top: 3px; line-height: 1.4; }

.track { display: grid; gap: 9px; }
.track-row { display: flex; align-items: center; gap: 12px; font-size: .86rem; }
.track-row .tn { flex: 0 0 200px; color: var(--text-2); }
.track-row .bar { flex: 1; }
.track-row .tv { flex: 0 0 44px; text-align: right; font-weight: 700; font-size: .8rem; color: var(--muted); }

/* ============================================================
   TEMPLATES
   ============================================================ */
.tpl {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px 16px;
  align-items: center;
  padding: 14px 0;
  border-bottom: 1px solid var(--border-2);
}
.tpl:last-child { border-bottom: 0; padding-bottom: 0; }
.tpl-name { font-family: var(--mono); font-size: .9rem; font-weight: 700; color: var(--brand-text); }
.tpl-desc { font-size: .855rem; color: var(--muted); margin-top: 2px; }
.tpl-actions { display: flex; gap: 8px; }
.tpl-actions .btn { padding: 7px 14px; font-size: .82rem; }
.tpl-body { grid-column: 1 / -1; }
.tpl-body[hidden] { display: none; }

/* ============================================================
   CERTIFICATE
   ============================================================ */
.name-input {
  width: 100%;
  max-width: 420px;
  padding: 11px 15px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface-2);
  color: var(--text);
  font: inherit;
  font-size: 1rem;
}
.name-input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }

.cert {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  padding: 8px;
  margin-bottom: 20px;
}
.cert-inner {
  border: 2px solid var(--brand);
  border-radius: 10px;
  padding: 44px 40px 34px;
  text-align: center;
  position: relative;
}
.cert-mark {
  width: 52px; height: 52px; margin: 0 auto 20px;
  border-radius: 13px; background: var(--brand);
  color: #fff; display: grid; place-items: center;
  font-weight: 800; font-size: 1.25rem;
}
.cert-kicker {
  font-size: .74rem; font-weight: 800; letter-spacing: 2.6px;
  text-transform: uppercase; color: var(--muted);
}
.cert-course {
  font-size: 1.12rem; font-weight: 750; color: var(--brand-text);
  margin-top: 9px; letter-spacing: -.2px;
}
.cert-awarded { font-size: .87rem; color: var(--muted); margin-top: 26px; }
.cert-name {
  font-size: 2.35rem; font-weight: 800; letter-spacing: -1.1px;
  margin: 6px 0 4px; line-height: 1.2; word-break: break-word;
}
.cert-name::after {
  content: ''; display: block; width: 190px; height: 2px;
  background: var(--border); margin: 14px auto 0;
}
.cert-text {
  max-width: 560px; margin: 20px auto 0;
  font-size: .93rem; color: var(--text-2); line-height: 1.7;
}
.cert-stats {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 12px; margin: 32px 0 8px;
}
.cert-stat { padding: 14px 8px; background: var(--surface-2); border-radius: 10px; }
.cert-stat .cs-v { font-size: 1.2rem; font-weight: 800; letter-spacing: -.5px; color: var(--brand-text); }
.cert-stat .cs-l { font-size: .68rem; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); font-weight: 700; margin-top: 4px; }

.cert-ach { margin-top: 26px; }
.cert-ach-label { font-size: .68rem; text-transform: uppercase; letter-spacing: .9px; color: var(--muted); font-weight: 800; margin-bottom: 11px; }
.cert-ach-list { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; }
.cert-badge {
  font-size: .76rem; font-weight: 650;
  padding: 5px 12px; border-radius: 99px;
  background: var(--brand-soft); color: var(--brand-text);
}

.cert-foot {
  display: flex; justify-content: center; gap: 46px; flex-wrap: wrap;
  margin-top: 34px; padding-top: 20px;
  border-top: 1px solid var(--border);
}
.cert-foot div { text-align: center; }
.cert-foot b { display: block; font-size: .66rem; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); }
.cert-foot span { font-size: .84rem; color: var(--text-2); }

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 1080px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  .ach-grid { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 860px) {
  .sidebar {
    position: fixed; left: 0; top: 0; bottom: 0;
    transform: translateX(-100%);
    transition: transform .22s ease;
    box-shadow: var(--shadow-lg);
  }
  body.nav-open .sidebar { transform: none; }
  body.nav-open .scrim { display: block; }
  .scrim { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 35; }
  .menu-btn { display: grid; }
  .view { padding: 24px 17px 80px; }
  .hero { padding: 24px 20px; }
  .card { padding: 18px 17px; }
  .chip.level, .chip.score { display: none; }
  h1 { font-size: 1.65rem; }
}
@media (max-width: 860px) {
  .tpl { grid-template-columns: 1fr; }
  .tpl-actions { justify-content: flex-start; }
  .cert-inner { padding: 30px 20px 24px; }
  .cert-name { font-size: 1.7rem; }
  .cert-stats { grid-template-columns: repeat(2, 1fr); }
  .cert-foot { gap: 22px; }
}
@media (max-width: 560px) {
  .ach-grid { grid-template-columns: repeat(2, 1fr); }
  .track-row .tn { flex: 0 0 110px; font-size: .8rem; }
  .stats { grid-template-columns: 1fr 1fr; }
}

/* ============================================================
   PRINT — the certificate must fit one page, alone
   ============================================================ */
@media print {
  .sidebar, .topbar, .scrim, .pager, .btn, .copy, .no-print { display: none !important; }
  body { background: #fff; color: #000; }
  .view { padding: 0; max-width: none; }
  .card { break-inside: avoid; box-shadow: none; }

  /* force the light palette — dark mode wastes toner and reads badly */
  :root, html[data-theme="dark"] {
    --bg: #fff; --surface: #fff; --surface-2: #f7f8fc;
    --text: #111; --text-2: #333; --muted: #666;
    --border: #d8dbe6; --brand: #4f46e5; --brand-text: #3b32c4;
    --brand-soft: #eeecff;
  }
  .cert {
    border: 0; box-shadow: none; padding: 0; margin: 0;
    break-inside: avoid; page-break-inside: avoid;
  }
  .cert-inner { padding: 30px 28px; }
  .cert-name { font-size: 2rem; }
  @page { margin: 14mm; }
}

/* ============================================================

const CHAPTERS = [

{

  minutes: 25,
  track: 'Foundations',
  why: 'Nearly every bad AI output traces back to a context problem, not a model problem. The agent invented a function that does not exist, used a library you banned, or re-solved a problem already solved two files over — because nothing told it otherwise. **Context is the input you control.** Getting good at engineering it is the highest-leverage skill in this entire course.',

  ],
  concept: [
    { h: 'The context window is a budget',
      body: [
        {p:'Everything the agent knows at the moment it answers — your task, the files it has read, its own earlier replies, tool output — occupies one finite window. When the window fills, something must be dropped or summarised.'},
        {p:'The naive conclusion is "give it everything." The correct conclusion is the opposite: **every irrelevant token you add competes with a relevant one.** A 4,000-line file pasted "just in case" pushes out the 20 lines that actually mattered.'},
        {note:{kind:'tip',title:'Rule of thumb',body:'Supply the smallest set of files that a competent new colleague would need to do this specific task. Not the whole repo. Not one line of it. That set.'}}
      ]},
    { h: 'The four sources of context',
      body: [
        {table:{head:['Source','Lifetime','Best for'],rows:[
          ['**Your task text**','This message','Goal, constraints, definition of done'],
          ['**Referenced files** (`@path`)','This message','The specific code being changed'],
          ['**`AGENTS.md`**','Every session, always','Standing rules that are always true'],
          ['**Skills**','Loaded on demand','Procedures used occasionally — see Chapter 11']
        ]}},
        {p:'Choosing the right home for a piece of knowledge is the whole game. A rule that is always true belongs in `AGENTS.md`. A procedure used once a month belongs in a Skill. A fact about this one task belongs in the task. Put a rule in the wrong place and it is either missing when needed or burning budget when not.'},
        {code:{name:'referencing a file in the TUI',body:'# press @ to fuzzy-search a file into your prompt\nexplain @app/db.py and list the injection risks'}}

        {p:'An agent reads your directory tree the same way a new hire does: as a claim about how the system is organised. A clear structure is free context that costs zero tokens to explain.'},
        {code:{name:'structure that explains itself',body:'orders-api/\n├── AGENTS.md            <- standing rules, always loaded\n├── README.md            <- what this is, how to run it\n├── docs/\n│   ├── architecture.md\n│   ├── coding-style.md\n│   └── decisions.md\n├── app/\n│   ├── main.py          <- routes only\n│   ├── db.py            <- persistence only\n│   └── models.py\n└── tests/'}},
        {p:'When `db.py` holds only persistence, "fix the SQL injection" needs no further explanation. When everything lives in `main.py`, every task needs a paragraph of orientation first.'}
      ]}
  ],
  enterprise: [
    {p:'Context has a **cost** — in tokens, in latency, and in money. At one developer it is invisible. At two hundred developers running long sessions all day, context discipline becomes a line item.'},
    {table:{head:['Practice','Effect'],rows:[
      ['Scoped file references instead of whole-repo reads','Lower cost, better answers'],
      ['`AGENTS.md` for standing rules','Written once, applied every session, by everyone'],
      ['Skills for occasional procedures','Costs ~one line until actually used'],
      ['One session per task','Prevents drift and pollution'],
      ['`opencode stats`','Makes real usage visible instead of assumed']
    ]}},
    {p:'The organisational payoff is bigger than the bill: context written into the repository is context **every** developer and every agent gets. Context that lives in one person\'s chat history helps exactly one person, once.'}
  ],
  exercise: {
    intro: 'You will now feel the difference between poor and engineered context — on the same task, in the same repository.',
    steps: [
      { t:'Ask badly, on purpose', body:[
        {p:'In a fresh session (`/new`), with no file references at all:'},
        {code:{name:'opencode prompt',body:'make the orders service better'}},
        {p:'Read what comes back. Note how much of it is generic advice that could apply to any service on earth, and whether it invented anything that is not in your repo.'}
      ]},
      { t:'Ask well', body:[
        {p:'Start a new session, then give it a goal, the exact files, and constraints:'},
        {code:{name:'opencode prompt',body:'Read @app/db.py and @app/main.py.\n\nGoal: make order lookup and deletion safe against SQL injection.\nConstraints:\n  - parameterised queries only, no ORM, no new dependencies\n  - do not change the function signatures in db.py\n  - do not touch main.py\nDeliverable: show me the plan and the exact diff you intend before\nyou write anything.'}}
      ]},
      { t:'Compare the two answers', body:[
        {p:'Write down, in one sentence each: what did the second answer contain that the first could not possibly have contained? That gap is what context engineering buys you.'}
      ]},
      { t:'Deliberately pollute a session, then clean it', body:[
        {p:'In the second session, ask for three unrelated things in a row — a Dockerfile, a rename of `qty` to `quantity`, then a caching layer. Reject each one. Then ask it to go back to the SQL fix.'},
        {p:'Observe the confusion. Now run `/compact`, restate the SQL task cleanly, and observe the difference.'},
        {code:{name:'opencode TUI',body:'/compact'}}
      ]},
      { t:'Record what you learned', body:[
        {p:'Create a scratch file in the repo — you will fold it into `AGENTS.md` in Chapter 4.'},
        {code:{name:'notes.md',body:'# Context notes\n\nAlways true for this repo (candidates for AGENTS.md):\n- persistence belongs in app/db.py, routes in app/main.py\n- no new dependencies without discussion\n- parameterised SQL only\n\nTask-specific (belongs in the task, not AGENTS.md):\n- "fix delete_order first, it is the worst one"'}}
      ]}
    ]
  },
  expected: 'Two visibly different answers to the same underlying request, a first-hand experience of session pollution and recovery, and a `notes.md` distinguishing standing rules from task-specific facts.',
  validation: [
    { l:'The vague prompt produced generic advice, the specific one produced a targeted plan', d:'You have seen the effect directly rather than been told about it.' },
    { l:'The second answer respected your constraints', d:'No new dependency, no signature change, no edits to `main.py`.' },
    { l:'You can state one thing the polluted session got wrong', d:'Recognising pollution is what lets you cure it early.' },
    { l:'`notes.md` separates always-true rules from this-task facts', d:'This is the distinction that determines where knowledge should live.' }
  ],
  bestPractices: [
    'Name the exact files with `@`. "The service" is not a file reference.',
    'State constraints as explicitly as goals — especially what must **not** change.',
    'One session per task. Start a new one when the task changes.',
    '`/compact` at the first sign of confusion rather than pushing through it.',
    'Ask for the plan before the code on anything non-trivial. Plans are cheap to reject.'
  ],
  mistakes: [
    { bad:'Pasting the entire repository "so it has everything."', good:'Supply the files the task actually touches. Irrelevant tokens crowd out relevant ones.' },
    { bad:'Running one enormous session all day.', good:'One session per task. `/new` costs nothing; a confused agent costs an afternoon.' },
    { bad:'Repeating the same standing rule in every prompt.', good:'If it is always true, it belongs in `AGENTS.md` — write it once, get it everywhere.' },
    { bad:'Assuming the agent remembers a decision from yesterday.', good:'It remembers nothing across sessions. Durable knowledge must live in the repository.' }
  ],
  summary: [
    'The context window is a budget; irrelevant tokens displace relevant ones.',
    'Four sources of context: the task, referenced files, `AGENTS.md`, and Skills — each with a different lifetime.',
    'Constraints are the most commonly omitted and most valuable context you can supply.',
    'Pollution is real and curable: `/compact` to condense, `/new` to reset.',
    'A clear project structure is context that costs nothing to transmit.'
  ],
  checkpoint: [
    { q:'A rule that is true for every task in your repository belongs in:',
      options:['Every prompt you write','`AGENTS.md`','A Skill','A comment in the code'],
      answer:1,
      explain:'`AGENTS.md` is read every session, so a standing rule written there applies automatically for every developer and every task. Repeating it per prompt wastes effort and eventually gets forgotten; a Skill is for occasional procedures, not constant truths.' },
    { q:'Mid-session the agent starts re-suggesting an approach you already rejected. The best first move is:',
      options:['Switch to a bigger model','Run `/compact` or start a new session','Repeat the rejection more forcefully','Paste more files for context'],
      answer:1,
      explain:'That is classic context pollution — the rejected approach is still in the window and still reads as relevant. Condensing or resetting the session removes the debris; adding more files makes the crowding worse.' },
    { q:'Which of these is the highest-signal context for a bug fix?',
      options:['The whole repository','The failing test output and the function under test','A description of how the feature should ideally work','The project README'],
      answer:1,
      explain:'The failing output plus the relevant function is precisely scoped evidence — it tells the agent what is wrong and where. The repo is mostly noise, and an ideal-state description does not localise the defect.' }
  ]
},

{
  id: 3,
  title: 'Project Documentation as Infrastructure',
  short: 'Project Documentation',
  icon: '3',
  difficulty: 'Intermediate',
  minutes: 30,
  track: 'Foundations',
  why: 'Documentation used to be a courtesy to future humans. With agents in the loop it is **executable infrastructure**: it is the context every session starts from. An undocumented repository forces every developer and every agent to re-derive the same understanding, badly, forever. Worse — the agent will not tell you it is guessing.',
  objectives: [
    'Identify the minimum viable documentation set for a service',
    'Use OpenCode to draft documentation and verify it against the code',
    'Recognise and prevent confidently-wrong generated documentation',
    'Produce a real README and architecture document for orders-api'
  ],
  concept: [
    { h: 'The minimum viable documentation set',
      body: [
        {table:{head:['Document','Answers','Who reads it'],rows:[
          ['`README.md`','What is this, how do I run it?','New developer, day one'],
          ['`docs/architecture.md`','How is it put together, and why?','Anyone changing structure'],
          ['`docs/api.md`','What endpoints exist and what do they return?','Consumers, testers'],
          ['`docs/deployment.md`','How does it reach production?','On-call, release engineer'],
          ['`docs/troubleshooting.md`','It is broken — now what?','On-call at 3am'],
          ['`docs/coding-style.md`','How do we write code here?','Everyone, including the agent']
        ]}},
        {p:'Six files. Most services have zero. The cost of writing them is a few hours once; the cost of not writing them is paid by every person and every session that follows.'}
      ]},
    { h: 'Documentation the agent can use',
      body: [
        {p:'Human documentation tolerates vagueness because humans ask follow-up questions. Agents do not — they fill gaps with plausible invention. So documentation that serves as context has stricter requirements.'},
        {table:{head:['Weak','Strong'],rows:[
          ['"Uses a database"','"SQLite via `app/db.py`; one module-level connection, `check_same_thread=False`"'],
          ['"Follow standard style"','"snake_case functions, PascalCase classes, type hints on all public functions"'],
          ['"Handles errors appropriately"','"Return `HTTPException` with a 4xx status; never return `{\'error\': ...}` with a 200"'],
          ['"Deployed to the cluster"','"`uvicorn app.main:app`, port 8000, container built from `Dockerfile`"']
        ]}},
        {p:'The pattern: **name the file, the symbol, the command, or the number.** If a sentence could describe a hundred different services, it is not context — it is decoration.'}
      ]},
    { h: 'Generated documentation is a hypothesis',
      body: [
        {p:'An agent will write you a beautiful README in nine seconds. It will describe endpoints that do not exist, a config file you never created, and an environment variable it inferred from a naming convention. It is not lying; it is pattern-matching against thousands of similar services.'},
        {note:{kind:'danger',title:'The most dangerous artefact in this course',body:'Confidently wrong documentation is worse than no documentation. Missing docs make people read the code. Wrong docs make them trust a fiction — and the next agent session ingests that fiction as ground truth and builds on it.'}},
        {p:'So the workflow is never "generate and commit." It is **generate → verify claim by claim → correct → commit.**'}
      ]},
    { h: 'A verification pass that actually works',
      body: [
        {p:'After generating a document, run a second, adversarial pass — ideally in a fresh session so the agent is not defending its own work.'},
        {code:{name:'verification prompt',body:'Read @README.md against @app/main.py and @app/db.py.\n\nList every statement in the README that is NOT supported by the\ncode. For each one quote the README line and say why it is wrong,\nunverifiable, or invented. Do not fix anything — just report.'}},
        {p:'This "prove it from the source" pattern recurs throughout the course. It works because you have replaced an open-ended generation task with a narrow checking task, which is far harder to get plausibly wrong.'}
      ]},
    { h: 'Documentation drift',
      body: [
        {p:'A document that is wrong is worse than one that is missing, and every document starts drifting the moment it is merged. Two habits keep drift survivable:'},
        {list:[
          '**Docs in the same commit as the change.** Not "a docs PR later" — later never arrives',
          '**Date the volatile claims.** "As of 2026-08, deployed manually" ages honestly; "deployed manually" just becomes a lie'
        ]}
      ]}
  ],
  enterprise: [
    {p:'In a regulated or air-gapped environment, documentation carries weight beyond convenience: it is the evidence trail. Three points matter organisationally.'},
    {list:[
      '**A documentation standard beats documentation heroics.** One team writing beautiful docs while nine do not leaves you with nine undocumented services. Standardise the file set, then template it.',
      '**Docs are reviewed like code.** Same PR, same reviewer, same rigour. An unreviewed generated README is an unreviewed change to every future agent session.',
      '**Decision records are the highest-value document nobody writes.** Code shows what; `decisions.md` shows *why*, and why is what stops the next person — or the next agent — from "helpfully" undoing a deliberate choice.'
    ]},
    {note:{kind:'best',title:'Definition of Done for documentation',body:'A document is done when a developer who has never seen the service can run it, change it safely, and know who to ask — **and** every factual claim in it can be traced to a specific line of code or config.'}}
  ],
  exercise: {
    intro: 'orders-api has no documentation at all. You will produce a verified README and architecture document — verified being the operative word.',
    steps: [
      { t:'Generate a first draft', body:[
        {p:'Fresh session. Be explicit about scope and about not inventing.'},
        {code:{name:'opencode prompt',body:'Read @app/main.py, @app/db.py and @requirements.txt.\n\nWrite a README.md with: purpose, how to install, how to run,\nthe endpoint list, and known limitations.\n\nRules:\n  - describe ONLY what the code actually does\n  - if something is unknown, write "UNKNOWN — needs confirmation"\n    instead of guessing\n  - no badges, no marketing language'}}
      ]},
      { t:'Run the adversarial verification pass', body:[
        {p:'Start a **new** session first — you want a checker, not an author defending a draft.'},
        {code:{name:'opencode prompt',body:'Read @README.md against @app/main.py and @app/db.py.\n\nList every statement in the README that is not supported by the\ncode. Quote each line and explain why it is wrong or unverifiable.\nDo not change any files.'}},
        {p:'Correct the README yourself based on the findings you agree with. Note how many claims failed the check — most people are surprised.'}
      ]},
      { t:'Write the architecture document', body:[
        {p:'Architecture is where the agent needs the most human input, because intent is not visible in code.'},
        {code:{name:'opencode prompt',body:'Create docs/architecture.md for this service covering:\n  - the module layout and what each module is responsible for\n  - the request flow for POST /orders, end to end\n  - the data model as it exists in db.py\n  - known structural weaknesses\n\nFacts from the code only. Mark anything you infer as INFERRED.'}}
      ]},
      { t:'Add the decisions the code cannot show', body:[
        {p:'Edit `docs/architecture.md` by hand and add a short section the agent could never have written:'},
        {code:{name:'docs/architecture.md (append)',body:'## Deliberate decisions\n\n- SQLite, not Postgres — this service is single-node by design\n  and expected to stay under 10k orders. Revisit above that.\n- No ORM — the query surface is tiny; an ORM would be more code\n  to review, not less.\n- Money is currently a float. This is a KNOWN DEFECT, not a\n  decision. See docs/known-issues.md.'}},
        {note:{kind:'tip',title:'Why this section matters most',body:'This is the part no agent can generate, and the part that prevents the next person from "fixing" SQLite into Postgres because it looked like an oversight.'}}
      ]},
      { t:'Commit documentation as a real change', body:[
        {code:{name:'terminal',body:'git add README.md docs/\ngit commit -m "Document orders-api: README and architecture"'}}
      ]}
    ]
  },
  expected: 'A `README.md` whose every claim you have verified against the source, a `docs/architecture.md` including a human-written decisions section, and a commit containing both.',
  validation: [
    { l:'Every README claim traces to a real line of code', d:'You ran the verification pass and corrected what it found.' },
    { l:'The README contains no invented endpoints, env vars, or config files', d:'The most common failure mode of generated docs.' },
    { l:'`architecture.md` explains the `POST /orders` flow end to end', d:'A new developer could follow the request through the code.' },
    { l:'The decisions section states **why**, not just what', d:'This is the part that survives contact with the next developer.' },
    { l:'Everything is committed', d:'Documentation that is not in the repo is not documentation.' }
  ],
  bestPractices: [
    'Instruct the agent to write "UNKNOWN" rather than guess — it will comply, and unknowns are honest.',
    'Verify in a fresh session. An author defending its own draft is a weak reviewer.',
    'Write the *why* yourself. Code shows what; only a human knows the intent.',
    'Ship documentation in the same commit as the change it describes.',
    'Date volatile claims so they age into "outdated" rather than "false".'
  ],
  mistakes: [
    { bad:'Committing a generated README without reading it line by line.', good:'Verify every factual claim. Wrong docs poison every future session that reads them.' },
    { bad:'Asking for docs with no file references, from the repo root.', good:'Name the files. Otherwise it documents a service it imagined.' },
    { bad:'Letting the agent write the architecture rationale.', good:'It can describe structure; it cannot know intent. Write the decisions section yourself.' },
    { bad:'A separate "documentation sprint" scheduled for later.', good:'Docs in the same commit as the code. Later is where documentation goes to die.' }
  ],
  summary: [
    'Documentation is context infrastructure, not courtesy — it is where every session starts.',
    'Six documents cover most services; most services have none of them.',
    'Strong documentation names files, symbols, commands, and numbers.',
    'Generated documentation is a hypothesis: generate, verify against source, correct, then commit.',
    'The *why* — decisions and their rationale — is the part only a human can supply.'
  ],
  checkpoint: [
    { q:'Why is confidently-wrong documentation worse than missing documentation?',
      options:['It takes longer to write','People and future agent sessions trust it and build on the error','It uses more disk space','It is harder to delete'],
      answer:1,
      explain:'Missing docs send people to the source. Wrong docs are believed — and once committed they become ground truth for every subsequent session, so a single invented claim propagates into future work.' },
    { q:'The best way to verify a generated README is to:',
      options:['Ask the same session if it is correct','Ask in a fresh session to list claims unsupported by the code','Run the test suite','Have the agent regenerate it and compare'],
      answer:1,
      explain:'A fresh session has no stake in defending the draft, and "list unsupported claims" is a narrow checking task rather than an open-ended generative one — which makes it much harder to get plausibly wrong.' },
    { q:'Which part of an architecture document should a human always write?',
      options:['The module list','The request flow','The rationale behind decisions','The data model'],
      answer:2,
      explain:'Structure is visible in the code and can be described accurately by an agent. Intent is not in the code at all — only a human knows why SQLite was chosen, so only a human can stop the next person from "fixing" it.' }
  ]
},

{
  id: 4,
  title: 'AGENTS.md — Standing Orders',
  short: 'AGENTS.md',
  icon: '4',
  difficulty: 'Intermediate',
  minutes: 30,
  track: 'Context & Knowledge',
  why: 'If you find yourself typing "remember, parameterised queries only" for the third time this week, you have found a bug in your workflow, not in the model. `AGENTS.md` is the file OpenCode reads at the start of **every** session. It is where a rule stops being something you remember to say and becomes something the project simply enforces — for you, for your colleagues, and for every future session.',
  objectives: [
    'Explain what `AGENTS.md` is, when it loads, and what it costs',
    'Decide what belongs in it and — just as important — what does not',
    'Choose between project scope and personal scope',
    'Write a real `AGENTS.md` for orders-api and prove the agent obeys it'
  ],
  concept: [
    { h: 'What it is and when it loads',
      body: [
        {p:'`AGENTS.md` sits at your project root and is loaded into context **every session, automatically**. You do not reference it, mention it, or remind the agent about it. It is simply true.'},
        {table:{head:['Scope','Path','Use for'],rows:[
          ['**Project**','`AGENTS.md` at the repo root','Rules about *this codebase*. Committed and shared with the team'],
          ['**Personal**','`~/.config/opencode/AGENTS.md`','Your own preferences across all projects. Never committed'],
          ['**Fallback**','`~/.claude/CLAUDE.md`','Used when no `AGENTS.md` exists — handy if you already keep one']
        ]}},
        {note:{kind:'warn',title:'The filename is plural',body:'It is `AGENTS.md`, not `AGENT.md`. The singular is the single most common setup mistake in this course — the file looks right, reads right, and is never loaded, so the agent quietly ignores every rule you wrote.'}},
        {p:'`/init` inside the TUI generates a first draft tailored to your repo. Treat that draft the way you treated the generated README in Chapter 3: a starting point to be cut down and corrected, never a finished artefact.'}
      ]},
    { h: 'Always loaded means always paying',
      body: [
        {p:'Because it enters context every session, every line in `AGENTS.md` is a line you pay for on every single task — including the ones it has nothing to do with. That gives you a sharp editorial test.'},
        {note:{kind:'best',title:'The inclusion test',body:'A line belongs in `AGENTS.md` only if it is **true for essentially every task** in this repository. If it applies to one task, it belongs in the task. If it applies occasionally, it belongs in a Skill or a doc referenced on demand.'}},
        {p:'A good `AGENTS.md` for a service this size is roughly **40 to 80 lines**. When it drifts past a couple of hundred, it has stopped being standing orders and become documentation — move the bulk into `docs/` and reference it, which is exactly what Chapter 5 covers.'}
      ]},
    { h: 'A structure that works',
      body: [
        {p:'Six sections cover almost every project. The order matters: orientation first, then rules, then the bar for finishing.'},
        {table:{head:['Section','Answers','Example line'],rows:[
          ['**What this is**','What am I working on?','"A FastAPI service that records customer orders"'],
          ['**Layout**','Where does code go?','"`app/db.py` — all persistence. No SQL anywhere else"'],
          ['**Commands**','How do I run and test it?','"test: `pytest -q`"'],
          ['**Conventions**','How is code written here?','"snake_case functions, type hints on public functions"'],
          ['**Hard constraints**','What must never happen?','"Never build SQL with string concatenation"'],
          ['**Definition of done**','When is work finished?','"Code + failing-without-the-fix test + docs, same commit"']
        ]}},
        {p:'The **hard constraints** section earns its keep faster than any other. Everything above it shapes the work; that section prevents specific, expensive mistakes you have already seen once.'}
      ]},
    { h: 'What does not belong',
      body: [
        {list:[
          '**Anything task-specific.** "Fix `delete_order` first" is a task, not a standing order',
          '**Narrative and tutorials.** It is a rulebook, not a README. Humans read the README',
          '**Secrets or credentials.** It is committed. Treat it as public',
          '**Aspirations.** "We aim for 90% coverage" when you have none teaches the agent to write fiction. State what is true, or state the gap explicitly',
          '**Anything already obvious from the code.** The agent can see that you use FastAPI'
        ]},
        {note:{kind:'danger',title:'Stale rules are worse than no rules',body:'An `AGENTS.md` that says "all persistence lives in `db.py`" after someone moved half of it into `main.py` will actively push the agent toward the wrong structure — with full confidence, every session, until somebody notices.'}}
      ]},
    { h: 'Rules the agent can actually follow',
      body: [
        {p:'The same specificity rule from Chapter 3 applies, and it bites harder here because these lines execute on every task.'},
        {table:{head:['Vague — ignorable','Specific — enforceable'],rows:[
          ['"Write clean code"','"Functions under 40 lines; extract rather than nest past 3 levels"'],
          ['"Handle errors properly"','"`raise HTTPException(status_code=...)`; never return `{\'error\': ...}` with a 200"'],
          ['"Be careful with SQL"','"Parameterised queries only. Never `+` or `%` into a SQL string"'],
          ['"Add tests"','"Every fix needs a test that fails without it. `pytest -q` must pass"'],
          ['"Keep it simple"','"No new dependencies without asking first"']
        ]}},
        {p:'Read your rules back and ask: *could a new contractor follow this without asking a question?* If not, the agent cannot either — it will just fail silently instead of asking.'}
      ]}
  ],
  enterprise: [
    {p:'`AGENTS.md` is the cheapest governance mechanism most organisations have available, and the most commonly skipped. It is version-controlled, reviewable, diffable policy that applies automatically to everyone who opens the repository.'},
    {list:[
      '**Template it centrally, own it locally.** A platform team supplies the skeleton and the non-negotiable security clauses; each service fills in its own layout and commands. Nobody starts from a blank file.',
      '**Review it like code.** A change to `AGENTS.md` changes the behaviour of every future session in that repo. That deserves a reviewer, not a drive-by commit.',
      '**Pair it with `opencode.json` permissions.** `AGENTS.md` states intent; `permission` settings enforce boundaries the agent cannot talk its way past. Guidance plus guardrail.',
      '**Keep personal rules personal.** Your habits belong in `~/.config/opencode/AGENTS.md`. Pushing them into a shared repo makes your preferences everyone\'s policy.'
    ]},
    {code:{name:'opencode.json — guardrails alongside the guidance',body:'{\n  "permission": {\n    "skill": { "*": "allow", "internal-*": "deny" }\n  },\n  "instructions": [\n    "docs/coding-style.md",\n    "docs/security.md"\n  ]\n}'}},
    {p:'The `instructions` field pulls additional rule files into context without bloating `AGENTS.md` itself — the bridge into Chapter 5.'}
  ],
  exercise: {
    intro: 'orders-api has no `AGENTS.md`. You will generate a draft, cut it down hard, add the constraints you learned in Chapters 1 to 3, and then prove it works by giving the agent a task and saying nothing about the rules.',
    steps: [
      { t:'Generate the baseline draft', body:[
        {p:'From inside the repo, in the TUI:'},
        {code:{name:'opencode TUI',body:'/init'}},
        {p:'Read what it produced. It will be reasonable and too long, and some of it will describe intentions rather than facts.'}
      ]},
      { t:'Cut it to the bone', body:[
        {p:'Apply the inclusion test line by line: is this true for essentially every task here? Delete anything that fails. Expect to remove half.'},
        {note:{kind:'tip',title:'A useful cut',body:'Anything the agent can see for itself by opening one file — the framework, the language, the obvious directory names — is not worth the standing cost.'}}
      ]},
      { t:'Write the real file', body:[
        {p:'Replace `AGENTS.md` with this, adjusting anything that does not match your repo:'},
        {code:{name:'AGENTS.md',body:'# AGENTS.md\n\n## What this is\norders-api — a FastAPI service that records customer orders.\nSingle-node, SQLite, no ORM. Expected to stay under 10k orders.\n\n## Layout\n- app/main.py   HTTP routes only. No SQL, no business rules.\n- app/db.py     All persistence. Parameterised queries only.\n- tests/        pytest. One file per module under test.\n- docs/         architecture, decisions, known issues.\n\n## Commands\n- run:    uvicorn app.main:app --reload\n- test:   pytest -q\n\n## Conventions\n- snake_case for functions, PascalCase for classes.\n- Type hints on every public function.\n- Errors: raise HTTPException with a 4xx status.\n  Never return {"error": ...} with a 200.\n\n## Hard constraints\n- No new dependencies without asking first.\n- Never build SQL with string concatenation or % formatting.\n- Never commit secrets. API_TOKEN in main.py is a known defect,\n  not a pattern to copy.\n- Do not change public route paths.\n\n## Definition of done\nCode, plus a test that fails without the change, plus any doc\nupdate — all in the same commit. pytest -q passes.'}}
      ]},
      { t:'Prove it works — say nothing about the rules', body:[
        {p:'Start a **new** session. Give a task that would trip every constraint if the file were being ignored, and deliberately do not mention any of them:'},
        {code:{name:'opencode prompt',body:'Add a function to app/db.py that finds all orders for a given\ncustomer name. Wire it up as GET /orders/by-customer/{name}\nin app/main.py.'}},
        {p:'Now check the result against `AGENTS.md` without being told: is the query parameterised? Did the SQL stay out of `main.py`? Is there a type hint? Did it add a dependency? Did it write a test?'}
      ]},
      { t:'Fix the file, not the prompt', body:[
        {p:'For anything it got wrong, resist correcting it in chat. Ask instead: **which line of `AGENTS.md` was missing or too vague?** Sharpen that line, start a fresh session, and run the same task again.'},
        {note:{kind:'best',title:'This loop is the whole chapter',body:'Correcting the agent fixes one task. Correcting the file fixes every task, for everyone, forever. Any time you catch yourself repeating an instruction, that is a defect in `AGENTS.md`.'}}
      ]},
      { t:'Commit it', body:[
        {code:{name:'terminal',body:'git add AGENTS.md\ngit commit -m "Add AGENTS.md: layout, conventions, hard constraints"'}}

  validation: [

{
  id: 5,
  title: 'Knowledge Files: The Project Brain',
  short: 'Knowledge Files',
  icon: '5',
  difficulty: 'Intermediate',
  minutes: 35,
  track: 'Context & Knowledge',
  why: '`AGENTS.md` must stay short, but your project knows far more than 60 lines worth. Deployment procedures, security rules, the bug everyone has hit twice, the reason you rejected Postgres — all of it is real context that cannot live in a file loaded on every task. Knowledge files are where that knowledge goes so it can be pulled in **when relevant** instead of always or never.',
  objectives: [
    'Explain the three-tier context model: always loaded, referenced, on demand',
    'Name the nine knowledge files and what each one prevents',
    'Wire additional rule files into context via `opencode.json`',
    'Build a real `docs/` set for orders-api, including the files no agent can write'
  ],
  concept: [
    { h: 'Three tiers of knowledge',
      body: [
        {table:{head:['Tier','Lives in','Loaded','Cost'],rows:[
          ['**Always**','`AGENTS.md`','Every session','Paid on every task'],
          ['**Referenced**','`docs/*.md` via `instructions` or `@path`','When wired in or named','Paid when used'],
          ['**On demand**','Skills (Chapter 11)','When the agent decides it is relevant','~one line until used']
        ]}},
        {p:'Almost every context problem is a **tier assignment problem**. A rule in the wrong tier is either burning budget on tasks it does not apply to, or missing from the one task where it mattered.'},
        {note:{kind:'tip',title:'Deciding the tier',body:'Ask how often it is relevant. Every task → `AGENTS.md`. Some tasks, predictably → `docs/` referenced by name. Occasionally, and the agent can recognise when → a Skill.'}}
      ]},
    { h: 'The nine files and what each one prevents',
      body: [
        {p:'Each of these exists because something goes wrong without it. That failure mode is the reason to write it — not completeness for its own sake.'},
        {table:{head:['File','Holds','Without it'],rows:[
          ['`architecture.md`','Module boundaries, request flow, data model','The agent invents a structure and spreads SQL through your routes'],
          ['`coding-style.md`','Naming, typing, error handling, file layout','Every generated file matches a different codebase\'s conventions'],
          ['`api.md`','Endpoints, payloads, status codes, versioning','Breaking changes to a public contract look like tidying up'],
          ['`testing.md`','Framework, layout, what must be tested, how to run','Tests appear in three styles and nobody runs them'],
          ['`security.md`','Auth model, secret handling, input validation rules','The hardcoded token gets copied into the next endpoint'],
          ['`deployment.md`','How it ships, config, environments, rollback','Changes that cannot be deployed get merged'],
          ['`known-issues.md`','Defects you have accepted, with impact','The agent "fixes" a known trade-off and breaks something else'],
          ['`decisions.md`','Choices made and **why**, dated','SQLite gets swapped for Postgres because it looked accidental'],
          ['`troubleshooting.md`','Symptoms, causes, fixes','Every incident is debugged from scratch at 3am']
        ]}},
        {note:{kind:'best',title:'The two highest-value files',body:'`decisions.md` and `known-issues.md` are the two an agent can never generate, because both record human intent rather than code facts. They are also the two that most reliably prevent an agent from confidently undoing something deliberate.'}}
      ]},
    { h: 'Wiring files into context',
      body: [
        {p:'Two mechanisms, and the choice between them is exactly the tier question again.'},
        {code:{name:'opencode.json — always pulled in',body:'{\n  "instructions": [\n    "docs/coding-style.md",\n    "docs/security.md"\n  ]\n}'}},
        {p:'The `instructions` field accepts file paths, globs, or URLs. Use it sparingly: anything listed here is effectively promoted to tier one, so it should be rules the agent needs on essentially every code change.'},
        {code:{name:'per-task reference in the TUI',body:'read @docs/deployment.md and tell me what breaks\nif we add an environment variable'}},
        {p:'For everything else, name the file in the task. That is the whole point of the middle tier: precise, deliberate, paid only when it earns its place.'}
      ]},
    { h: 'Writing them without generating fiction',
      body: [
        {p:'Chapter 3\'s rule holds and gets sharper here: an agent can describe **what the code does**, and cannot know **what you decided**. Split the work accordingly.'},
        {table:{head:['Agent drafts well','You must write'],rows:[
          ['`architecture.md` structure section','The rationale behind that structure'],
          ['`api.md` endpoint list','Which parts are a public contract'],
          ['`testing.md` how-to-run','What must be tested before release'],
          ['`troubleshooting.md` from real errors','Which failures are known and accepted'],
          ['Nothing in `decisions.md`','All of it — it is pure intent'],
          ['A first pass at `known-issues.md`','The impact and the reason it is still open']
        ]}},
        {p:'A practical split: let the agent produce the factual scaffolding for six of the nine, then write `decisions.md`, `known-issues.md`, and every *why* paragraph yourself.'}
      ]},
    { h: 'Keeping them alive',
      body: [
        {p:'Nine files is nine chances to drift. Three habits keep the set honest without turning documentation into a second job:'},
        {list:[
          '**Same commit.** A change that invalidates a doc updates that doc in the same commit. This is already in your `AGENTS.md` definition of done',
          '**Date the volatile ones.** Entries in `decisions.md` and `known-issues.md` carry a date. An undated decision from 2023 reads as current policy',
          '**Delete aggressively.** A resolved known issue gets removed, not annotated. Files people trust are files people maintain'
        ]},
        {note:{kind:'warn',title:'Nine files is a target, not a rule',body:'Three accurate files beat nine stale ones. Start with `architecture.md`, `decisions.md`, and `known-issues.md`; add the rest when their absence actually costs you something.'}}
      ]}
  ],
  enterprise: [
    {p:'Knowledge files are where organisational memory stops depending on individuals. The developer who knew why the retry limit is three will change teams; `decisions.md` will not.'},
    {list:[
      '**Standardise the filenames across services.** When every repo uses the same nine names, both people and agents know where to look without being told — the convention itself becomes context.',
      '**Security and style are usually organisational, not per-service.** Keep a central source and reference it; per-service copies diverge within a quarter.',
      '**Decision records are audit evidence.** In a regulated environment, "why does this service store data this way" needs an answer with a date on it, not a recollection.',
      '**Onboarding is the honest test.** If a new developer can be productive from `docs/` alone, your agent can be too. Both are reading the same thing.'
    ]},
    {note:{kind:'info',title:'A note on cost at scale',body:'Promoting a file into `instructions` multiplies its cost by every session your organisation runs. It is a real budget decision, not a formality — reserve tier one for rules that genuinely apply to every change.'}}
  ],
  exercise: {
    intro: 'You will build the `docs/` set for orders-api: let the agent draft what it can see, write the intent yourself, and wire the two organisational files into `opencode.json`.',
    steps: [
      { t:'Create the structure', body:[
        {code:{name:'terminal',body:'mkdir -p docs'}},
        {p:'You already wrote `docs/architecture.md` in Chapter 3. The remaining eight join it here.'}
      ]},
      { t:'Draft the factual files', body:[
        {p:'One task, explicit about scope and about not inventing:'},
        {code:{name:'opencode prompt',body:'Read @app/main.py, @app/db.py and @AGENTS.md.\n\nCreate these files, based only on what the code actually does:\n  docs/api.md          every endpoint, its params, and what it returns\n  docs/coding-style.md the conventions this repo actually follows,\n                       noting where the code is inconsistent\n  docs/testing.md      how to run tests and what is currently untested\n\nRules:\n  - facts from the code only\n  - where something is missing or inconsistent, say so plainly\n  - do not invent endpoints, env vars, or config files'}},
        {p:'Note that `coding-style.md` is asked to report inconsistency rather than paper over it — `getOrders` beside `get_order` is a fact worth recording.'}
      ]},
      { t:'Write security.md and deployment.md yourself', body:[
        {p:'These describe intent and environment, so the agent has no basis for them. Keep them short and true.'},
        {code:{name:'docs/security.md',body:'# Security\n\n## Current state — honest version\n- API_TOKEN is hardcoded in app/main.py. KNOWN DEFECT.\n  It must move to an environment variable. Do not copy this\n  pattern into any new endpoint.\n- delete_order() builds SQL with % formatting. INJECTION RISK.\n- No authentication on GET or POST. Anyone who can reach the\n  service can read and create orders.\n\n## Rules for all changes\n- Parameterised queries only. No exceptions.\n- No secrets in source. Environment variables only.\n- Validate all path and query parameters before use.\n- New endpoints that mutate data require an auth check.'}},
        {code:{name:'docs/deployment.md',body:'# Deployment\n\nAs of 2026-08: deployed manually. There is no pipeline.\n\n## Run locally\n    pip install -r requirements.txt\n    uvicorn app.main:app --reload\n\n## Production\n    uvicorn app.main:app --host 0.0.0.0 --port 8000\n\n## State\nSQLite file orders.db is created next to the working directory.\nIt is NOT backed up. Losing the host loses the data.\n\n## Rollback\nRedeploy the previous commit. There are no migrations, so\nrollback is safe as long as the schema has not changed.'}}
      ]},
      { t:'Write the two files no agent can write', body:[
        {p:'This is the highest-value step in the chapter.'},
        {code:{name:'docs/decisions.md',body:'# Decisions\n\nEach entry: what was decided, when, and why. Do not delete\nentries — supersede them with a newer dated entry.\n\n## 2026-08 — SQLite, not Postgres\nSingle-node service, expected under 10k orders. A managed\ndatabase would add operational cost for no benefit at this\nsize. Revisit above 10k orders or if we need concurrent writers.\n\n## 2026-08 — No ORM\nThe query surface is four statements. An ORM would be more\ncode to review, not less. Revisit if the query count passes ~20.\n\n## 2026-08 — Routes and persistence stay separate\napp/main.py holds no SQL. This is the one structural rule we\nenforce, because it is what makes the service testable.'}},
        {code:{name:'docs/known-issues.md',body:'# Known issues\n\nDefects we know about. Listed so nobody "discovers" them again\nand so no agent treats them as intended behaviour.\n\n## Money is stored as a float — OPEN\ntotal is REAL in SQLite and float in Python. Rounding errors\nare possible on large orders. Fix: integer minor units.\nImpact: low today, unacceptable if we take payments.\n\n## No input validation on qty or price — OPEN\nNegative and zero quantities are accepted. See TODO in\ncreate_order.\n\n## Inconsistent naming — OPEN\ngetOrders and deleteOrder are camelCase; everything else is\nsnake_case. Fix during any change that touches those routes.\n\n## No tests — OPEN\nThere is no test suite at all. This is the highest-priority gap.'}}
      ]},
      { t:'Write troubleshooting.md from real failures', body:[
        {p:'Break the service on purpose, then record what you saw. Documentation written from a real error beats documentation written from imagination.'},
        {code:{name:'terminal',body:'# start it, then request a bad id and watch it fail\nuvicorn app.main:app --reload\ncurl "http://127.0.0.1:8000/orders/not-a-number"'}},
        {p:'Record the actual symptom, the actual cause, and the actual fix in `docs/troubleshooting.md`.'}
      ]},
      { t:'Wire the organisational rules into context', body:[
        {p:'Style and security apply to essentially every code change, so they earn tier one:'},
        {code:{name:'opencode.json',body:'{\n  "instructions": [\n    "docs/coding-style.md",\n    "docs/security.md"\n  ]\n}'}},
        {p:'Everything else stays in the middle tier — referenced by name when a task needs it.'}
      ]},
      { t:'Prove the wiring works', body:[
        {p:'New session. Ask for something that should trip the security file without mentioning it:'},
        {code:{name:'opencode prompt',body:'Add a DELETE /orders endpoint that deletes every order.'}},
        {p:'A correctly wired setup pushes back: this needs an auth check, and it must not follow the `API_TOKEN` pattern. If it silently writes the endpoint, your `instructions` wiring is not doing its job.'}
      ]},
      { t:'Commit the brain', body:[
        {code:{name:'terminal',body:'git add docs/ opencode.json\ngit commit -m "Add knowledge files and wire style/security into context"'}}
      ]}
    ]
  },
  expected: 'A `docs/` directory with nine files — six factual, three written by you — plus an `opencode.json` that promotes style and security to always-loaded, and evidence that a fresh session honoured `security.md` unprompted.',
  validation: [
    { l:'All nine files exist and none contains invented facts', d:'Spot-check `api.md` against the actual routes in `main.py`.' },
    { l:'`decisions.md` entries state **why** and carry a date', d:'This is what stops the next person undoing a deliberate choice.' },
    { l:'`known-issues.md` lists the float money, the missing validation, and the missing tests', d:'Known defects are recorded as defects, not left to be rediscovered.' },
    { l:'`security.md` names the hardcoded token as a defect, not a pattern', d:'Otherwise the next endpoint copies it.' },
    { l:'`opencode.json` lists only files that apply to every change', d:'Tier one is expensive. Two files is right; nine would be wasteful.' },
    { l:'A fresh session pushed back on the unauthenticated delete-all endpoint', d:'Proof the `instructions` wiring reaches the agent.' },
    { l:'`troubleshooting.md` describes a failure you actually reproduced', d:'Imagined symptoms do not match real ones.' }
  ],
  bestPractices: [
    'Assign every piece of knowledge a tier deliberately: always, referenced, or on demand.',
    'Let the agent draft what is visible in code; write intent — decisions and known issues — yourself.',
    'Ask for inconsistencies to be reported, not smoothed over. Honest docs are useful docs.',
    'Date entries in `decisions.md` and `known-issues.md`, and supersede rather than delete.',

    'Three accurate files beat nine stale ones. Add files when their absence costs you something.'
  ],

    { bad:'Asking the agent to write `decisions.md`.', good:'It cannot know intent. It will produce plausible reasons for choices nobody made.' },
    { bad:'Documenting the codebase you wish you had.', good:'Record the float money and the missing tests as open defects. Fiction in context becomes fiction in code.' },
    { bad:'Writing `troubleshooting.md` from imagination.', good:'Reproduce a failure and record what actually happened, including the real error text.' },
    { bad:'Nine files created once and never touched again.', good:'Update in the same commit as the change. A stale doc actively misleads every future session.' }
  ],
  summary: [
    'Three tiers: `AGENTS.md` always, `docs/` when referenced, Skills on demand. Most context problems are tier mistakes.',
    'Nine knowledge files, each preventing a specific failure — start with architecture, decisions, and known issues.',
    '`opencode.json`\'s `instructions` field promotes a file to always-loaded; reserve it for rules that apply to every change.',
    'Agents draft what the code shows; humans write what the code cannot — intent, rationale, accepted trade-offs.',
    'Accuracy beats coverage. Stale documentation misleads with total confidence.'
  ],
  checkpoint: [
    { q:'Which file can an agent fundamentally not write for you?',
      options:['`api.md`','`decisions.md`','`testing.md`','`architecture.md`'],
      answer:1,
      explain:'Decisions record human intent — why SQLite was chosen over Postgres — and intent appears nowhere in the code. An agent asked to write it will produce plausible reasons for choices nobody actually made.' },
    { q:'What does the `instructions` field in `opencode.json` do?',
      options:['Sets the system prompt','Pulls additional rule files into context','Configures permissions','Defines custom slash commands'],
      answer:1,

    { q:'Why record a known defect like float money in `known-issues.md`?',
