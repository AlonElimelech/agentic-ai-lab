<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OpenCode Express Lab — 60 Minutes, One Game</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%234f46e5'/><path d='M18 18l12 12M30 18L18 30' stroke='%23fff' stroke-width='6' stroke-linecap='round'/><circle cx='42' cy='42' r='9' fill='none' stroke='%23fff' stroke-width='6'/></svg>" />
<style>
/* ============================================================
   DESIGN TOKENS — shared language with the full lab
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f4f5f9;
  --surface: #ffffff;
  --surface-2: #fafbfd;
  --sidebar: #ffffff;
  --brand: #4f46e5;
  --brand-soft: #ede9fe;
  --brand-text: #4338ca;
  --text: #1a1a2e;
  --text-2: #4b5563;
  --muted: #6b7280;
  --border: #e4e6ee;
  --border-2: #eef0f6;
  --code-bg: #1e1e2e;
  --code-text: #e6e6f0;
  --ok: #059669;
  --ok-soft: #ecfdf5;
  --warn: #b45309;
  --warn-soft: #fffbeb;
  --danger: #dc2626;
  --danger-soft: #fef2f2;
  --info: #0369a1;
  --info-soft: #f0f9ff;
  --radius: 14px;
  --radius-sm: 9px;
  --shadow: 0 1px 2px rgba(16,24,40,.04), 0 4px 20px rgba(16,24,40,.06);
  --shadow-lg: 0 12px 40px rgba(16,24,40,.13);
  --sans: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
  --mono: 'Cascadia Mono', 'JetBrains Mono', Consolas, 'SF Mono', Menlo, monospace;
}

html[data-theme="dark"] {
  --bg: #0b0b12;
  --surface: #14141d;
  --surface-2: #191924;
  --sidebar: #101018;
  --brand: #818cf8;
  --brand-soft: rgba(129,140,248,.14);
  --brand-text: #a5b4fc;
  --text: #e8eaf2;
  --text-2: #b8bdcc;
  --muted: #8b91a3;
  --border: #262636;
  --border-2: #1e1e2b;
  --code-bg: #0a0a10;
  --code-text: #d7dced;
  --ok: #34d399;
  --ok-soft: rgba(52,211,153,.10);
  --warn: #fbbf24;
  --warn-soft: rgba(251,191,36,.10);
  --danger: #f87171;
  --danger-soft: rgba(248,113,113,.10);
  --info: #38bdf8;
  --info-soft: rgba(56,189,248,.10);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 20px rgba(0,0,0,.35);
  --shadow-lg: 0 12px 40px rgba(0,0,0,.5);
}

html { scroll-behavior: smooth; }

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  line-height: 1.62;
  -webkit-font-smoothing: antialiased;
  font-size: 15.5px;
}

/* ============================================================
   LAYOUT SHELL
   ============================================================ */
.shell { display: flex; min-height: 100vh; }

.sidebar {
  width: 282px;
  flex: 0 0 282px;
  background: var(--sidebar);
  border-right: 1px solid var(--border);
  height: 100vh;
  position: sticky;
  top: 0;
  display: flex;
  flex-direction: column;
  z-index: 40;
}

.brand-row {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 20px 20px 16px;
  border-bottom: 1px solid var(--border-2);
}
.logo {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--brand);
  display: grid; place-items: center;
  color: #fff; font-weight: 800; font-size: .95rem;
  flex: 0 0 36px; letter-spacing: -1px;
}
.brand-name { font-weight: 750; letter-spacing: -.35px; font-size: .97rem; line-height: 1.25; }
.brand-sub {
  display: inline-block; margin-top: 2px;
  font-size: .64rem; letter-spacing: .9px; text-transform: uppercase; font-weight: 800;
  background: var(--brand-soft); color: var(--brand-text);
  padding: 2px 8px; border-radius: 99px;
}

.side-progress { padding: 15px 20px; border-bottom: 1px solid var(--border-2); }
.sp-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.sp-label { font-size: .74rem; text-transform: uppercase; letter-spacing: .55px; color: var(--muted); font-weight: 700; }
.sp-pct { font-size: .88rem; font-weight: 750; color: var(--brand-text); }
.bar { height: 7px; background: var(--border); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--brand); border-radius: 99px; transition: width .3s ease; }
.sp-meta { display: flex; justify-content: space-between; margin-top: 9px; font-size: .755rem; color: var(--muted); }
.sp-meta b { color: var(--text-2); font-weight: 700; }

.nav { flex: 1; overflow-y: auto; padding: 12px 12px 28px; }
.nav-head {
  padding: 10px 10px 6px;
  font-size: .715rem; font-weight: 750; letter-spacing: .6px; text-transform: uppercase;
  color: var(--muted);
}
.nav-item {
  width: 100%;
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  font: inherit; font-size: .875rem;
  color: var(--text-2);
  background: none; border: 0; cursor: pointer; text-align: left;
  line-height: 1.35;
  transition: background .13s, color .13s;
}
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item.active { background: var(--brand-soft); color: var(--brand-text); font-weight: 650; }
.nav-item .n {
  flex: 0 0 22px; height: 22px;
  display: grid; place-items: center;
  border-radius: 6px;
  background: var(--border-2);
  font-size: .7rem; font-weight: 750; color: var(--muted);
}
.nav-item.active .n { background: var(--brand); color: #fff; }
.nav-item.done .n { background: var(--ok); color: #fff; }
.nav-item .t { flex: 1; min-width: 0; }
.nav-item .mins { font-size: .7rem; color: var(--muted); font-weight: 650; }

/* ---- main ---- */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 12px;
  padding: 11px 26px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.menu-btn { display: none; }
.spacer { flex: 1; }

.chip {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 13px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 99px; font-size: .8rem; font-weight: 650; white-space: nowrap;
}
.chip .v { color: var(--brand-text); font-weight: 800; }
.chip.time { background: var(--brand-soft); border-color: transparent; color: var(--brand-text); }

.icon-btn {
  width: 36px; height: 36px; flex: 0 0 36px;
  display: grid; place-items: center;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; cursor: pointer; font-size: 1rem;
  color: var(--text-2);
  transition: background .13s, color .13s, border-color .13s;
}
.icon-btn:hover { background: var(--brand-soft); color: var(--brand-text); border-color: var(--brand); }

.view { padding: 34px 26px 90px; max-width: 900px; width: 100%; margin: 0 auto; }

/* ============================================================
   TYPOGRAPHY & PRIMITIVES
   ============================================================ */
h1 { font-size: 2.05rem; font-weight: 800; letter-spacing: -.9px; line-height: 1.18; }
h2 { font-size: 1.28rem; font-weight: 750; letter-spacing: -.45px; margin-bottom: 12px; }
p { color: var(--text-2); }
p + p { margin-top: 11px; }

code:not(pre code) {
  font-family: var(--mono);
  font-size: .855em;
  background: var(--brand-soft);
  color: var(--brand-text);
  padding: 1.5px 6px;
  border-radius: 5px;
  word-break: break-word;
}
strong { color: var(--text); font-weight: 700; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 22px 24px;
  margin-bottom: 18px;
}
.card > h2:first-child { margin-top: 0; }

.sec-label {
  display: flex; align-items: center; gap: 9px;
  font-size: .72rem; font-weight: 800; letter-spacing: .8px; text-transform: uppercase;
  color: var(--muted); margin-bottom: 12px;
}
.sec-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

ul.bullets { padding-left: 0; list-style: none; }
ul.bullets li { position: relative; padding-left: 22px; color: var(--text-2); margin-bottom: 7px; }
ul.bullets li::before {
  content: ''; position: absolute; left: 6px; top: .66em;
  width: 5px; height: 5px; border-radius: 50%; background: var(--brand);
}

.module-head { margin-bottom: 26px; }
.crumb { font-size: .78rem; color: var(--muted); font-weight: 650; letter-spacing: .3px; text-transform: uppercase; margin-bottom: 9px; }
.module-head h1 { margin-bottom: 12px; }
.meta-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 11px; border-radius: 99px;
  font-size: .755rem; font-weight: 700;
  background: var(--surface); border: 1px solid var(--border); color: var(--text-2);
}
.pill.time { background: var(--brand-soft); color: var(--brand-text); border-color: transparent; }
.pill.solved { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.pill.retry { background: var(--danger-soft); color: var(--danger); border-color: transparent; }

/* ---- callouts ---- */
.callout {
  border: 1px solid var(--border);
  border-left: 3px solid var(--muted);
  border-radius: var(--radius-sm);
  padding: 14px 17px;
  margin: 15px 0;
  background: var(--surface-2);
}
.callout .ct { font-weight: 750; font-size: .875rem; margin-bottom: 4px; display: flex; gap: 8px; align-items: center; }
.callout p { font-size: .91rem; }
.callout.tip { border-left-color: var(--ok); background: var(--ok-soft); }
.callout.tip .ct { color: var(--ok); }
.callout.warn { border-left-color: var(--warn); background: var(--warn-soft); }
.callout.warn .ct { color: var(--warn); }
.callout.danger { border-left-color: var(--danger); background: var(--danger-soft); }
.callout.danger .ct { color: var(--danger); }
.callout.info { border-left-color: var(--info); background: var(--info-soft); }
.callout.info .ct { color: var(--info); }
.callout.best { border-left-color: var(--brand); background: var(--brand-soft); }
.callout.best .ct { color: var(--brand-text); }

/* ---- code ---- */
.code {
  background: var(--code-bg);
  border-radius: var(--radius-sm);
  margin: 14px 0;
  overflow: hidden;
  border: 1px solid var(--border);
}
.code-head {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 10px 7px 14px;
  background: rgba(255,255,255,.05);
  border-bottom: 1px solid rgba(255,255,255,.07);
}
.code-name { font-family: var(--mono); font-size: .755rem; color: #9aa2c0; flex: 1; letter-spacing: .2px; }
.copy {
  border: 1px solid rgba(255,255,255,.16);
  background: rgba(255,255,255,.06);
  color: #cbd2e8;
  border-radius: 7px; padding: 3px 10px;
  font: inherit; font-size: .735rem; font-weight: 650; cursor: pointer;
  transition: background .13s, color .13s;
}
.copy:hover { background: var(--brand); color: #fff; border-color: transparent; }
.copy.ok { background: var(--ok); color: #fff; border-color: transparent; }
.code pre { margin: 0; padding: 14px 16px; overflow-x: auto; }
.code code { font-family: var(--mono); font-size: .82rem; line-height: 1.62; color: var(--code-text); white-space: pre; }

/* ---- tables ---- */
.table-wrap { overflow-x: auto; margin: 14px 0; border: 1px solid var(--border); border-radius: var(--radius-sm); }
table { border-collapse: collapse; width: 100%; font-size: .885rem; }
th, td { padding: 9.5px 14px; text-align: left; border-bottom: 1px solid var(--border-2); vertical-align: top; }
th { background: var(--surface-2); font-weight: 750; font-size: .77rem; text-transform: uppercase; letter-spacing: .45px; color: var(--muted); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td { color: var(--text-2); }

/* ---- checkable ---- */
.check {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 11px 13px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  margin-bottom: 8px;
  cursor: pointer;
  transition: border-color .13s, background .13s;
  text-align: left; width: 100%; font: inherit; color: inherit;
}
.check:hover { border-color: var(--brand); }
.check .box {
  flex: 0 0 20px; height: 20px; margin-top: 1px;
  border: 2px solid var(--border); border-radius: 6px;
  display: grid; place-items: center;
  font-size: .72rem; color: transparent;
  transition: background .13s, border-color .13s, color .13s;
}
.check.on { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
.check.on .box { background: var(--ok); border-color: var(--ok); color: #fff; }
.check.on .lbl { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
.check .lbl { flex: 1; font-size: .91rem; color: var(--text-2); }
.check .lbl em { display: block; font-style: normal; font-size: .81rem; color: var(--muted); margin-top: 3px; }

/* ---- steps ---- */
.step { display: flex; gap: 14px; margin-bottom: 20px; }
.step-n {
  flex: 0 0 27px; height: 27px; border-radius: 50%;
  background: var(--brand); color: #fff;
  display: grid; place-items: center;
  font-size: .79rem; font-weight: 750;
}
.step-body { flex: 1; min-width: 0; }
.step-body > .t { font-weight: 700; margin-bottom: 3px; }

/* ---- quiz ---- */
.quiz-q { font-size: 1.03rem; font-weight: 700; margin-bottom: 15px; line-height: 1.45; }
.opt {
  display: flex; gap: 11px; align-items: flex-start;
  width: 100%; text-align: left; font: inherit;
  padding: 12px 15px; margin-bottom: 9px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--text-2); cursor: pointer;
  transition: border-color .13s, background .13s;
}
.opt:hover:not(:disabled) { border-color: var(--brand); background: var(--brand-soft); }
.opt:disabled { cursor: default; }
.opt .k {
  flex: 0 0 23px; height: 23px; border-radius: 6px;
  background: var(--surface-2); border: 1px solid var(--border);
  display: grid; place-items: center; font-size: .76rem; font-weight: 750; color: var(--muted);
}
.opt.right { border-color: var(--ok); background: var(--ok-soft); color: var(--text); }
.opt.right .k { background: var(--ok); border-color: var(--ok); color: #fff; }
.opt.wrong { border-color: var(--danger); background: var(--danger-soft); color: var(--text); }
.opt.wrong .k { background: var(--danger); border-color: var(--danger); color: #fff; }
.explain { margin-top: 12px; }
.quiz-bar { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.quiz-bar .bar { flex: 1; }
.quiz-count { font-size: .8rem; color: var(--muted); font-weight: 700; white-space: nowrap; }

/* ---- buttons ---- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 20px; border-radius: 10px;
  font: inherit; font-size: .89rem; font-weight: 700;
  border: 1px solid transparent; cursor: pointer;
  background: var(--brand); color: #fff;
  transition: filter .13s, background .13s;
}
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: var(--surface); color: var(--text-2); border-color: var(--border); }
.btn.ghost:hover { border-color: var(--brand); color: var(--brand-text); background: var(--brand-soft); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }

/* ---- completion ---- */
.complete-card {
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); padding: 20px 22px; margin-top: 22px;
  display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
}
.complete-card.on { border-color: var(--ok); background: var(--ok-soft); }
.complete-card .cc-txt { flex: 1; min-width: 200px; }
.complete-card .cc-txt b { display: block; font-size: 1rem; }
.complete-card .cc-txt span { font-size: .85rem; color: var(--muted); }

.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 30px; }

/* ============================================================
   DASHBOARD
   ============================================================ */
.hero {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 30px 32px; margin-bottom: 20px;
}
.hero h1 { margin-bottom: 10px; }
.hero .lead { font-size: 1.03rem; max-width: 620px; }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
.stat {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 17px 19px; box-shadow: var(--shadow);
}
.stat .sv { font-size: 1.72rem; font-weight: 800; letter-spacing: -1px; line-height: 1.15; }
.stat .sl { font-size: .755rem; text-transform: uppercase; letter-spacing: .55px; color: var(--muted); font-weight: 700; margin-top: 3px; }
.stat .sh { font-size: .78rem; color: var(--muted); margin-top: 6px; }

.agenda { display: grid; gap: 8px; }
.agenda-row {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 13px; border: 1px solid var(--border);
  border-radius: var(--radius-sm); background: var(--surface);
  cursor: pointer; font: inherit; text-align: left; width: 100%; color: inherit;
  transition: border-color .13s, background .13s;
}
.agenda-row:hover { border-color: var(--brand); background: var(--brand-soft); }
.agenda-row.done { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
.agenda-row .an {
  flex: 0 0 24px; height: 24px; border-radius: 7px;
  background: var(--border-2); color: var(--muted);
  display: grid; place-items: center; font-size: .74rem; font-weight: 750;
}
.agenda-row.done .an { background: var(--ok); color: #fff; }
.agenda-row .at { flex: 1; font-size: .9rem; font-weight: 650; }
.agenda-row .am { font-size: .78rem; color: var(--muted); font-weight: 650; }

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 1080px) { .stats { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 860px) {
  .sidebar {
    position: fixed; left: 0; top: 0; bottom: 0;
    transform: translateX(-100%);
    transition: transform .22s ease;
    box-shadow: var(--shadow-lg);
  }
  body.nav-open .sidebar { transform: none; }
  body.nav-open .scrim { display: block; }
  .scrim { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 35; }
  .menu-btn { display: grid; }
  .view { padding: 24px 17px 80px; }
  .hero { padding: 24px 20px; }
  .card { padding: 18px 17px; }
  h1 { font-size: 1.65rem; }
}
@media (max-width: 560px) {
  .stats { grid-template-columns: 1fr 1fr; }
  .chip.score { display: none; }
}

/* ============================================================
   PRINT
   ============================================================ */
@media print {
  .sidebar, .topbar, .scrim, .pager, .btn, .copy { display: none !important; }
  body { background: #fff; }
  .view { padding: 0; max-width: none; }
  .card { break-inside: avoid; box-shadow: none; }
  @page { margin: 14mm; }
}
</style>
</head>
<body>

<div class="scrim" data-action="close-nav"></div>

<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand-row">
      <div class="logo">X&middot;O</div>
      <div>
        <div class="brand-name">OpenCode Lab</div>
        <span class="brand-sub">Express &middot; 60 min</span>
      </div>
    </div>

    <div class="side-progress">
      <div class="sp-top">
        <span class="sp-label">Progress</span>
        <span class="sp-pct" id="sidePct">0%</span>
      </div>
      <div class="bar"><i id="sideBar" style="width:0%"></i></div>
      <div class="sp-meta">
        <span><b id="sideDone">0</b> / <span id="sideTotal">0</span> modules</span>
        <span><b id="sideLeft">0</b> min left</span>
      </div>
    </div>

    <nav class="nav" id="nav"></nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" data-action="toggle-nav" aria-label="Toggle navigation">&#9776;</button>
      <span class="chip time" id="topTime">60 min</span>
      <div class="spacer"></div>
      <span class="chip score">Score <span class="v" id="topScore">0</span></span>
      <button class="icon-btn" data-action="theme" id="themeBtn" aria-label="Toggle theme">&#9681;</button>
    </header>

    <main class="view" id="view"></main>
  </div>
</div>

<script>
/* ============================================================
   OpenCode Express Lab — 60 minutes, one flat mission.
   Single file, offline, dependency-free.

   Sibling of opencode-lab.html and shares its contracts:
   the block renderer, esc/md, and the Store/Scorer/Router/Quiz
   shape. It uses its OWN localStorage key so the two labs can
   never overwrite each other's progress.

   Regions:
     1. CONTENT DATA  — modules, quiz bank (no DOM)
     2. STORE         — one localStorage key
     3. SCORER        — derived numbers, pure over state
     4. RENDER        — block renderer + views
     5. QUIZ          — checkpoints and the final
     6. ROUTER + BOOT — hash routing, delegated events
   ============================================================ */

/* ============================================================
   1. CONTENT DATA

{
  id: 5,
  title: 'Review What You Got',
  short: 'Review',
  minutes: 10,
  why: 'The game works. That is exactly why this module is dangerous — working and correct are different properties, and generated code carries no signal of where it is weak. A human writes awkward code where they were unsure; an agent writes the same confident output whether it understood the task or not. This is the module that decides whether you are supervising the work or just receiving it.',
  objective: 'Find at least two real defects in the generated game by checking it against your own seven rules.',
  concept: [
    {p:'Review has two halves and people only ever do the first. **Reading what changed** is easy — it is right there in the diff. **Finding what is missing** is the hard half, because an omission leaves no trace: nothing in the file marks the spot where draw detection should have been.'},
    {p:'So you do not review by reading. You review against a **list** — and you already wrote it, in Module 2.'},
    {note:{kind:'best',title:'The hunt list for this exact task',body:'These are the omissions agents reliably make on tic-tac-toe. Test each one in the browser rather than reading for it — it takes ninety seconds and it is far more reliable than reading.'}},
    {table:{head:['#','Test in the browser','What usually goes wrong'],rows:[
      ['1','Fill the board with no winner','No draw detection — the game just sits there'],
      ['2','Click a cell that already has an X','It gets overwritten, or the turn flips anyway'],
      ['3','Win, then keep clicking empty cells','Play continues after somebody already won'],
      ['4','Win, then press Reset, then play again','Stale state: the status line or turn is wrong'],
      ['5','Win on the anti-diagonal (top-right to bottom-left)','That line is missing from the win list'],
      ['6','Press Tab, then Enter on a cell','Cells are `<div>` — not focusable, not activatable'],
      ['7','Look at the status line during play','It never says whose turn it is, or never updates']
    ]}},
    {p:'Rows 1, 3 and 6 are the most common. Row 6 is a direct violation of your `AGENTS.md`, which makes it the cheapest thing you can point at when you reject.'},
    {code:{name:'read the diff, not the summary',body:'git diff HEAD~1        # what the generated commit actually did\ngit diff --stat        # how big is it really'}}
  ],
  exercise: {
    intro: 'Work through the hunt list in the browser first, then use the agent to check your findings. Order matters — form your own view before asking for its opinion.',
    steps: [
      { t:'Run the seven tests yourself', body:[
        {p:'Open `index.html` and work down the table above, writing down what actually happens for each. Do not read the code yet.'},
        {note:{kind:'tip',title:'This is the whole skill',body:'Ninety seconds of deliberate testing finds more than fifteen minutes of reading code for plausibility. Plausible and correct are different properties.'}}
      ]},
      { t:'Now read the code for the two worst findings', body:[
        {p:'Only now open the file. For each defect you found, locate the line responsible. If you cannot find it, that itself is a finding — code you cannot follow is code you cannot own.'},
        {code:{name:'terminal',body:'git diff HEAD~1'}}
      ]},
      { t:'Ask for omissions against your rules', body:[
        {p:'Paste your seven rules back in and make it check them one by one:'},
        {code:{name:'opencode prompt',body:'Check index.html against these rules, one by one. For each,\nsay PASS or FAIL and cite the line.\n\n  1. 3x3 board of <button> cells\n  2. X goes first, players alternate\n  3. wins by row, column and BOTH diagonals are detected\n  4. a full board with no winner is announced as a draw\n  5. clicking an occupied cell does nothing\n  6. play stops once the game is over\n  7. Reset starts a completely clean game\n\nDo not fix anything. Just report.'}},
        {p:'Compare its list against yours. Where it disagrees with what you saw in the browser, **the browser wins** — verify before you believe.'}
      ]},
      { t:'Reject specifically', body:[
        {p:'Name the rule, the symptom and the line. A vague rejection produces a vague retry:'},
        {code:{name:'opencode prompt',body:'Two failures to fix, nothing else:\n\n1. Rule 4: filling the board with no winner leaves the status\n   line unchanged. It must announce a draw.\n2. Rule 6: after X wins I can still click empty cells and the\n   board updates. Play must stop when the game is over.\n\nChange only those two behaviours. Do not restructure anything.'}}
      ]},
      { t:'Re-test, then commit the fixes separately', body:[
        {p:'A fix is a change, and changes get reviewed. Re-run the two tests that failed, plus one that passed before — fixes often break neighbours.'},
        {code:{name:'terminal',body:'git diff        # read it yourself first'}},
        {p:'Then hand the commit to the agent, on the same terms as the baseline — it proposes, you approve:'},
        {code:{name:'opencode prompt',body:'Commit the two fixes. Propose the command and message first;\ndo not run anything until I say go.'}},
        {p:'`git add index.html` and `git commit -m "Announce draws and stop play after a win"` by hand does the same job — the approval step is what matters, not who types it.'}

  expected: 'A written list of what each of the seven tests actually did, at least two genuine defects found and fixed, and a separate commit containing only those fixes.',

    'You located the line responsible for at least one of them',
    'Your rejection named the rule, the symptom and the line',

  checkpoint: [
    { q:'Why can a diff never show you a missing draw check?',
      options:['Diffs hide whitespace','A diff records what changed, never what was never written','The file is too long','Generated code has no comments'],

      explain:'Additions and deletions are all a diff can contain, so an omission leaves no trace in it. That is why review needs an explicit list of required behaviours rather than just careful reading.' },
    { q:'The agent reports rule 6 as PASS, but in the browser you can still click after winning. Who is right?',
      options:['The agent — it read the code','The browser — it is running the actual behaviour','Whichever the tests agree with','Impossible to tell'],

{
  id: 6,
  title: 'Validate the Edges',
  short: 'Validate',
  minutes: 9,
  why: 'Module 5 checked the rules you wrote. Validation asks the harder question: what about the inputs nobody wrote a rule for? A double-click, a rapid reset mid-game, a keyboard-only player. Generated code clusters tightly around the happy path, and the gaps are predictable enough to be a checklist.',
  objective: 'Test the edges the rules never mentioned, and fix or record what breaks.',
  concept: [
    {p:'Everyone stops at "it works". The rungs above that are where the defects actually live.'},
    {table:{head:['Rung','For this game'],rows:[
      ['**1. It runs**','Opens from `file://`, no console errors'],
      ['**2. Rules pass**','The seven from Module 5'],
      ['**3. Edge cases**','Double-click, keyboard, reset timing, rapid clicks'],
      ['**4. Accessibility**','Tab reaches every cell; Enter and Space activate'],
      ['**5. Regression**','Did fixing the draw case break the win case?']

/* Every question was authored with the correct option second, so the
   options are permuted once at load — before any state exists. The
   engine stores option indexes (disabled wrong answers, the final's
   answers), and they all refer to this order. Reload reshuffles;
   nothing persisted holds an index. */
function shuffleOptions(q) {
  const tagged = q.options.map((o, i) => ({ o: o, correct: i === q.answer }));
  for (let i = tagged.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = tagged[i]; tagged[i] = tagged[j]; tagged[j] = t;
  }
  q.options = tagged.map(t => t.o);
  q.answer = tagged.findIndex(t => t.correct);
}

/* ============================================================
   2. STORE — one localStorage key.
   NOTE: deliberately NOT 'opencode-lab-v1'. The full lab uses
   that key; sharing it would let either lab wipe the other's
   progress.
   ============================================================ */
const Store = {
  KEY: 'opencode-express-v1',
  subs: [],
  state: null,

  blank() {
    return {
      v: 1,
      theme: null,        // null = follow system
      done: {},           // moduleId -> true
      checks: {},         // "modId:stepIdx" -> true
      checkpoints: {},    // moduleId -> {correct, total}
      quiz: { best: 0, taken: 0, last: null }
    };
  },

  load() {
    try {
      const raw = localStorage.getItem(this.KEY);
      this.state = raw ? Object.assign(this.blank(), JSON.parse(raw)) : this.blank();
    } catch (e) {
      this.state = this.blank();
    }
    return this.state;
  },

  save() {
    try { localStorage.setItem(this.KEY, JSON.stringify(this.state)); } catch (e) { /* private mode */ }
    this.subs.forEach(fn => fn(this.state));
  },

  subscribe(fn) { this.subs.push(fn); },
  update(fn) { fn(this.state); this.save(); },
  reset() { this.state = this.blank(); this.save(); }
};

/* ============================================================
   3. SCORER — pure over state
   ============================================================ */
const Scorer = {
  totalSteps() { return MODULES.reduce((n, m) => n + m.exercise.steps.length, 0); },
  totalCheckpoints() { return MODULES.reduce((n, m) => n + m.checkpoint.length, 0); },
  totalMinutes() { return MODULES.reduce((n, m) => n + m.minutes, 0); },

  maxScore() { return 100; },

  rawMax() {
    return this.totalSteps() * POINTS.step
         + MODULES.length * POINTS.module
         + this.totalCheckpoints() * POINTS.checkpoint
         + FINAL_COUNT * POINTS.finalPerCorrect;
  },

  score(s) {
    return this.rawMax() ? Math.min(100, Math.round(this.rawScore(s) / this.rawMax() * 100)) : 0;
  },

  rawScore(s) {
    let n = Object.keys(s.checks).length * POINTS.step;
    n += Object.keys(s.done).length * POINTS.module;
    Object.keys(s.checkpoints).forEach(k => { n += s.checkpoints[k].correct * POINTS.checkpoint; });
    n += Math.round(s.quiz.best / 100 * FINAL_COUNT) * POINTS.finalPerCorrect;
    return n;
  },

  modulesDone(s) { return MODULES.filter(m => s.done[m.id]).length; },
  percent(s) { return MODULES.length ? Math.round(this.modulesDone(s) / MODULES.length * 100) : 0; },
  minutesLeft(s) { return MODULES.filter(m => !s.done[m.id]).reduce((n, m) => n + m.minutes, 0); },
  stepsDone(s) { return Object.keys(s.checks).length; },
  // Steps of one module still unticked — the gate on marking it complete.
  stepsLeft(m, s) { return m.exercise.steps.filter((st, i) => !s.checks[m.id + ':' + i]).length; },
  complete(s) { return this.modulesDone(s) === MODULES.length; },

  currentModule(s) {
    return MODULES.find(m => !s.done[m.id]) || MODULES[MODULES.length - 1];
  }
};

/* ============================================================
   4. RENDER
   ============================================================ */
const esc = t => String(t)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;');

const md = t => esc(t)
  .replace(/`([^`]+)`/g, '<code>$1</code>')
  .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

let codeSeq = 0;
const codeStore = {};

function codeBlock(name, body) {
  const id = 'c' + (++codeSeq);
  codeStore[id] = body;
  return '<div class="code">'
    + '<div class="code-head"><span class="code-name">' + esc(name) + '</span>'
    + '<button class="copy" data-action="copy" data-code="' + id + '">Copy</button></div>'
    + '<pre><code>' + esc(body) + '</code></pre></div>';
}

function blocks(list) {
  if (!list) return '';
  return list.map(b => {
    if (b.p) return '<p>' + md(b.p) + '</p>';
    if (b.list) return '<ul class="bullets">' + b.list.map(i => '<li>' + md(i) + '</li>').join('') + '</ul>';
    if (b.code) return codeBlock(b.code.name, b.code.body);
    if (b.table) return '<div class="table-wrap"><table><thead><tr>'
      + b.table.head.map(h => '<th>' + md(h) + '</th>').join('')
      + '</tr></thead><tbody>'
      + b.table.rows.map(r => '<tr>' + r.map(c => '<td>' + md(c) + '</td>').join('') + '</tr>').join('')
      + '</tbody></table></div>';
    if (b.note) return '<div class="callout ' + b.note.kind + '"><div class="ct">' + esc(b.note.title) + '</div><p>' + md(b.note.body) + '</p></div>';
    return '';
  }).join('');
}

const Render = {

  dashboard(s) {
    const cur = Scorer.currentModule(s);
    return ''
      + '<section class="hero">'
      +   '<h1>Build a Game. Learn the Workflow.</h1>'
      +   '<p class="lead">Sixty minutes, one mission: build a tic-tac-toe game with OpenCode &mdash; and learn the habits that make AI a reliable teammate rather than a liability. You will write standing orders, turn a prompt into a task, reject a plan, review generated code, hunt real defects, and package what you learned as a reusable Skill.</p>'
      +   '<div class="btn-row">'
      +     '<button class="btn" data-action="go" data-route="module/' + cur.id + '">'
      +       (Scorer.modulesDone(s) ? 'Continue: ' + esc(cur.short) : 'Start Module 1') + '</button>'
      +     '<button class="btn ghost" data-action="go" data-route="quiz">Final quiz</button>'
      +   '</div>'

      + '<div class="stats">'
      +   this.stat(Scorer.percent(s) + '%', 'Progress', Scorer.modulesDone(s) + ' of ' + MODULES.length + ' modules')
      +   this.stat(Scorer.minutesLeft(s) + ' min', 'Remaining', 'of ' + Scorer.totalMinutes() + ' total')
      +   this.stat(Scorer.stepsDone(s) + '', 'Steps done', 'of ' + Scorer.totalSteps())

      + '<section class="card"><div class="sec-label">The hour</div><div class="agenda">'

  // '1 point' / '4 points' — the weights are small enough that plurals matter now.

  quiz(s) {

      + '<span class="pill">' + QUIZ_BANK.length + ' in the bank</span>'

      + (s.quiz.best ? '<span class="pill solved">Best ' + s.quiz.best + '%</span>' : '')
      + '</div></header>'
      + '<section class="card">' + Quiz.renderFinal(s) + '</section>';
  },

  summary(s) {
    const done = Scorer.modulesDone(s), total = MODULES.length;
    const complete = Scorer.complete(s);
    const passed = s.quiz.best >= PASS_MARK;

    let h = '<header class="module-head"><div class="crumb">Finish</div>'

    if (!complete) {
      h += '<section class="card"><div class="sec-label">Outstanding</div>'

        + '<div class="agenda" style="margin-top:14px">'
        + MODULES.filter(m => !s.done[m.id]).map(m =>
            '<button class="agenda-row" data-action="go" data-route="module/' + m.id + '">'
            + '<span class="an">' + m.id + '</span><span class="at">' + esc(m.short) + '</span>'
            + '<span class="am">' + m.minutes + ' min</span></button>').join('')
        + '</div>'
        + '<div class="btn-row"><button class="btn" data-action="go" data-route="module/' + Scorer.currentModule(s).id + '">Continue</button></div>'

    h += '<div class="stats">'

      + '<ul class="bullets">'
      +   '<li>`AGENTS.md` written **before** any code, and updated after</li>'

         ['Own every line','If you cannot explain it, it does not ship.']
        ].map(r => '<tr><td style="width:190px"><strong>' + esc(r[0]) + '</strong></td><td>' + md(r[1]) + '</td></tr>').join('')
      + '</tbody></table></div></section>';

  notFound() {

/* Confetti for a passed final. Canvas, no dependency — the offline
   rule allows nothing to be loaded. Silent under reduced motion; the
   result callout already states the outcome in words.
   ponytail: sized once, no resize handler — the burst lasts ~4s. */
function confetti() {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.createElement('canvas');
  c.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:60';
  c.width = window.innerWidth;
  c.height = window.innerHeight;
  document.body.appendChild(c);

  const ctx = c.getContext('2d');
  const colors = ['#4f46e5', '#818cf8', '#059669', '#b45309', '#ede9fe'];
  const bits = Array.from({ length: 90 }, () => ({
    x: Math.random() * c.width,
    y: -20 - Math.random() * 300,
    r: 4 + Math.random() * 5,
    vx: -1 + Math.random() * 2,
    vy: 4 + Math.random() * 5,
    a: Math.random() * Math.PI,
    va: -0.1 + Math.random() * 0.2,
    col: colors[Math.floor(Math.random() * colors.length)]
  }));

  (function frame() {
    ctx.clearRect(0, 0, c.width, c.height);
    let live = 0;
    bits.forEach(b => {
      b.x += b.vx; b.y += b.vy; b.a += b.va;
      if (b.y < c.height + 20) live++;
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.a);
      ctx.fillStyle = b.col;
      ctx.fillRect(-b.r, -b.r / 2, b.r * 2, b.r);
      ctx.restore();
    });
    if (live) requestAnimationFrame(frame); else c.remove();
  })();
}

/* ============================================================
   5. QUIZ — checkpoints stay open until correct;
   the final allows one answer per question.
   ============================================================ */
const Quiz = {
  cp: {},
  final: null,

  cpState(id) { return this.cp[id] || (this.cp[id] = { wrong: {}, solved: {}, firstTry: {} }); },
  cpOpen(m) {
    const st = this.cpState(m.id);
    return m.checkpoint.filter((q, i) => !st.solved[i]).length;
  },

  renderCheckpoint(m, s) {
    const st = this.cpState(m.id);
    const saved = s.checkpoints[m.id];
    const open = this.cpOpen(m);
    const total = m.checkpoint.length;

    let h = '<p>' + (total === 2 ? 'Both questions' : 'All ' + total + ' questions') + ' must be answered correctly. A wrong answer is flagged and stays open &mdash; only a <strong>first-attempt</strong> hit scores ' + Render.pts(POINTS.checkpoint) + '.</p>';

    h += '<div class="callout ' + (open ? 'warn' : 'tip') + '" style="margin-bottom:18px"><div class="ct">'
       + (open ? '&#9873; ' + open + ' of ' + total + ' still to fix' : '&#10003; All ' + total + ' resolved')
       + '</div></div>';

    m.checkpoint.forEach((q, qi) => {
      const wrong = st.wrong[qi] || [];
      const solved = !!st.solved[qi];

      h += '<div style="margin-bottom:24px">';
      h += '<div class="quiz-q">' + (qi + 1) + '. ' + md(q.q)
         + (solved ? ' <span class="pill solved">&#10003; solved</span>'
                   : (wrong.length ? ' <span class="pill retry">&#9873; retry</span>' : ''))
         + '</div>';

      q.options.forEach((o, oi) => {
        const isWrong = wrong.indexOf(oi) > -1;
        let cls = 'opt';
        if (solved && oi === q.answer) cls += ' right';
        else if (isWrong) cls += ' wrong';
        h += '<button class="' + cls + '" data-action="cp-answer" data-m="' + m.id + '" data-q="' + qi + '" data-o="' + oi + '"'
           + (solved || isWrong ? ' disabled' : '') + '>'
           + '<span class="k">' + 'ABCD'[oi] + '</span><span>' + md(o) + '</span></button>';
      });

      if (solved) {
        h += '<div class="callout tip explain"><div class="ct">&#10003; Correct'
           + (st.firstTry[qi] ? ' &mdash; first attempt, +' + Render.pts(POINTS.checkpoint) : ' &mdash; no points, ' + wrong.length + ' miss(es)')
           + '</div><p>' + md(q.explain) + '</p></div>';
      } else if (wrong.length) {
        h += '<div class="callout danger explain"><div class="ct">&#9873; Not correct &mdash; try again</div>'
           + '<p>That option is ruled out. The explanation appears once you get it right.</p></div>';
      }
      h += '</div>';
    });

    if (saved) {
      h += '<div class="callout best"><div class="ct">Checkpoint recorded</div><p>'
         + saved.correct + ' of ' + saved.total + ' on the first attempt &mdash; '
         + Render.pts(saved.correct * POINTS.checkpoint) + ' banked.</p></div>';
    }
    return h;
  },

  answerCheckpoint(mId, qi, oi) {
    const m = MODULES.find(x => x.id === mId);
    const st = this.cpState(mId);
    if (st.solved[qi] || (st.wrong[qi] || []).indexOf(oi) > -1) return;

    if (oi === m.checkpoint[qi].answer) {
      st.solved[qi] = true;
      st.firstTry[qi] = !(st.wrong[qi] || []).length;
    } else {
      (st.wrong[qi] = st.wrong[qi] || []).push(oi);
    }

    if (this.cpOpen(m) === 0 && !Store.state.checkpoints[mId]) {
      const correct = m.checkpoint.filter((q, i) => st.firstTry[i]).length;
      Store.update(s => { s.checkpoints[mId] = { correct: correct, total: m.checkpoint.length }; });
    } else {
      Store.save();
    }
  },

  draw(n) {
    const pool = QUIZ_BANK.slice();
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = pool[i]; pool[i] = pool[j]; pool[j] = t;
    }
    return pool.slice(0, Math.min(n, pool.length));
  },

  start() { this.final = { qs: this.draw(FINAL_COUNT), i: 0, answers: [], chosen: undefined }; },

  renderFinal(s) {
    const f = this.final;

    if (!f) {
      return '<h2>Before you begin</h2>'
        + '<p>' + FINAL_COUNT + ' questions drawn at random, one at a time, with an explanation after each answer. Pass mark is ' + PASS_MARK + '%. Retake as often as you like &mdash; a different set is drawn each time and your best score is kept.</p>'
        + (s.quiz.taken ? '<div class="callout info"><div class="ct">Previous attempts</div><p>Taken ' + s.quiz.taken + ' time(s). Best ' + s.quiz.best + '%.</p></div>' : '')
        + '<div class="btn-row"><button class="btn" data-action="quiz-start">Start</button></div>';
    }

    if (f.done) {
      const correct = f.answers.filter(a => a).length;
      const pct = Math.round(correct / f.qs.length * 100);
      const pass = pct >= PASS_MARK;
      return '<h2>' + (pass ? 'Passed' : 'Not passed yet') + '</h2>'
        + '<div class="stats" style="margin:18px 0">'
        +   Render.stat(pct + '%', 'Score', correct + ' of ' + f.qs.length)
        +   Render.stat(s.quiz.best + '%', 'Best', 'over ' + s.quiz.taken + ' attempt(s)')
        + '</div>'
        + '<div class="callout ' + (pass ? 'tip' : 'warn') + '"><div class="ct">' + (pass ? 'Well done' : 'Pass mark is ' + PASS_MARK + '%') + '</div>'
        + '<p>' + (pass ? 'You have a working command of the workflow. Everything here scales to real services — the full 14-chapter lab takes it further.' : 'Revisit the modules covering what you missed, then retake — a different set is drawn each time.') + '</p></div>'
        + '<div class="btn-row"><button class="btn" data-action="quiz-start">Retake</button>'
        + '<button class="btn ghost" data-action="go" data-route="dashboard">Back to start</button></div>';
    }

    const q = f.qs[f.i];
    const chosen = f.chosen;
    let h = '<div class="quiz-bar"><span class="bar"><i style="width:' + (f.i / f.qs.length * 100) + '%"></i></span>'
          + '<span class="quiz-count">' + (f.i + 1) + ' / ' + f.qs.length + '</span></div>'
          + '<div class="crumb">' + esc(q.topic) + '</div>'
          + '<div class="quiz-q">' + md(q.q) + '</div>';

    q.options.forEach((o, oi) => {
      let cls = 'opt';
      if (chosen !== undefined) {
        if (oi === q.answer) cls += ' right';
        else if (oi === chosen) cls += ' wrong';
      }
      h += '<button class="' + cls + '" data-action="q-answer" data-o="' + oi + '"'
         + (chosen !== undefined ? ' disabled' : '') + '>'
         + '<span class="k">' + 'ABCD'[oi] + '</span><span>' + md(o) + '</span></button>';
    });

    if (chosen !== undefined) {
      h += '<div class="callout ' + (chosen === q.answer ? 'tip' : 'warn') + ' explain">'
         + '<div class="ct">' + (chosen === q.answer ? '&#10003; Correct' : '&#10007; Incorrect') + '</div>'
         + '<p>' + md(q.explain) + '</p></div>'
         + '<div class="btn-row"><button class="btn" data-action="q-next">'
         + (f.i === f.qs.length - 1 ? 'See results' : 'Next question') + '</button></div>';
    }
    return h;
  },

  answerFinal(oi) {
    const f = this.final;
    if (!f || f.chosen !== undefined) return;
    f.chosen = oi;
    f.answers.push(oi === f.qs[f.i].answer);
  },

  nextFinal() {
    const f = this.final;
    if (f.i === f.qs.length - 1) {
      f.done = true;
      const pct = Math.round(f.answers.filter(a => a).length / f.qs.length * 100);
      Store.update(s => {
        s.quiz.taken++;
        s.quiz.last = pct;
        if (pct > s.quiz.best) s.quiz.best = pct;
      });
      if (pct >= PASS_MARK) confetti();
    } else {
      f.i++;
      f.chosen = undefined;
    }
  }
};

/* ============================================================
   6. ROUTER + BOOT
   ============================================================ */
const App = {
  lastRoute: null,

  route() { return (location.hash || '#/dashboard').replace(/^#\/?/, '') || 'dashboard'; },
  go(r) { location.hash = '#/' + r; },

  render() {
    const s = Store.state;
    const r = this.route();
    const view = document.getElementById('view');
    // Ticking a box re-renders in place — only a real navigation scrolls to top.
    const moved = r !== this.lastRoute;
    const y = window.scrollY || 0;
    codeSeq = 0;

    let html;
    if (r === 'dashboard') html = Render.dashboard(s);
    else if (r === 'quiz') html = Render.quiz(s);
    else if (r === 'summary') html = Render.summary(s);
    else if (r.indexOf('module/') === 0) {
      const m = MODULES.find(x => x.id === parseInt(r.split('/')[1], 10));
      html = m ? Render.module(m, s) : Render.notFound();
    } else html = Render.notFound();

    view.innerHTML = html;
    this.lastRoute = r;
    window.scrollTo(0, moved ? 0 : y);
    this.renderNav();
    this.renderStats();
    if (moved) document.body.classList.remove('nav-open');
  },

  renderNav() {
    const s = Store.state, r = this.route();
    let h = '<div class="nav-items">'
      + '<button class="nav-item' + (r === 'dashboard' ? ' active' : '') + '" data-action="go" data-route="dashboard">'
      + '<span class="n">&#9638;</span><span class="t">Start here</span></button></div>'
      + '<div class="nav-head">The hour</div><div class="nav-items">'
      + MODULES.map(m => {
          const active = r === 'module/' + m.id;
          const done = !!s.done[m.id];
          return '<button class="nav-item' + (active ? ' active' : '') + (done ? ' done' : '') + '" data-action="go" data-route="module/' + m.id + '">'
            + '<span class="n">' + (done ? '&#10003;' : m.id) + '</span>'
            + '<span class="t">' + esc(m.short) + '</span>'
            + '<span class="mins">' + m.minutes + 'm</span></button>';
        }).join('')
      + '</div>'
      + '<div class="nav-head">Finish</div><div class="nav-items">'
      + '<button class="nav-item' + (r === 'summary' ? ' active' : '') + (Scorer.complete(s) ? ' done' : '') + '" data-action="go" data-route="summary">'
      + '<span class="n">&#9873;</span><span class="t">Summary</span></button>'
      + '<button class="nav-item' + (r === 'quiz' ? ' active' : '') + '" data-action="go" data-route="quiz">'
      + '<span class="n">&#9634;</span><span class="t">Final quiz</span></button>'
      + '</div>';
    document.getElementById('nav').innerHTML = h;
  },

  renderStats() {
    const s = Store.state;
    document.getElementById('sidePct').textContent = Scorer.percent(s) + '%';
    document.getElementById('sideBar').style.width = Scorer.percent(s) + '%';
    document.getElementById('sideDone').textContent = Scorer.modulesDone(s);
    document.getElementById('sideTotal').textContent = MODULES.length;
    document.getElementById('sideLeft').textContent = Scorer.minutesLeft(s);
    document.getElementById('topScore').textContent = Scorer.score(s) + '/100';
    document.getElementById('topTime').textContent = Scorer.minutesLeft(s) + ' min left';
  },

  applyTheme() {
    const t = Store.state.theme
      || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', t);
    document.getElementById('themeBtn').innerHTML = t === 'dark' ? '&#9728;' : '&#9681;';
  },

  toggleTheme() {
    const cur = document.documentElement.getAttribute('data-theme');
    Store.update(s => { s.theme = cur === 'dark' ? 'light' : 'dark'; });
    this.applyTheme();
  },

  /* copy — file:// is not always a secure context */
  copy(btn) {
    const text = codeStore[btn.dataset.code] || '';
    const ok = () => {
      btn.textContent = 'Copied';
      btn.classList.add('ok');
      setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('ok'); }, 1400);
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(ok, () => this.copyFallback(text, ok));
    } else {
      this.copyFallback(text, ok);
    }
  },

  copyFallback(text, ok) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); ok(); } catch (e) { /* unavailable */ }
    document.body.removeChild(ta);
  },

  bind() {
    document.addEventListener('click', e => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const a = el.dataset.action;

      if (a === 'go') this.go(el.dataset.route);
      else if (a === 'theme') this.toggleTheme();
      else if (a === 'copy') this.copy(el);
      else if (a === 'toggle-nav') document.body.classList.toggle('nav-open');
      else if (a === 'close-nav') document.body.classList.remove('nav-open');
      else if (a === 'check') {
        const k = el.dataset.key;
        Store.update(s => {
          if (s.checks[k]) {
            delete s.checks[k];
            delete s.done[k.split(':')[0]];   // a module with an unticked step is not complete
          } else s.checks[k] = true;
        });
        this.render();
      }
      else if (a === 'done') {
        const id = parseInt(el.dataset.id, 10);
        const m = MODULES.find(x => x.id === id);
        Store.update(s => {
          if (s.done[id]) delete s.done[id];
          else if (!Scorer.stepsLeft(m, s)) s.done[id] = true;   // the rule, not just the disabled button
        });
        this.render();
      }
      else if (a === 'cp-answer') {
        Quiz.answerCheckpoint(parseInt(el.dataset.m, 10), parseInt(el.dataset.q, 10), parseInt(el.dataset.o, 10));
        this.render();
      }
      else if (a === 'quiz-start') { Quiz.start(); this.render(); }
      else if (a === 'q-answer') { Quiz.answerFinal(parseInt(el.dataset.o, 10)); this.render(); }
      else if (a === 'q-next') { Quiz.nextFinal(); this.render(); }
      else if (a === 'reset') {
        if (confirm('Reset all progress in the Express lab? The full lab is not affected.')) {
          Store.reset(); Quiz.cp = {}; Quiz.final = null; this.applyTheme(); this.render();
        }
      }
    });

    window.addEventListener('hashchange', () => this.render());
  },

  boot() {
    Store.load();
    this.applyTheme();
    this.bind();
    this.render();
  }
};

App.boot();
</script>
